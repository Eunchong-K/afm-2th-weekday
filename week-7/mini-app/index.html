    // ========================================
    // 🔀 Subscription Context (localStorage)
    // ========================================
    const SubscriptionContext = createContext(null);

    function loadSubscription() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { paid: false, plan: null };
        const parsed = JSON.parse(raw);
        return { paid: !!parsed.paid, plan: parsed.plan ?? null };
      } catch (_) {
        return { paid: false, plan: null };
      }
    }

    function SubscriptionProvider({ children }) {
      const [state, setState] = useState(loadSubscription);

      const subscribe = useCallback((plan) => {
        const next = { paid: true, plan };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
        setState(next);
      }, []);

      const unsubscribe = useCallback(() => {
        localStorage.removeItem(STORAGE_KEY);
        setState({ paid: false, plan: null });
      }, []);

      // Stay in sync with other tabs
      useEffect(() => {
        const onStorage = (e) => {
          if (e.key === STORAGE_KEY) setState(loadSubscription());
        };
        window.addEventListener("storage", onStorage);
        return () => window.removeEventListener("storage", onStorage);
      }, []);

      const value = useMemo(
        () => ({ ...state, subscribe, unsubscribe }),
        [state, subscribe, unsubscribe]
      );

      return (
        <SubscriptionContext.Provider value={value}>
          {children}
        </SubscriptionContext.Provider>
      );
    }

    function useSubscription() {
      const ctx = useContext(SubscriptionContext);
      if (!ctx) throw new Error("useSubscription must be used within SubscriptionProvider");
      return ctx;
    }

    // ========================================
    // 🔀 Hash Router
    // ========================================
    function useHashRoute() {
      const getRoute = () => {
        const h = window.location.hash || "#/";
        return h.startsWith("#") ? h.slice(1) : h;
      };
      const [route, setRoute] = useState(getRoute);
      useEffect(() => {
        const onHash = () => setRoute(getRoute());
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      return route;
    }

    function navigate(path) {
      if (window.location.hash !== `#${path}`) {
        window.location.hash = path;
      }
    }

      );
    }

            <ArrowLeftIcon className="w-4 h-4" />
            돌아가기
          </Link>

          <h1 className="text-3xl sm:text-4xl font-bold text-white">
            플랜을 선택하세요
          </h1>
          <p className="mt-2 text-slate-400">
            언제든지 변경하거나 해지할 수 있어요. (목업 화면입니다)
          </p>

          {/* Plan Cards */}
          <div className="mt-8 grid grid-cols-1 md:grid-cols-3 gap-5">
            {PLANS.map((p) => {
              const active = selectedId === p.id;
              return (
                <button
                  key={p.id}
                  onClick={() => setSelectedId(p.id)}
                  className={`text-left rounded-2xl p-6 border transition-all duration-200 relative ${
                    active
                      ? "bg-slate-800 border-violet-500 ring-2 ring-violet-500/40 shadow-xl shadow-violet-500/20"
                      : "bg-slate-800/60 border-slate-700 hover:border-slate-500"
                  }`}
                >
                  {p.popular && (
                    <span className="absolute -top-3 right-5 bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white text-xs font-bold px-3 py-1 rounded-full">
                      인기
                    </span>
                  )}
                  <div className={`text-xs font-semibold uppercase tracking-wider bg-gradient-to-r ${p.accent} bg-clip-text text-transparent`}>
                    {p.tagline}
                  </div>
                  <div className="mt-2 flex items-baseline justify-between">
                    <h3 className="text-2xl font-bold text-white">{p.name}</h3>
                    {active && (
                      <span className="w-6 h-6 rounded-full bg-violet-500 text-white flex items-center justify-center">
                        <CheckIcon className="w-4 h-4" />
                      </span>
                    )}
                  </div>
                  <div className="mt-4 flex items-baseline gap-1">
                    <span className="text-3xl font-extrabold text-white">
                      ₩{p.price.toLocaleString()}
                    </span>
                    <span className="text-sm text-slate-400">/월</span>
                  </div>
                  <ul className="mt-5 space-y-2.5">
                    {p.features.map((f, i) => (
                      <li key={i} className="flex items-start gap-2 text-sm text-slate-300">
                        <CheckIcon className="w-4 h-4 mt-0.5 text-violet-400 flex-shrink-0" />
                        <span>{f}</span>
                      </li>
                    ))}
                  </ul>
                </button>
              );
            })}
          </div>

          {/* Summary */}
          <Card className="mt-10 p-6 sm:p-7">
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-5">
              <div>
                <div className="text-sm text-slate-400">선택한 플랜</div>
                <div className="mt-1 flex items-center gap-2">
                  <span className="text-xl font-bold text-white">
                    Lumina {selected.name}
                  </span>
                  <Badge color="violet">월간</Badge>
                </div>
                <div className="mt-1 text-sm text-slate-400">
                  {selected.tagline} · 매월 자동결제
                </div>
              </div>
              <div className="text-right">
                <div className="text-sm text-slate-400">월 결제 금액</div>
                <div className="mt-0.5 text-3xl font-extrabold text-white">
                  ₩{selected.price.toLocaleString()}
                </div>
              </div>
            </div>

            <div className="mt-6 border-t border-slate-700/70 pt-6 flex flex-col sm:flex-row gap-3">
              <Button
                variant="primary"
                size="lg"
                onClick={handlePay}
                disabled={submitting}
                className="flex-1"
              >
                {submitting ? (
                  <>
                    <svg className="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
                      <circle cx="12" cy="12" r="10" stroke="currentColor" strokeOpacity="0.25" strokeWidth="4"></circle>
                      <path d="M4 12a8 8 0 0 1 8-8" stroke="currentColor" strokeWidth="4" strokeLinecap="round"></path>
                    </svg>
                    결제 처리중...
                  </>
                ) : (
                  <>
                    {selected.name}으로 결제하기
                    <ArrowRightIcon className="w-4 h-4" />
                  </>
                )}
              </Button>
              <Link to="/" className="sm:w-auto">
                <Button variant="ghost" size="lg" className="w-full sm:w-auto">
                  취소
                </Button>
              </Link>
            </div>

            {paid && (
              <p className="mt-4 text-xs text-amber-300/90 bg-amber-500/10 border border-amber-500/30 rounded-lg px-3 py-2">
                현재 <strong>{currentPlan}</strong> 플랜 구독중입니다. 결제 시 선택한 플랜으로 변경됩니다.
              </p>
            )}
          </Card>

          <p className="mt-6 text-xs text-slate-500 text-center">
            * 본 화면은 UI 목업이며 실제 결제는 발생하지 않습니다.
          </p>
        </div>
      );
    }

    // ========================================
    // 📄 Page: Content (Protected)
    // ========================================
    function ContentPage() {
      const { paid, plan, unsubscribe } = useSubscription();

      // Access control
      useEffect(() => {
        if (!paid) navigate("/");
      }, [paid]);

      if (!paid) {
        return (
          <div className="max-w-6xl mx-auto px-4 sm:px-6 py-20 text-center text-slate-400">
            접근 권한 확인 중...
          </div>
        );
      }

      const handleLogout = () => {
        if (window.confirm("정말 구독을 취소하시겠어요? 컨텐츠 접근이 제한됩니다.")) {
          unsubscribe();
          navigate("/");
        }
      };

      return (
        <div className="page-fade max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
          {/* Header section */}
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <Badge color="green">
                <CheckIcon className="w-3 h-3" />
                구독자 전용 페이지
              </Badge>
              <h1 className="mt-3 text-3xl sm:text-4xl font-bold text-white">
                프리미엄 라이브러리
              </h1>
              <p className="mt-2 text-slate-400">
                반갑습니다. 오늘은 어떤 컨텐츠를 만나보시겠어요?
              </p>
            </div>
            <div className="flex items-center gap-2">
              <Badge color="violet" className="text-sm py-1.5 px-3">
                <SparkleIcon className="w-3.5 h-3.5" />
                {plan} 플랜
              </Badge>
              <Button variant="ghost" size="sm" onClick={handleLogout}>
                <LogoutIcon className="w-4 h-4" />
                구독 취소
              </Button>
            </div>
          </div>

          {/* Stats strip */}
          <div className="mt-8 grid grid-cols-3 gap-3 sm:gap-4">
            {[
              { label: "총 컨텐츠", value: "128+" },
              { label: "이번 주 신규", value: "12" },
              { label: "독점 컨텐츠", value: "24" },
            ].map((s, i) => (
              <Card key={i} className="p-4 text-center">
                <div className="text-2xl font-extrabold text-white">{s.value}</div>
                <div className="text-xs text-slate-400 mt-0.5">{s.label}</div>
              </Card>
            ))}
          </div>

          {/* Content Grid */}
          <div className="mt-10">
            <h2 className="text-xl font-bold text-white mb-5">최신 컨텐츠</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              {PREMIUM_CONTENTS.map((c) => (
                <Card
                  key={c.id}
                  className="overflow-hidden card-glow hover:-translate-y-1 hover:border-violet-500/40 cursor-pointer group"
                >
                  <div className={`h-40 ${c.thumb} relative overflow-hidden`}>
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900/70 via-transparent to-transparent"></div>
                    <div className="absolute bottom-3 left-3">
                      <Badge color="slate" className="bg-slate-900/70 backdrop-blur-sm">
                        {c.category}
                      </Badge>
                    </div>
                  </div>
                  <div className="p-5">
                    <h3 className="text-lg font-semibold text-white group-hover:text-violet-300 transition">
                      {c.title}
                    </h3>
                    <p className="mt-2 text-sm text-slate-400 leading-relaxed line-clamp-2">
                      {c.desc}
                    </p>
                    <div className="mt-4 flex items-center justify-between text-xs text-slate-500">
                      <span>5분 분량</span>
                      <span className="inline-flex items-center gap-1 text-violet-400 font-medium opacity-0 group-hover:opacity-100 transition">
                        읽기 <ArrowRightIcon className="w-3 h-3" />
                      </span>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          </div>

          {/* Upgrade hint */}
          {plan !== "Premium" && (
            <Card className="mt-12 p-6 sm:p-7 bg-gradient-to-br from-violet-500/10 to-fuchsia-500/5 border-violet-500/30">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <SparkleIcon className="w-5 h-5 text-violet-400" />
                    <h3 className="font-bold text-white">
                      Premium 플랜으로 업그레이드
                    </h3>
                  </div>
                  <p className="mt-1 text-sm text-slate-300">
                    독점 컨텐츠 24편과 1:1 큐레이션을 모두 누려보세요.
                  </p>
                </div>
                <Link to="/checkout">
                  <Button variant="primary" size="md">
                    플랜 변경하기
                  </Button>
                </Link>
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ========================================
    // 📄 Page: Not Found
    // ========================================
    function NotFoundPage() {
      return (
        <div className="page-fade max-w-2xl mx-auto px-4 py-24 text-center">
          <div className="text-6xl font-extrabold bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">
            404
          </div>
          <h1 className="mt-4 text-2xl font-bold text-white">
            페이지를 찾을 수 없어요
          </h1>
          <p className="mt-2 text-slate-400">요청하신 경로가 존재하지 않습니다.</p>
          <Link to="/" className="inline-block mt-6">
            <Button variant="primary">홈으로 돌아가기</Button>
          </Link>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const route = useHashRoute();

      let page;
      switch (route) {
        case "/":
        case "":
          page = <LandingPage />;
          break;
        case "/checkout":
          page = <CheckoutPage />;
          break;
        case "/content":
          page = <ContentPage />;
          break;
        default:
          page = <NotFoundPage />;
      }

      return (
        <SubscriptionProvider>
          <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100">
            <Header />
            <main className="flex-1">{page}</main>
            <Footer />
          </div>
        </SubscriptionProvider>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
