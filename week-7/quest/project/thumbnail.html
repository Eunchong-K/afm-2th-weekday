<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='UTF-8'>
<link href='https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap' rel='stylesheet'>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1920px; height:1080px; overflow:hidden;
  background:#111;
  font-family:'Noto Sans KR', -apple-system, sans-serif;
}
/* glow */
.g1,.g2 { position:absolute; border-radius:50%; filter:blur(200px); pointer-events:none; }
.g1 { width:500px; height:500px; background:#FF6B4A; opacity:.08; top:-100px; left:0; }
.g2 { width:350px; height:350px; background:#4A7C59; opacity:.06; bottom:0; left:200px; }

.wrap { position:relative; z-index:10; width:1920px; height:1080px; display:flex; align-items:center; }

/* ── LEFT BRAND ── */
.left { width:540px; flex-shrink:0; padding:0 64px; display:flex; flex-direction:column; justify-content:center; }

/* Actual M. logo (black circle, same as app) */
.logo-row { display:flex; align-items:center; gap:14px; margin-bottom:40px; }
.logo-svg { flex-shrink:0; }
.logo-word { font-size:36px; font-weight:700; color:#fff; letter-spacing:-.02em; }

.slogan { font-size:19px; font-style:italic; color:rgba(255,255,255,.38); margin-bottom:48px; }
.div-line { width:36px; height:2px; background:#FF6B4A; border-radius:2px; margin-bottom:44px; }

.feats { display:flex; flex-direction:column; gap:20px; margin-bottom:56px; }
.feat { display:flex; align-items:center; gap:14px; }
.fdot { width:5px; height:5px; border-radius:50%; background:#FF6B4A; flex-shrink:0; }
.ftxt { font-size:18px; color:rgba(255,255,255,.55); }

.year { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.22); margin-bottom:18px; }
.url { display:inline-flex; align-items:center; gap:11px; border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:13px 22px; width:fit-content; }
.ulive { width:7px; height:7px; border-radius:50%; background:#4ade80; flex-shrink:0; }
.utext { font-size:17px; color:rgba(255,255,255,.42); font-family:'Courier New',monospace; }

/* ── PHONES ── */
.phones { flex:1; display:flex; align-items:center; justify-content:center; gap:36px; padding:0 48px; }

.phone {
  flex-shrink:0;
  border-radius:46px;
  overflow:hidden;
  border:1.5px solid rgba(255,255,255,.13);
  box-shadow: 0 60px 140px rgba(0,0,0,.85), 0 0 0 5px rgba(255,255,255,.03);
  position:relative;
}
.phone-main { width:320px; height:680px; }
.phone-side { width:290px; height:610px; opacity:.92; }

.notch {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  background:#111; border-radius:16px; z-index:10;
}
.nm { width:100px; height:26px; }
.ns { width:88px;  height:22px; }

.phone img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }

/* label under each phone */
.phone-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; }
.phone-lbl {
  font-size:13px; font-weight:500; letter-spacing:.06em; text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
</style>
</head>
<body>
<div class='g1'></div><div class='g2'></div>
<div class='wrap'>

  <!-- BRAND LEFT -->
  <div class='left'>
    <div class='logo-row'>

      <svg class='logo-svg' width='52' height='52' viewBox='0 0 52 52' fill='none'>
        <circle cx='26' cy='26' r='26' fill='#111111' stroke='rgba(255,255,255,0.2)' stroke-width='1.5'/>
        <text x='26' y='37.5' text-anchor='middle'
          font-family='Noto Sans KR, sans-serif'
          font-size='22' font-weight='700' fill='#ffffff'>M.</text>
      </svg>
      <span class='logo-word'>Marked.</span>
    </div>

    <div class='slogan'>Leave your mark, Color your world.</div>
    <div class='div-line'></div>

    <div class='feats'>

    <div class='url'>
