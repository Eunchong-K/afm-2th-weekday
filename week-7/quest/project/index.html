    /* Hide number input spinners */
    input[type="number"]::-webkit-inner-spin-button,

    const calcPace = (km, minutes) => {
      const k = Number(km), m = Number(minutes);
      if (!k || k <= 0 || !m || m <= 0) return null;
      const total = m / k;
      const mm = Math.floor(total);
      const ss = Math.round((total - mm) * 60);
      return { mm, ss, label: `${mm}'${String(ss).padStart(2,'0')}"` };
    };

    const fmtDate = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
      return `${y}.${m}.${day}`;
    };

    const todayIso = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };

    const loadRuns = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return SAMPLE_RUNS;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length === 0) return SAMPLE_RUNS;
        return parsed;
      } catch (e) {
        return SAMPLE_RUNS;
      }
    };

    const saveRuns = (runs) => {

    const loadUser = () => {
      try {

        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) { return null; }
    };
    const saveUser = (u) => {
      try { localStorage.setItem(USER_KEY, JSON.stringify(u)); } catch(e){}
    };
    const clearUser = () => {
      try { localStorage.removeItem(USER_KEY); } catch(e){}
    };

    const downloadCanvas = async (canvas, filename) => {
      try {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], filename, { type: 'image/png' });

        // Mobile: Web Share API → native share sheet (iOS "이미지 저장" / Android 갤러리)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Marked.' });
          return;
        }

        // Desktop fallback: direct download
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = filename;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      } catch(e) {
        if (e.name !== 'AbortError') alert('이미지를 저장할 수 없습니다.');
      }
    };

    // ========================================
    // Router (hash-based)
    // ========================================
    const RouterContext = createContext({ path: 'home', state: null, navigate: () => {} });

    function Router({ children }) {
      const [route, setRoute] = useState(() => parseHash());
      function parseHash(){
        const h = (window.location.hash || '#home').replace(/^#/, '');
        return { path: h.split('?')[0] || 'home' };
      }
      const navStateRef = useRef(null);

      const navigate = useCallback((path, state) => {
        navStateRef.current = state ?? null;
        if (`#${path}` !== window.location.hash) {
          window.location.hash = `#${path}`;
        } else {
          setRoute({ path });
        }
      }, []);

      useEffect(() => {
        const onHash = () => setRoute(parseHash());
        window.addEventListener('hashchange', onHash);
        if (!window.location.hash) window.location.hash = '#home';
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const value = useMemo(() => ({
        path: route.path,
        state: navStateRef.current,
        navigate
      }), [route.path, navigate]);

      return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
    }

    const useRouter = () => useContext(RouterContext);

    // ========================================
    // City Search (Korean-only dropdown)
    // ========================================
    function CitySearch({ city, country, onSelect }) {
      const [query, setQuery] = useState(city || '');
      const [open, setOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => { setQuery(city || ''); }, [city]);

      useEffect(() => {
        const onClick = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener('mousedown', onClick);
        return () => document.removeEventListener('mousedown', onClick);
      }, []);

      const filtered = useMemo(() => {
        if (!query.trim()) return CITIES_KR.slice(0, 12);
        return CITIES_KR.filter(c =>
          c.city.includes(query) || c.country.includes(query)
        ).slice(0, 12);
      }, [query]);

      // Check if the typed query exactly matches a city in the list
      const hasExactMatch = useMemo(() =>
        filtered.some(c => c.city === query.trim()),
      [filtered, query]);

      const handleSelect = (item) => {
        setQuery(item.city);
        onSelect(item.city, item.country);
        setOpen(false);
      };

      const handleCustomSelect = () => {
        const t = query.trim();
        if (!t) return;
        onSelect(t, country); // keep existing country, user fills separately
        setOpen(false);
      };

      const showDropdown = open && (filtered.length > 0 || (query.trim() && !hasExactMatch));

      return (
        <div ref={containerRef} className="relative">
          <input
            value={query}
            onChange={e => { setQuery(e.target.value); setOpen(true); onSelect(e.target.value, country); }}
            onFocus={() => setOpen(true)}
            placeholder="도시 검색 또는 직접 입력"
            className="w-full bg-white border border-border rounded-xl px-4 py-3 text-ink placeholder-muted focus:border-ink outline-none"
          />
          {showDropdown && (
            <div className="absolute z-50 w-full bg-white border border-border rounded-xl mt-1 shadow-lg overflow-hidden max-h-60 overflow-y-auto">
              {filtered.map((item, i) => (
                <button
                  key={i}
                  type="button"
                  onMouseDown={(e)=>{ e.preventDefault(); handleSelect(item); }}
                  className="w-full text-left px-4 py-2.5 hover:bg-bg flex items-center justify-between text-sm border-b border-border last:border-0"
                >
                  <span className="font-medium">{item.city}</span>
                  <span className="text-muted text-xs">{flagOf(item.country)} {item.country}</span>
                </button>
              ))}
              {query.trim() && !hasExactMatch && (
                <button
                  type="button"
                  onMouseDown={(e)=>{ e.preventDefault(); handleCustomSelect(); }}
                  className="w-full text-left px-4 py-2.5 hover:bg-bg flex items-center gap-2 text-sm text-ink border-t border-border"
                >
                  <span className="text-base">＋</span>
                  <span>직접 입력: <strong>{query.trim()}</strong></span>
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // Page: Login
    // ========================================
    function LoginPage() {
      const { navigate } = useRouter();
      const { login } = useAuthCtx();
      const [mode, setMode] = useState('login');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const valid = mode === 'signup'
        ? name.trim() && email.trim() && password.trim()
        : email.trim() && password.trim();

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!valid || loading) return;
        setError('');
        setLoading(true);
        try {
          let userData;
          if (mode === 'signup') {
            userData = await api.post('/api/auth/register', { name: name.trim(), email: email.trim(), password });
          } else {
            userData = await api.post('/api/auth/login', { email: email.trim(), password });
          }
          login(userData);
          navigate('home');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <PhoneFrame>
          <div className="px-6 pt-12 slide-up">
            {/* Logo + wordmark */}
            <div className="flex flex-col items-center text-center mb-10">
              <MarkedLogo size={64} />
              <h1 className="text-5xl text-ink mt-4 font-display" style={{fontFamily:"'Paperozi', 'Noto Sans KR', sans-serif", fontWeight:900}}>Marked.</h1>
              <p className="text-muted mt-2" style={{fontSize:'0.9rem', fontStyle:'italic', letterSpacing:'0.02em'}}>
                Leave your mark, Color your world.
              </p>
            </div>

            {/* Tabs */}
            <div className="grid grid-cols-2 mb-6 bg-white border border-border rounded-full p-1">
              <button
                type="button"
                onClick={() => setMode('login')}
                className={`py-2.5 rounded-full text-sm font-medium transition ${mode==='login' ? 'bg-ink text-white' : 'text-ink'}`}
              >로그인</button>
              <button
                type="button"
                onClick={() => setMode('signup')}
                className={`py-2.5 rounded-full text-sm font-medium transition ${mode==='signup' ? 'bg-ink text-white' : 'text-ink'}`}
              >회원가입</button>
            </div>

            {/* Form */}
            <form onSubmit={handleSubmit} className="space-y-4">
              {mode === 'signup' && (
                <Field label="이름">
                  <Input placeholder="이름을 입력하세요" value={name} onChange={e=>setName(e.target.value)} />
                </Field>
              )}
              <Field label="이메일">
                <Input type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} />
              </Field>
              <Field label="비밀번호">
                <Input type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} />
              </Field>

              {error && (
                <div className="text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
                  {error}
                </div>
              )}

              <Button type="submit" variant="coral" size="lg" className="w-full mt-2" disabled={!valid || loading}>
                {loading ? '처리 중…' : (mode === 'login' ? '로그인하기' : '계정 만들기')}
              </Button>
            </form>

            <button
              onClick={() => navigate('home')}
              className="block mx-auto text-center text-xs text-muted mt-8 hover:text-ink transition"
            >
              ← 둘러보기로 돌아가기
            </button>
          </div>
        </PhoneFrame>
      );
    }

    // Shared world atlas cache — loaded once, reused by globe + stamp
    let _worldAtlas = null;
    const _worldAtlasCbs = [];
    function loadWorldAtlas() {
      if (_worldAtlas) return Promise.resolve(_worldAtlas);
      return fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')
        .then(r => r.json())
        .then(w => { _worldAtlas = w; _worldAtlasCbs.forEach(cb => cb(w)); _worldAtlasCbs.length = 0; return w; });
    }

    // Admin-1 atlas cache — used only by WorldGlobe (province/state/territory level)
    let _admin1Atlas = null;
    function loadAdmin1Atlas() {
      if (_admin1Atlas) return Promise.resolve(_admin1Atlas);
      return fetch('https://cdn.jsdelivr.net/npm/natural-earth-topojson@1.1.5/data/ne_50m_admin_1_states_provinces.json')
        .then(r => { if (!r.ok) throw new Error('admin1 fetch failed'); return r.json(); })
        .then(w => { _admin1Atlas = w; return w; })
        .catch(() => loadWorldAtlas()); // fallback to country-level if CDN fails
    }

    function WorldGlobe({ visitedCountries, visitedCities = [], focusCountry = null }) {
      const svgRef = useRef(null);
      const rotRef = useRef([127, -37]);
      const targetRotRef = useRef(null);
      const [ready, setReady] = useState(false);
      const worldRef = useRef(null);
      const isAdmin1Ref = useRef(false);

      useEffect(() => {
        if (!window.d3 || !window.topojson) return;
        loadAdmin1Atlas().then(w => {
          worldRef.current = w;
          isAdmin1Ref.current = !!(w.objects && w.objects.ne_50m_admin_1_states_provinces);
          setReady(true);
        }).catch(() => {});
      }, []);

      // Rotate globe to focusCountry when it changes
      useEffect(() => {
        if (!focusCountry || !ready || !window.d3 || !window.topojson) return;
        const d3 = window.d3, tp = window.topojson;
        let centroid = null;

        if (isAdmin1Ref.current && worldRef.current) {
          const iso3 = COUNTRY_ISO3[normalizeCountry(focusCountry)];
          if (iso3) {
            const allF = tp.feature(worldRef.current, worldRef.current.objects.ne_50m_admin_1_states_provinces).features;
            const cFeatures = allF.filter(f => f.properties.adm0_a3 === iso3);
            if (cFeatures.length > 0)
              centroid = d3.geoCentroid({ type: 'FeatureCollection', features: cFeatures });
          }
        }
        if (!centroid && _worldAtlas) {
          const isoNum = COUNTRY_ISO_NUM[normalizeCountry(focusCountry)];
          if (isoNum) {
            const feature = tp.feature(_worldAtlas, _worldAtlas.objects.countries).features.find(f => Number(f.id) === isoNum);
            if (feature) centroid = d3.geoCentroid(feature);
          }
        }
        if (centroid) targetRotRef.current = [-centroid[0], -centroid[1]];
      }, [focusCountry, ready]);

      useEffect(() => {
        if (!ready || !svgRef.current || !worldRef.current) return;
        const { d3, topojson: tp } = window;
        const W = 270, H = 270;
        const world = worldRef.current;

        const visitedAdmin1 = new Set(visitedCities.map(c => CITY_TO_ADMIN1[c]).filter(Boolean));
        const visitedISO3 = new Set(visitedCountries.map(n => COUNTRY_ISO3[n]).filter(Boolean));

        const makeTick = (proj, redraw) => {
          let dragging = false;
          let prev = null;
          const svg = d3.select(svgRef.current);
          svg.call(d3.drag()
            .on('start', () => { dragging = true; targetRotRef.current = null; })
            .on('drag', e => {
              const r = rotRef.current;
              rotRef.current = [r[0]+e.dx*0.4, Math.max(-70,Math.min(70,r[1]-e.dy*0.4))];
              proj.rotate(rotRef.current); redraw();
            })
            .on('end', () => { dragging = false; })
          );
          let animId;
          const tick = t => {
            if (!dragging) {
              if (targetRotRef.current) {
                const [tx, ty] = targetRotRef.current;
                const [cx, cy] = rotRef.current;
                const dx = tx - cx, dy = ty - cy;
                if (Math.abs(dx) < 0.3 && Math.abs(dy) < 0.3) {
                  rotRef.current = [tx, ty]; targetRotRef.current = null;
                } else {
                  rotRef.current = [cx + dx * 0.07, cy + dy * 0.07];
                }
                proj.rotate(rotRef.current); redraw(); prev = null;
              } else {
                if (prev !== null) { rotRef.current = [rotRef.current[0]+(t-prev)*0.013, rotRef.current[1]]; proj.rotate(rotRef.current); redraw(); }
                prev = t;
              }
            } else { prev = null; }
            animId = requestAnimationFrame(tick);
          };
          animId = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(animId);
        };

        if (!isAdmin1Ref.current) {
          // Fallback: country-level coloring
          const visitedNum = new Set(visitedCountries.map(n => COUNTRY_ISO_NUM[n]).filter(Boolean));
          const features = tp.feature(world, world.objects.countries).features;
          const fillFn = d => visitedNum.has(Number(d.id)) ? _gColor(String(d.id)) : '#BABDE2';

          const proj = d3.geoOrthographic().scale(125).translate([W/2,H/2]).rotate(rotRef.current).clipAngle(90);
          const pathGen = d3.geoPath().projection(proj);
          const graticule = d3.geoGraticule()();
          const svg = d3.select(svgRef.current);
          svg.selectAll('*').remove();
          svg.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',125).attr('fill','#EBF0FF').attr('stroke','#BABDE2').attr('stroke-width',1);
          const gLine = svg.append('path').datum(graticule).attr('fill','none').attr('stroke','rgba(55,67,117,0.15)').attr('stroke-width',0.5);
          const cPaths = svg.selectAll('path.c').data(features).join('path').attr('class','c').attr('fill',fillFn).attr('stroke','#FFFFFF').attr('stroke-width',0.5);
          const redraw = () => { gLine.attr('d',pathGen); cPaths.attr('d',pathGen); };
          redraw();
          return makeTick(proj, redraw);
        }

        // Admin1 coloring
        const features = tp.feature(world, world.objects.ne_50m_admin_1_states_provinces).features;
        const fillAdmin1 = d => {
          const p = d.properties;
          if (visitedAdmin1.has(p.name)) return _gColor(p.adm0_a3);
          if (visitedISO3.has(p.adm0_a3)) return _gColor(p.adm0_a3);
          return '#BABDE2';
        };

        const proj = d3.geoOrthographic().scale(125).translate([W/2,H/2]).rotate(rotRef.current).clipAngle(90);
        const pathGen = d3.geoPath().projection(proj);
        const graticule = d3.geoGraticule()();
        const svg = d3.select(svgRef.current);
        svg.selectAll('*').remove();
        svg.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',125).attr('fill','#EBF0FF').attr('stroke','#BABDE2').attr('stroke-width',1);
        const gLine = svg.append('path').datum(graticule).attr('fill','none').attr('stroke','rgba(55,67,117,0.15)').attr('stroke-width',0.5);
        const cPaths = svg.selectAll('path.c').data(features).join('path').attr('class','c').attr('fill',fillAdmin1).attr('stroke','#FFFFFF').attr('stroke-width',0.5);
        const redraw = () => { gLine.attr('d',pathGen); cPaths.attr('d',pathGen); };
        redraw();
        return makeTick(proj, redraw);
      }, [ready, visitedCountries, visitedCities]);

      if (!ready) return (
        <div className="flex items-center justify-center" style={{width:270,height:270}}>
          <span className="text-xs text-muted">지도 로딩 중...</span>
        </div>
      );
      return <svg ref={svgRef} width={270} height={270} style={{cursor:'grab',display:'block',touchAction:'none'}} />;
    }

    // ========================================
    // Page: Stamp Creator (unified, draggable + scalable)
    // ========================================
    function StampPage({ initial }) {
      const { navigate } = useRouter();
      const run = initial || { city:'서울', country:'한국', date:todayIso(), km:5.0, minutes:30, memo:'' };
      const pace = calcPace(run.km, run.minutes);
      const fileRef = useRef(null);
      const canvasRef = useRef(null);

      const [imgUrl, setImgUrl]       = useState(null);
      const [template, setTemplate]   = useState('mapstamp');
      const [colorMode, setColorMode] = useState('black');
      const [offset, setOffset]       = useState({ x:0, y:0 });
      const [isDragging, setIsDragging] = useState(false);
      const [lang, setLang] = useState('ko');
      const [mapReady, setMapReady] = useState(!!_worldAtlas);
      const dragRef = useRef({ active:false, sx:0, sy:0, ox:0, oy:0 });
      const tapRef  = useRef({ x:0, y:0, t:0, moved:false });
      const [scale, setScale] = useState(1.0);
      const pinchRef = useRef({ active: false, dist: 0, s0: 1 });

      // Pre-load world atlas when map template is selected (runs on mount since default is mapstamp)
      useEffect(() => {
        if (template === 'mapstamp' && !_worldAtlas) {
          loadWorldAtlas().then(() => setMapReady(true)).catch(() => {});
        }
      }, [template]);

      // Also trigger atlas load on first mount (default template = mapstamp)
      useEffect(() => {
        if (!_worldAtlas) {
          loadWorldAtlas().then(() => setMapReady(true)).catch(() => {});
        }
      }, []);

      const handleFile = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => setImgUrl(ev.target.result);
        reader.readAsDataURL(f);
      };

      // Reset offset when template changes
      useEffect(() => { setOffset({ x:0, y:0 }); }, [template]);

      // Canvas pointer/touch helpers
      const canvasScale = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x:0, y:0 };
        const rect = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * (900 / rect.width), y: (cy - rect.top) * (1200 / rect.height) };
      };

      const handlePointerDown = (e) => {
        e.preventDefault();
        const p = canvasScale(e);
        dragRef.current = { active:true, sx:p.x, sy:p.y, ox:offset.x, oy:offset.y };
        tapRef.current  = { x:p.x, y:p.y, t:Date.now(), moved:false };
        setIsDragging(true);
      };
      const handlePointerMove = (e) => {
        if (!dragRef.current.active) return;
        e.preventDefault();
        const p = canvasScale(e);
        const dx = p.x - tapRef.current.x, dy = p.y - tapRef.current.y;
        if (Math.sqrt(dx*dx + dy*dy) > 8) tapRef.current.moved = true;
        setOffset({ x: dragRef.current.ox + (p.x - dragRef.current.sx), y: dragRef.current.oy + (p.y - dragRef.current.sy) });
      };
      const handlePointerUp = () => {
        dragRef.current.active = false;
        setIsDragging(false);
        const tap = tapRef.current;
        if (!tap.moved && Date.now() - tap.t < 300) {
          setColorMode(cm => cm === 'black' ? 'white' : 'black');
        }
      };

      const getTouchDist = (touches) => {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx*dx + dy*dy);
      };

      const handleTouchStart = (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          pinchRef.current = { active: true, dist: getTouchDist(e.touches), s0: scale };
          dragRef.current.active = false;
          setIsDragging(false);
        } else {
          handlePointerDown(e);
        }
      };
      const handleTouchMove = (e) => {
        if (e.touches.length === 2 && pinchRef.current.active) {
          e.preventDefault();
          const newDist = getTouchDist(e.touches);
          const ratio = newDist / pinchRef.current.dist;
          setScale(Math.min(3.0, Math.max(0.4, pinchRef.current.s0 * ratio)));
        } else if (e.touches.length === 1) {
          handlePointerMove(e);
        }
      };
      const handleTouchEnd = (e) => {
        if (e.touches.length < 2) pinchRef.current.active = false;
        handlePointerUp();
      };

      // Per-template native canvas dimensions
      const TPL_DIM = {
        postal:    [840,  840],
        editorial: [900,  500],
        mapstamp:  [900, 1200],
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = 900, H = 1200;
        canvas.width = W; canvas.height = H;
        const ox = offset.x, oy = offset.y;

        const [tW, tH] = TPL_DIM[template] || [900, 1200];
        // Fit sticker: max 52% of canvas in each axis, then apply user scale
        const baseS   = Math.min((W * 0.52) / tW, (H * 0.52) / tH);
        const stW     = tW * baseS * scale;
        const stH     = tH * baseS * scale;
        const sCX     = W / 2 + ox;
        const sCY     = H / 2 + oy;
        const stR     = template === 'circle' ? Math.min(stW, stH) / 2 : 20;

        const drawSticker = () => {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(sCX - stW/2, sCY - stH/2, stW, stH, stR);
          ctx.clip();
          ctx.translate(sCX, sCY);
          ctx.scale(baseS * scale, baseS * scale);
          ctx.translate(-tW / 2, -tH / 2);
          if      (template === 'postal')    drawTplPostal(ctx, tW, tH, run, pace, 0, 0, colorMode, lang);
          else if (template === 'editorial') drawTplCity(ctx, tW, tH, run, pace, 0, 0, colorMode, lang);
          else if (template === 'mapstamp')  drawTplMap(ctx, tW, tH, run, pace, 0, 0, colorMode, lang);
          ctx.restore();
        };

        // Canvas BG is always opaque solid (colorMode-based)
        const canvasBg = colorMode === 'black' ? '#111111' : '#FFFFFF';

        if (!imgUrl) {
          ctx.fillStyle = canvasBg;
          ctx.fillRect(0, 0, W, H);
          drawSticker();
          return;
        }

        const img = new Image();
        img.onload = () => {
          // Photo fills entire canvas, sticker (with solid bg) on top
          const ratio = Math.max(W / img.width, H / img.height);
          const dw = img.width * ratio, dh = img.height * ratio;
          ctx.fillStyle = canvasBg;
          ctx.fillRect(0, 0, W, H);
          ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
          drawSticker();
        };
        img.onerror = () => {
          ctx.fillStyle = canvasBg; ctx.fillRect(0, 0, W, H);
          drawSticker();
        };
        img.src = imgUrl;
      }, [imgUrl, template, colorMode, offset.x, offset.y, scale, run, pace, lang, mapReady]);

      const onSave = () => downloadCanvas(canvasRef.current, `marked_${run.city}_${run.date}.png`);

      // Mini preview thumbnails — B&W matching colorMode
      const TemplateThumb = ({ t, colorMode: cm }) => {
        const active = template === t.id;
        const city3 = cityL(run.city, 'ko').slice(0, 3);
        const km0   = Number(run.km).toFixed(1);
        const bg    = cm === 'black' ? '#111111' : '#FFFFFF';
        const fg    = cm === 'black' ? '#F0F0F0' : '#111111';
        const bg2   = cm === 'black' ? '#F0F0F0' : '#111111';  // inner card (inverted)
        const fg2   = cm === 'black' ? '#111111' : '#F0F0F0';
        const dim   = cm === 'black' ? 'rgba(240,240,240,0.45)' : 'rgba(17,17,17,0.40)';

        // Thumb dimensions per template aspect ratio
        const TDIM = { postal:[52,52], editorial:[72,40], mapstamp:[44,58] };
        const [tw, th] = TDIM[t.id] || [44,58];

        return (
          <button onClick={() => setTemplate(t.id)}
            className={`shrink-0 overflow-hidden transition-all rounded-xl ${
              active ? 'ring-2 ring-ink ring-offset-2 scale-110 shadow-lg' : 'ring-1 ring-border'
            }`}
            style={{ width:`${tw}px`, height:`${th}px` }}>

            {/* POSTAL — vintage stamp with vertical lines */}
            {t.id === 'postal' && (
              <div className="w-full h-full relative flex items-center justify-center" style={{background:bg}}>
                <div style={{position:'absolute',inset:'3px',border:`1px dashed ${fg}`,borderRadius:'2px'}}/>
                <div style={{position:'absolute',inset:'10px',border:`0.5px solid ${fg}`}}/>
                {[0,1,2].map(i=>(
                  <div key={`ll${i}`} style={{position:'absolute',left:`${12+i*4}px`,top:'12px',bottom:'12px',width:'0.5px',background:fg,opacity:0.55}}/>

                ))}
                <span style={{fontSize:'9px',fontWeight:900,color:fg,position:'relative',zIndex:1,letterSpacing:'-0.02em'}}>{city3}</span>
              </div>

                  <ellipse cx="34" cy="18" rx="32" ry="16" fill="none" stroke={fg} strokeWidth="1.5"/>
                  <ellipse cx="34" cy="18" rx="26" ry="11" fill="none" stroke={fg} strokeWidth="0.5"/>

            {/* MAPSTAMP — portrait, double border */}
            {t.id === 'mapstamp' && (

      return (
        <PhoneFrame>
          <TopBar title={`${cityL(run.city, lang)} 스탬프`} onBack={() => navigate('record')} />
          <div className="fade-up">

            <div className="relative select-none">
              <canvas
                ref={canvasRef}
                className={`w-full h-auto block touch-none ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
                onPointerDown={handlePointerDown}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                onPointerLeave={handlePointerUp}
                onTouchStart={handleTouchStart}
                onTouchMove={handleTouchMove}
                onTouchEnd={handleTouchEnd}

                onClick={() => fileRef.current?.click()}

              >
                <Icon.Photo width="13" height="13" /> 사진

              {/* Reset button */}
              {(offset.x !== 0 || offset.y !== 0 || scale !== 1.0) && (
                <button
                  onClick={() => { setOffset({ x:0, y:0 }); setScale(1.0); }}
                  className="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/55 text-white text-[11px] px-3 py-1 rounded-full border border-white/20"
                >초기화</button>
              )}
            </div>
            <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} className="hidden-file" />

            <div className="px-5 pt-5 pb-28 space-y-5">
              {/* Template selector */}
              <div>
                <div className="grid grid-cols-3 justify-items-center gap-4">
                  {STAMP_TEMPLATES.map(t => (
                    <TemplateThumb key={t.id} t={t} colorMode={colorMode} />
                  ))}
                </div>
                <p className="text-[10px] text-muted mt-2 text-center">스탬프를 탭하면 흑백으로 전환됩니다</p>

                저장하기 →

          </div>
          <BottomNav />

    }

    // ─── B&W color helpers (cm = 'black' | 'white') ──────────────────────────
    function _tc(cm)    { return cm === 'white' ? '#111111' : '#F0F0F0'; }
    function _tbg(cm)   { return cm === 'white' ? '#FFFFFF' : '#111111'; }
    function _ta(cm, a) { return cm === 'white' ? `rgba(17,17,17,${a})` : `rgba(240,240,240,${a})`; }
    function L(ko, en, lang) { return lang === 'en' ? en : ko; }

    // ─── Shared stat data ─────────────────────────────────────────────────────
    function statsArr(run, pace, lang) {
      return [
        { lbl: L('거리','DIST', lang),  val: `${Number(run.km).toFixed(1)}`, unit: 'KM'  },
        { lbl: L('페이스','PACE', lang), val: pace ? pace.label : '—',       unit: L('/km','/km',lang) },
        { lbl: L('시간','TIME', lang),   val: `${run.minutes}`,              unit: L('분','MIN',lang) },
      ];
    }

    // ─── Tile color by city name (matches RunCard tileFor logic) ─────────────
    function _cityTile(city) {
      const s = String(city || '');
      const n = s.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      return TILE_COLORS[(n * 7) % TILE_COLORS.length];
    }

    // ─── Globe country color — deterministic random per country key ───────────
    const GLOBE_PALETTE = ['#374375','#895159','#4A7B8A','#6B7A3E','#7A4A6B','#3E6B7A','#8A6B3E','#5B3E7A'];
    function _gColor(key) {
      const n = String(key || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      return GLOBE_PALETTE[(n * 13) % GLOBE_PALETTE.length];
    }

    // ─── M letterform from marked_logo_french_blue.svg ────────────────────────
    // Path in a 680×680 viewbox; M bounds: x:80–600, y:224–560 (520×336)
    const _M_PATH_D = 'M 80 560 L 80 360 C 80 310 108 258 155 224 C 195 196 232 198 256 224 L 340 348 L 424 224 C 448 198 485 196 525 224 C 572 258 600 310 600 360 L 600 560 Z';
    const _M_BB = { x: 80, y: 224, w: 520, h: 336 };

    function _drawMShape(ctx, cx, cy, displayWidth, color) {
      const sc = displayWidth / _M_BB.w;
      const displayHeight = _M_BB.h * sc;
      ctx.save();
      ctx.fillStyle = color;
      ctx.translate(cx - displayWidth / 2, cy - displayHeight / 2);
      ctx.scale(sc, sc);
      ctx.translate(-_M_BB.x, -_M_BB.y);
      ctx.fill(new Path2D(_M_PATH_D));
      ctx.restore();
    }

    // T1: Story — oval passport stamp, landscape (900×500)
    function drawTplCity(ctx, W, H, run, pace, ox=0, oy=0, cm='black', lang='ko') {
      ctx.save(); ctx.translate(ox, oy);
      const FG = _tc(cm);
      const CX = W / 2, CY = H / 2;
      const RX = W / 2 - 22, RY = H / 2 - 22;
      const rX = RX - 30, rY = RY - 30;

      // Outer ellipse (bold)
      ctx.strokeStyle = FG; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(CX, CY, RX, RY, 0, 0, Math.PI * 2); ctx.stroke();

      // Inner ellipse (thin)
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(CX, CY, rX, rY, 0, 0, Math.PI * 2); ctx.stroke();

      // Horizontal rules spanning the inner ellipse at ±38% ry
      const ruleY1 = CY - rY * 0.38;
      const ruleY2 = CY + rY * 0.38;
      const ellX = (y) => {
        const t = (y - CY) / rY;
        const dx = rX * Math.sqrt(Math.max(0, 1 - t * t));
        return [CX - dx, CX + dx];
      };
      ctx.strokeStyle = FG; ctx.lineWidth = 1;
      const [r1a, r1b] = ellX(ruleY1);
      ctx.beginPath(); ctx.moveTo(r1a, ruleY1); ctx.lineTo(r1b, ruleY1); ctx.stroke();
      const [r2a, r2b] = ellX(ruleY2);
      ctx.beginPath(); ctx.moveTo(r2a, ruleY2); ctx.lineTo(r2b, ruleY2); ctx.stroke();

      // City name — center zone
      const city = cityL(run.city, lang);
      let cfs = 130;
      ctx.font = `900 ${cfs}px "Noto Sans KR",sans-serif`;
      while (ctx.measureText(city).width > rX * 2 - 40 && cfs > 52) {
        cfs -= 6; ctx.font = `900 ${cfs}px "Noto Sans KR",sans-serif`;
      }
      ctx.fillStyle = FG; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(city, CX, CY);

      // Top zone: flag + country + date
      const topZY = (CY - rY + ruleY1) / 2;
      ctx.font = '500 26px "Noto Sans KR",sans-serif';
      ctx.fillText(`${flagOf(run.country)}  ${countL(run.country, lang).toUpperCase()}  ·  ${fmtDate(run.date)}`, CX, topZY);

      // Bottom zone: stats
      const botZY = (ruleY2 + CY + rY) / 2;
      const kmVal = Number(run.km).toFixed(1);
      const paceStr = pace ? pace.label : '—';
      ctx.font = '500 26px "Noto Sans KR",sans-serif';
      ctx.fillText(`${kmVal} km  ·  ${paceStr}/km  ·  ${run.minutes}${L('분','m',lang)}`, CX, botZY);

      ctx.restore();
    }

    // T2: Postal — vintage stamp, vertical lines flanking M illustration (840×840)
    function drawTplPostal(ctx, W, H, run, pace, ox=0, oy=0, cm='black', lang='ko') {
      ctx.save(); ctx.translate(ox, oy);
      const FG = _tc(cm);
      const CX = W / 2;

      // ── Perforation dots ──────────────────────────────────────────
      ctx.save();
      ctx.lineCap = 'round'; ctx.setLineDash([0, 34]);
      ctx.strokeStyle = FG; ctx.lineWidth = 16;
      ctx.strokeRect(26, 26, W - 52, H - 52);
      ctx.setLineDash([]); ctx.lineCap = 'butt';
      ctx.restore();

      // ── Inner border ──────────────────────────────────────────────
      const M = 72;
      ctx.strokeStyle = FG; ctx.lineWidth = 1.5;
      ctx.strokeRect(M, M, W - M * 2, H - M * 2);

      // ── Top strip: flag+country LEFT, km denomination RIGHT ───────
      const kmVal = Number(run.km).toFixed(1);
      ctx.fillStyle = FG;
      ctx.font = '600 30px "Noto Sans KR",sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(`${flagOf(run.country)}  ${countL(run.country, lang).toUpperCase()}`, M + 22, M + 50);
      ctx.textAlign = 'right';
      ctx.fillText(`${kmVal} km`, W - M - 22, M + 50);

      // Thin rule
      ctx.strokeStyle = FG; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(M + 22, M + 64); ctx.lineTo(W - M - 22, M + 64); ctx.stroke();

      // ── Decorative vertical lines (left & right of M illustration) ─
      const lineTop = M + 78;
      const lineBot = 556;
      ctx.strokeStyle = FG; ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const lx = M + 24 + i * 12;
        ctx.beginPath(); ctx.moveTo(lx, lineTop); ctx.lineTo(lx, lineBot); ctx.stroke();
      }
      for (let i = 0; i < 5; i++) {
        const lx = W - M - 28 - i * 12;
        ctx.beginPath(); ctx.moveTo(lx, lineTop); ctx.lineTo(lx, lineBot); ctx.stroke();
      }

      // ── M illustration (large, center) ───────────────────────────
      _drawMShape(ctx, CX, 350, 230, FG);

      // ── Thin rule ─────────────────────────────────────────────────
      ctx.strokeStyle = FG; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(M + 22, 572); ctx.lineTo(W - M - 22, 572); ctx.stroke();

      // ── City name LARGE ───────────────────────────────────────────
      const city = cityL(run.city, lang);
      const maxCW = W - M * 2 - 40;
      let cfs = 160;
      ctx.font = `900 ${cfs}px "Noto Sans KR",sans-serif`;
      while (ctx.measureText(city).width > maxCW && cfs > 70) {
        cfs -= 6; ctx.font = `900 ${cfs}px "Noto Sans KR",sans-serif`;
      }
      ctx.fillStyle = FG; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(city, CX, 676);

      // ── Date + pace ───────────────────────────────────────────────
      const paceStr = pace ? pace.label : '—';
      ctx.font = '400 28px "Noto Sans KR",sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(fmtDate(run.date), M + 22, 720);
      ctx.textAlign = 'right';
      ctx.fillText(`${paceStr}/km`, W - M - 22, 720);

      ctx.restore();
    }

    // T3: Map — passport stamp, double border, text above, silhouette below (900×1200)
    function drawTplMap(ctx, W, H, run, pace, ox=0, oy=0, cm='black', lang='ko') {
      ctx.save(); ctx.translate(ox, oy);
      const FG = _tc(cm);
      const PAD = 72;

      // ── Outer double border ───────────────────────────────────────
      ctx.strokeStyle = FG; ctx.lineWidth = 2;
      ctx.strokeRect(18, 18, W - 36, H - 36);
      ctx.lineWidth = 1;
      ctx.strokeRect(44, 44, W - 88, H - 88);

      // ── TEXT ZONE ─────────────────────────────────────────────────
      // Header: "MARKED." left, M logo right
      ctx.fillStyle = FG;
      ctx.font = '700 26px "Noto Sans KR",sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('MARKED.', PAD, 100);
      _drawMShape(ctx, W - PAD - 20, 86, 38, FG);

      // Thin rule
      ctx.strokeStyle = FG; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PAD, 116); ctx.lineTo(W - PAD, 116); ctx.stroke();

      // City hero (auto-sized)
      const city = cityL(run.city, lang);
      let cfs = 168;
      ctx.font = `900 ${cfs}px "Noto Sans KR",sans-serif`;
      while (ctx.measureText(city).width > W - PAD * 2 && cfs > 80) {
        cfs -= 6;
        ctx.font = `900 ${cfs}px "Noto Sans KR",sans-serif`;
      }
      ctx.fillStyle = FG;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(city, PAD, 280);

      // Flag + Country
      ctx.font = '400 48px "Noto Sans KR",sans-serif';
      ctx.fillText(`${flagOf(run.country)}  ${countL(run.country, lang).toUpperCase()}`, PAD, 348);

      // Date
      ctx.font = '400 40px "Noto Sans KR",sans-serif';
      ctx.fillText(fmtDate(run.date), PAD, 402);

      // Thin divider
      ctx.strokeStyle = FG; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PAD, 432); ctx.lineTo(W - PAD, 432); ctx.stroke();

      // Stats — 3 columns (label + value)
      const kmVal  = Number(run.km).toFixed(1);
      const paceStr = pace ? pace.label : '—';
      const timeStr = `${run.minutes}${L('분','m',lang)}`;
      const statsData = [
        { lbl: L('거리','DIST',lang),  val: `${kmVal} km`   },
        { lbl: L('페이스','PACE',lang), val: `${paceStr}/km` },
        { lbl: L('시간','TIME',lang),   val: timeStr          },
      ];
      const colW = (W - PAD * 2) / 3;
      statsData.forEach(({ lbl, val }, i) => {
        const x = PAD + colW * i;
        ctx.fillStyle = FG;
        ctx.font = '500 34px "Noto Sans KR",sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(lbl.toUpperCase(), x, 476);

        let vfs = 68;
        ctx.font = `700 ${vfs}px "Noto Sans KR",sans-serif`;
        while (ctx.measureText(val).width > colW - 8 && vfs > 36) {
          vfs -= 4;
          ctx.font = `700 ${vfs}px "Noto Sans KR",sans-serif`;
        }
        ctx.fillText(val, x, 538);
      });

      // Thick divider (map zone separator)
      ctx.strokeStyle = FG; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(PAD, 566); ctx.lineTo(W - PAD, 566); ctx.stroke();

      // ── MAP ZONE ─────────────────────────────────────────────────
      const SIL_X0 = PAD, SIL_X1 = W - PAD;
      const SIL_Y0 = 586, SIL_Y1 = H - 60;

      if (_worldAtlas && window.d3 && window.topojson) {
        const d3 = window.d3, tp = window.topojson;
        const isoNum = COUNTRY_ISO_NUM[normalizeCountry(run.country)];
        const countries = tp.feature(_worldAtlas, _worldAtlas.objects.countries);
        const feature = isoNum ? countries.features.find(f => Number(f.id) === isoNum) : null;

        if (feature) {
          const KR_ISO = 410;
          const DOKDO_COORD = [131.8644, 37.2425];
          const fitTarget = isoNum === KR_ISO
            ? { type:'FeatureCollection', features:[feature,
                { type:'Feature', geometry:{ type:'Point', coordinates: DOKDO_COORD } }] }
            : feature;
          const proj = d3.geoMercator().fitExtent([[SIL_X0, SIL_Y0],[SIL_X1, SIL_Y1]], fitTarget);
          const pathGen = d3.geoPath().projection(proj).context(ctx);
          ctx.fillStyle = FG;
          ctx.beginPath(); pathGen(feature); ctx.fill();
          ctx.strokeStyle = FG; ctx.lineWidth = 1;
          ctx.beginPath(); pathGen(feature); ctx.stroke();
          if (isoNum === KR_ISO) {
            const [dx, dy] = proj(DOKDO_COORD);
            const r = Math.max(4, Math.min(SIL_X1 - SIL_X0, SIL_Y1 - SIL_Y0) * 0.02);
            ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2);
            ctx.fillStyle = FG; ctx.fill();
          }
        } else {
          const ccx = (SIL_X0 + SIL_X1) / 2, ccy = (SIL_Y0 + SIL_Y1) / 2;
          const r = Math.min(SIL_X1 - SIL_X0, SIL_Y1 - SIL_Y0) / 2 * 0.6;
          ctx.strokeStyle = FG; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(ccx, ccy, r, 0, Math.PI * 2); ctx.stroke();
        }
      } else {
        ctx.fillStyle = FG;
        ctx.font = '400 60px "Noto Sans KR",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('…', (SIL_X0 + SIL_X1) / 2, (SIL_Y0 + SIL_Y1) / 2);
      }

      ctx.restore();
    }

    // ========================================
    // Page: History
    // ========================================
    function HistoryPage({ runs, onDelete }) {
      const { navigate } = useRouter();

      const grouped = useMemo(() => {
        const map = new Map();
        runs.forEach(r => {
          const key = r.country || '기타';
          if (!map.has(key)) map.set(key, []);
          map.get(key).push(r);
        });
        for (const [, arr] of map) arr.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
        return Array.from(map.entries()).sort((a,b) => {
          const ad = a[1][0]?.date || ''; const bd = b[1][0]?.date || '';
          return bd.localeCompare(ad);
        });
      }, [runs]);

      return (
        <PhoneFrame>
          <TopBar
            title="히스토리"
            onBack={() => navigate('home')}
            right={<Badge>{runs.length}</Badge>}

    function ExplorePage() {
      const { navigate } = useRouter();
      const { user } = useAuthCtx();
      const [courses, setCourses] = useState(SAMPLE_COURSES);
      const [showForm, setShowForm] = useState(false);
      const [search, setSearch] = useState('');
      const [copied, setCopied] = useState(null);
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [continent, setContinent] = useState('all');

      // Load from server and merge with sample courses
      useEffect(() => {
        api.get('/api/courses')
          .then(data => {
            const dbCourses = data.map(c => ({ ...c, mapUrl: c.map_url || c.mapUrl || '', imageUrl: c.image_url || '' }));
            const dbIds = new Set(dbCourses.map(c => String(c.id)));
            const sampleOnly = SAMPLE_COURSES.filter(c => !dbIds.has(String(c.id)));
            setCourses([...dbCourses, ...sampleOnly]);
          })
          .catch(() => {});
      }, []);

      const filtered = courses.filter(c => {
        const matchSearch = !search || c.city.includes(search) || c.name.includes(search) || (c.country||'').includes(search);
        const matchContinent = continent === 'all' || CONTINENT_MAP[c.country] === continent;
        return matchSearch && matchContinent;
      });

      const copyLink = (course) => {
        const url = course.mapUrl || course.map_url || '';
        navigator.clipboard.writeText(url).then(() => {
          setCopied(course.id);
          setTimeout(() => setCopied(null), 2000);
        });
      };

      const openMaps = (course) => {
        const url = course.mapUrl || course.map_url || '';
        if (url) window.open(url, '_blank');
      };

      const addCourse = async (newCourse) => {
        const { imageFile, ...rest } = newCourse;
        const formData = new FormData();
        Object.entries(rest).forEach(([k, v]) => { if (v != null && v !== '') formData.append(k, v); });
        if (imageFile) formData.append('image', imageFile);
        if (user) { formData.append('userId', user.id); formData.append('userName', user.name); }
        try {
          const saved = await api.postForm('/api/courses', formData);
          setCourses(prev => [{ ...saved, mapUrl: saved.map_url||'', imageUrl: saved.image_url||'' }, ...prev]);
        } catch {
          setCourses(prev => [{ ...rest, id:'local_'+Date.now(), mapUrl: rest.mapUrl||'', imageUrl:'' }, ...prev]);
        }
        setShowForm(false);
      };

      const deleteCourse = async (id) => {
        if (!confirm('이 코스를 삭제할까요?')) return;
        try { await api.del(`/api/courses/${id}`, { userId: user?.id }); } catch {}
        setCourses(prev => prev.filter(c => c.id !== id));
      };

      return (
        <>
        <PhoneFrame>
          <TopBar title="러닝 코스" />
          <div className="px-5 pt-4 pb-28 space-y-4 fade-up">
            {/* Search */}
            <div className="relative">
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="도시 또는 코스명 검색"
                className="w-full bg-white border border-border rounded-xl px-4 py-3 text-ink placeholder-muted focus:border-ink outline-none pr-10"
              />
              {search && (
                <button onClick={() => setSearch('')}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-muted text-lg">×</button>
              )}
            </div>

            {/* Continent filter */}
            <div className="flex gap-1.5 overflow-x-auto pb-1 hide-scroll">
              {CONTINENTS.map(c => (
                <button
                  key={c.key}
                  onClick={() => setContinent(c.key)}
                  className="shrink-0 flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap"
                  style={continent === c.key
                    ? { background: '#2F4156', color: '#FFFFFF' }
                    : { background: '#EBF0FF', color: '#374375' }
                  }
                >
                  <span>{c.icon}</span>
                  <span>{c.label}</span>
                </button>
              ))}
            </div>

            {/* Add course button */}
            <Button variant="primary" size="md" onClick={() => setShowForm(true)} className="w-full">
              + 코스 등록하기
            </Button>

            {/* Course cards — card type 4/5 horizontal strip */}
            <div className="space-y-2.5">
              {filtered.length === 0 && (
                <div className="text-center py-12 text-muted text-sm">검색 결과가 없습니다</div>
              )}
              {filtered.map(course => {
                const tile = tileFor(course.id);
                const canDelete = user && (user.isAdmin || String(user.id) === String(course.user_id));
                return (
                  <button key={course.id} className="w-full text-left active:scale-[0.98] transition-transform"
                    onClick={() => setSelectedCourse(course)}>
                    <div className="rounded-2xl overflow-hidden flex items-stretch" style={{ background: tile.bg }}>

                      {/* Left accent block — card type 4 inspired */}
                      <div className="w-14 shrink-0 flex flex-col items-center justify-center gap-2 py-4"
                        style={{ background: 'rgba(0,0,0,0.14)' }}>
                        <svg viewBox="80 224 520 336" width="20" height="13" style={{opacity:0.80}}>
                          <path d="M 80 560 L 80 360 C 80 310 108 258 155 224 C 195 196 232 198 256 224 L 340 348 L 424 224 C 448 198 485 196 525 224 C 572 258 600 310 600 360 L 600 560 Z" fill={tile.text}/>
                        </svg>
                        <span className="text-[9px] font-black text-center leading-tight"
                          style={{ color: tile.text, opacity: 0.72 }}>
                          {course.difficulty || '초급'}
                        </span>
                      </div>

                      {/* Right content */}
                      <div className="flex-1 min-w-0 p-4">
                        {/* Top: location + date */}
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-[10px] font-bold uppercase tracking-widest"
                            style={{ color: tile.text, opacity: 0.62 }}>
                            {flagOf(course.country)} {course.city}
                          </span>
                          <span className="text-[10px]" style={{ color: tile.text, opacity: 0.5 }}>
                            {fmtDate(course.date)}
                          </span>
                        </div>

                        {/* Course name — hero */}
                        <h3 className="font-black leading-tight mb-2" style={{ fontSize: 17, color: tile.text }}>
                          {course.name}
                        </h3>

                        {/* Tags row */}
                        <div className="flex items-center gap-1.5 flex-wrap mb-2">
                          {course.distance && (
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full"
                              style={{ background: 'rgba(0,0,0,0.14)', color: tile.text }}>
                              {course.distance}
                            </span>
                          )}
                          {course.user_name && course.user_name !== '익명' && (
                            <span className="text-[10px]" style={{ color: tile.text, opacity: 0.6 }}>
                              by {course.user_name}
                            </span>
                          )}
                        </div>

                        {/* Description */}
                        {course.description && (
                          <p className="text-xs leading-relaxed line-clamp-2"
                            style={{ color: tile.text, opacity: 0.72 }}>
                            {course.description}
                          </p>
                        )}
                      </div>

                      {/* Right edge: arrow + optional delete */}
                      <div className="shrink-0 flex flex-col items-center justify-between py-4 pr-3.5">
                        {canDelete ? (
                          <button onClick={e => { e.stopPropagation(); deleteCourse(course.id); }}
                            className="w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-black hover:scale-110 transition-transform leading-none"
                            style={{ background: 'rgba(0,0,0,0.22)', color: '#fff' }}>×</button>
                        ) : <div />}
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                          stroke={tile.text} strokeWidth="2.5" strokeLinecap="round" opacity="0.5">
                          <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Add course modal */}
          {showForm && <CourseForm onAdd={addCourse} onClose={() => setShowForm(false)} />}

          <BottomNav />
        </PhoneFrame>

        {/* Course detail overlay */}
        {selectedCourse && (
          <CourseDetail course={selectedCourse} onClose={() => setSelectedCourse(null)} />
        )}
        </>
      );
    }

    // ========================================
    // App + Routes
    // ========================================
    function App() {
      const auth = useAuth();
      const [runs, setRuns] = useState([]);

      // Load runs from server when user logs in
      useEffect(() => {
        if (!auth.user) { setRuns([]); return; }
        api.get(`/api/runs?userId=${auth.user.id}`)
          .then(data => setRuns(data.map(r => ({ ...r, km: parseFloat(r.km) }))))
          .catch(() => setRuns(loadRuns())); // fallback to localStorage
      }, [auth.user?.id]);

      const addRun = async (run) => {
        try {
          const saved = await api.post('/api/runs', { ...run, userId: auth.user.id });
          const normalized = { ...saved, km: parseFloat(saved.km) };
          setRuns(prev => [normalized, ...prev]);
          return normalized;
        } catch {
          const localRun = { ...run, id: run.id || Date.now() };
          setRuns(prev => [localRun, ...prev]);
          return localRun;
        }
      };

      const editRun = async (run) => {
        try {
          const saved = await api.put(`/api/runs/${run.id}`, { ...run, userId: auth.user.id });
          const normalized = { ...saved, km: parseFloat(saved.km) };
          setRuns(prev => prev.map(r => String(r.id) === String(run.id) ? normalized : r));
          return normalized;
        } catch {
          setRuns(prev => prev.map(r => String(r.id) === String(run.id) ? run : r));
          return run;
        }
      };

      const deleteRun = async (id) => {
        try { await api.del(`/api/runs/${id}`, { userId: auth.user?.id }); } catch {}
        setRuns(prev => prev.filter(x => x.id !== id));
      };

      return (
        <AuthContext.Provider value={auth}>
          <Router>
            <Routes runs={runs} addRun={addRun} editRun={editRun} deleteRun={deleteRun} />
          </Router>
        </AuthContext.Provider>
      );
    }

    function Routes({ runs, addRun, editRun, deleteRun }) {
      const { path, state, navigate } = useRouter();
      const { user } = useAuthCtx();

      const protectedRoutes = ['record', 'history', 'stamp', 'profile', 'explore'];

      useEffect(() => {
        if (!user && protectedRoutes.includes(path)) {
          navigate('login');
        }
      }, [path, user, navigate]);

      switch (path) {
        case 'login':
          return <LoginPage />;
        case 'record':
          if (!user) return <LoginPage />;
          return <RecordPage onSave={addRun} onEdit={editRun} />;
        case 'stamp':
          if (!user) return <LoginPage />;
          return <StampPage initial={state} />;
        case 'history':
          if (!user) return <LoginPage />;
          return <HistoryPage runs={runs} onDelete={deleteRun} />;
        case 'profile':
          if (!user) return <LoginPage />;
          return <ProfilePage runs={runs} onDelete={deleteRun} />;
        case 'explore':
          if (!user) return <LoginPage />;
          return <ExplorePage />;
        case 'home':
        default:
          return user ? <HomePersonal runs={runs} /> : <HomeCommunity />;
      }
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
