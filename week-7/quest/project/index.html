    html, body {

    body {
      font-family: 'Noto Sans KR', system-ui, sans-serif;

    /* Hide number input spinners */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
    input[type="number"]{ -moz-appearance:textfield; }

    /* Date input — light theme */
    input[type="date"]::-webkit-calendar-picker-indicator { filter: none; cursor: pointer; }

    /* Light scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #E0DDD6; border-radius: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Card shadow — subtle */
    .card-shadow { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    /* Stamp animation */
    @keyframes seal-in { from { transform: scale(0.6) rotate(0deg); opacity:0; } to { transform: scale(1) rotate(-7deg); opacity:1; } }
    .seal-in { animation: seal-in 500ms cubic-bezier(.2,.9,.3,1.4) both; }

    /* Fade up */
    @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 300ms ease-out both; }

    /* Slide up — for login card */
    @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
    .slide-up { animation: slideUp 400ms ease-out both; }

    /* Hide native file input */
    .hidden-file { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

    /* Hairline divider */
    .hairline { border-color: #E0DDD6; }

    const api = {

        const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });

        if (!r.ok) throw new Error(json.error || '오류 발생');
        return json;
      },
      async postForm(url, formData) {
        const r = await fetch(url, { method:'POST', body:formData });
        const json = await r.json();
        if (!r.ok) throw new Error(json.error || '오류 발생');
        return json;
      },
      async put(url, data) {
        const r = await fetch(url, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
        const json = await r.json();
        if (!r.ok) throw new Error(json.error || '오류 발생');
        return json;
      },
      async get(url) {
        const r = await fetch(url);
        const json = await r.json();
        if (!r.ok) throw new Error(json.error || '오류 발생');
        return json;
      },

        return json;
      },
    };

    const calcPace = (km, minutes) => {
      const k = Number(km), m = Number(minutes);
      if (!k || k <= 0 || !m || m <= 0) return null;
      const total = m / k;
      const mm = Math.floor(total);
      const ss = Math.round((total - mm) * 60);
      return { mm, ss, label: `${mm}'${String(ss).padStart(2,'0')}"` };
    };

    const fmtDate = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
      return `${y}.${m}.${day}`;
    };

    const downloadCanvas = async (canvas, filename) => {
      try {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], filename, { type: 'image/png' });

        // Mobile: Web Share API → native share sheet (iOS "이미지 저장" / Android 갤러리)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Marked.' });
          return;
        }

        // Desktop fallback: direct download
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = filename;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      } catch(e) {
        if (e.name !== 'AbortError') alert('이미지를 저장할 수 없습니다.');
      }
    };

    // ========================================
    // Router (hash-based)
    // ========================================
    const RouterContext = createContext({ path: 'home', state: null, navigate: () => {} });

    function Router({ children }) {
      const [route, setRoute] = useState(() => parseHash());
      function parseHash(){
        const h = (window.location.hash || '#home').replace(/^#/, '');
        return { path: h.split('?')[0] || 'home' };
      }
      const navStateRef = useRef(null);

      const navigate = useCallback((path, state) => {
        navStateRef.current = state ?? null;
        if (`#${path}` !== window.location.hash) {
          window.location.hash = `#${path}`;
        } else {
          setRoute({ path });
        }
      }, []);

      useEffect(() => {
        const onHash = () => setRoute(parseHash());
        window.addEventListener('hashchange', onHash);
        if (!window.location.hash) window.location.hash = '#home';
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const value = useMemo(() => ({
        path: route.path,
        state: navStateRef.current,
        navigate
      }), [route.path, navigate]);

      return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
    }

    const useRouter = () => useContext(RouterContext);

    // ========================================
    // City Search (Korean-only dropdown)
    // ========================================
    function CitySearch({ city, country, onSelect }) {
      const [query, setQuery] = useState(city || '');
      const [open, setOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => { setQuery(city || ''); }, [city]);

      useEffect(() => {
        const onClick = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener('mousedown', onClick);
        return () => document.removeEventListener('mousedown', onClick);
      }, []);

      const filtered = useMemo(() => {
        if (!query.trim()) return CITIES_KR.slice(0, 12);
        return CITIES_KR.filter(c =>
          c.city.includes(query) || c.country.includes(query)
        ).slice(0, 12);
      }, [query]);

      // Check if the typed query exactly matches a city in the list
      const hasExactMatch = useMemo(() =>
        filtered.some(c => c.city === query.trim()),
      [filtered, query]);

      const handleSelect = (item) => {
        setQuery(item.city);
        onSelect(item.city, item.country);
        setOpen(false);
      };

      const handleCustomSelect = () => {
        const t = query.trim();
        if (!t) return;
        onSelect(t, country); // keep existing country, user fills separately
        setOpen(false);
      };

      const showDropdown = open && (filtered.length > 0 || (query.trim() && !hasExactMatch));

      return (
        <div ref={containerRef} className="relative">
          <input
            value={query}
            onChange={e => { setQuery(e.target.value); setOpen(true); onSelect(e.target.value, country); }}
            onFocus={() => setOpen(true)}
            placeholder="도시 검색 또는 직접 입력"
            className="w-full bg-white border border-border rounded-xl px-4 py-3 text-ink placeholder-muted focus:border-ink outline-none"
          />
          {showDropdown && (
            <div className="absolute z-50 w-full bg-white border border-border rounded-xl mt-1 shadow-lg overflow-hidden max-h-60 overflow-y-auto">
              {filtered.map((item, i) => (
                <button
                  key={i}
                  type="button"
                  onMouseDown={(e)=>{ e.preventDefault(); handleSelect(item); }}
                  className="w-full text-left px-4 py-2.5 hover:bg-bg flex items-center justify-between text-sm border-b border-border last:border-0"
                >
                  <span className="font-medium">{item.city}</span>
                  <span className="text-muted text-xs">{flagOf(item.country)} {item.country}</span>
                </button>
              ))}
              {query.trim() && !hasExactMatch && (
                <button
                  type="button"
                  onMouseDown={(e)=>{ e.preventDefault(); handleCustomSelect(); }}
                  className="w-full text-left px-4 py-2.5 hover:bg-bg flex items-center gap-2 text-sm text-ink border-t border-border"
                >
                  <span className="text-base">＋</span>
                  <span>직접 입력: <strong>{query.trim()}</strong></span>
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    // Shared world atlas cache — loaded once, reused by globe + stamp
    let _worldAtlas = null;
    const _worldAtlasCbs = [];
    function loadWorldAtlas() {
      if (_worldAtlas) return Promise.resolve(_worldAtlas);
      return fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')
        .then(r => r.json())
        .then(w => { _worldAtlas = w; _worldAtlasCbs.forEach(cb => cb(w)); _worldAtlasCbs.length = 0; return w; });
    }

    function WorldGlobe({ visitedCountries }) {
      const svgRef = useRef(null);
      const rotRef = useRef([127, -37]);
      const [ready, setReady] = useState(false);
      const worldRef = useRef(null);

      useEffect(() => {
        if (!window.d3 || !window.topojson) return;
        loadWorldAtlas().then(w => { worldRef.current = w; setReady(true); }).catch(() => {});
      }, []);

      useEffect(() => {
        if (!ready || !svgRef.current || !worldRef.current) return;
        const { d3, topojson: tp } = window;
        const W = 270, H = 270;
        const world = worldRef.current;

        const visitedSet = new Set(
          visitedCountries.map(n => COUNTRY_ISO_NUM[n]).filter(Boolean)
        );

        const proj = d3.geoOrthographic()
          .scale(125).translate([W/2, H/2])
          .rotate(rotRef.current).clipAngle(90);
        const pathGen = d3.geoPath().projection(proj);
        const countries = tp.feature(world, world.objects.countries);
        const graticule = d3.geoGraticule()();

        const svg = d3.select(svgRef.current);
        svg.selectAll('*').remove();

        svg.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',125)
          .attr('fill','#ECEAE5').attr('stroke','#D5D2CB').attr('stroke-width',1);

        const gLine = svg.append('path').datum(graticule)
          .attr('fill','none').attr('stroke','#D0CEC8').attr('stroke-width',0.4);

        const cPaths = svg.selectAll('path.c').data(countries.features)
          .join('path').attr('class','c')
          .attr('fill', d => visitedSet.has(Number(d.id)) ? '#111111' : '#C8C5BE')
          .attr('stroke','#ECEAE5').attr('stroke-width',0.5);

        const redraw = () => { gLine.attr('d',pathGen); cPaths.attr('d',pathGen); };
        redraw();

        let dragging = false;
        svg.call(d3.drag()
          .on('start', () => { dragging = true; })
          .on('drag', e => {
            const r = rotRef.current;
            rotRef.current = [r[0]+e.dx*0.4, Math.max(-70,Math.min(70,r[1]-e.dy*0.4))];
            proj.rotate(rotRef.current); redraw();
          })
          .on('end', () => { dragging = false; })
        );

        let animId, prev = null;
        const tick = t => {
          if (!dragging) {
            if (prev !== null) {
              rotRef.current = [rotRef.current[0]+(t-prev)*0.013, rotRef.current[1]];
              proj.rotate(rotRef.current); redraw();
            }
            prev = t;
          } else { prev = null; }
          animId = requestAnimationFrame(tick);
        };
        animId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(animId);
      }, [ready, visitedCountries]);

      if (!ready) return (
        <div className="flex items-center justify-center" style={{width:270,height:270}}>
          <span className="text-xs text-muted">지도 로딩 중...</span>
        </div>
      );
      return <svg ref={svgRef} width={270} height={270} style={{cursor:'grab',display:'block',touchAction:'none'}} />;
    }

      const [city, setCity] = useState(editingRun?.city || '');
      const [country, setCountry] = useState(editingRun?.country || '');
      const [date, setDate] = useState(editingRun?.date || todayIso());
      const [km, setKm] = useState(editingRun?.km ? String(editingRun.km) : '');
      const [minutes, setMinutes] = useState(editingRun?.minutes ? String(editingRun.minutes) : '');
      const [memo, setMemo] = useState(editingRun?.memo || '');

      const pace = calcPace(km, minutes);
      const valid = city.trim() && country.trim() && date && Number(km) > 0 && Number(minutes) > 0;

      const buildRun = () => ({
        ...(editingRun || {}),
        id: editingRun?.id || Date.now(),
        city: city.trim(),
        country: normalizeCountry(country),
        date,
        km: Number(km),
        minutes: Number(minutes),
        memo: memo.trim(),
      });

      const handleSave = async () => {
        if (!valid) return;
        const run = buildRun();
        if (editingRun) await onEdit?.(run);
        else await onSave(run);
        navigate('home');
      };

      const handleStamp = async () => {
        if (!valid) return;
        const run = buildRun();
        let saved;
        if (editingRun) saved = await onEdit?.(run) || run;
        else saved = await onSave(run) || run;
        navigate('stamp', saved);
      };

      return (
        <PhoneFrame>
          <TopBar title={editingRun ? '기록 수정' : '러닝 기록'} onBack={() => navigate('home')} />

          <div className="px-6 pt-6 space-y-4 fade-up">
            <Card className="p-5 space-y-4">
              <Field label="도시">
                <CitySearch
                  city={city}
                  country={country}
                  onSelect={(c, cn) => { setCity(c); if (cn) setCountry(cn); }}
                />
              </Field>
              <Field label="국가">
                <Input
                  placeholder="국가 입력 (예: 한국, 미국)"
                  value={country}
                  onChange={e => setCountry(e.target.value)}
                />
              </Field>
              <Field label="날짜">
                <Input type="date" value={date} onChange={e=>setDate(e.target.value)} />
              </Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="거리 (km)">
                  <Input type="number" step="0.1" min="0" placeholder="0.0" value={km} onChange={e=>setKm(e.target.value)} />
                </Field>
                <Field label="시간 (분)">
                  <Input type="number" step="1" min="0" placeholder="0" value={minutes} onChange={e=>setMinutes(e.target.value)} />
                </Field>
              </div>
              <Field label="페이스">
                <div className="w-full bg-bg border border-border rounded-xl px-4 py-3 text-ink font-medium">
                  {pace ? `${pace.label} / km` : <span className="text-muted">—</span>}
                </div>
              </Field>
              <Field label="메모">
                <Textarea placeholder="기억하고 싶은 코스, 날씨, 기분" value={memo} onChange={e=>setMemo(e.target.value)} />
              </Field>
            </Card>

            <div className="flex gap-3 pb-8">
              <Button variant="secondary" size="lg" className="flex-1" disabled={!valid} onClick={handleSave}>
                저장하기
              </Button>
              <Button variant="coral" size="lg" className="flex-1" disabled={!valid} onClick={handleStamp}>
                스탬프 만들기 →
              </Button>
            </div>
          </div>

          <BottomNav />
        </PhoneFrame>
      );
    }

    // ========================================
    // Stamp Templates (4 ShareAura-inspired)
    // ========================================
    const STORY_BG_COLORS = [
      'photo',    // 사진만 (투명)
      '#111111',  // 블랙
      '#FFFFFF',  // 화이트
      '#4F8EF7',  // 블루
      '#34C98E',  // 민트
      '#F5C842',  // 옐로
      '#F06292',  // 핑크
      '#A87CF7',  // 퍼플
    ];

    const STAMP_TEMPLATES = [
      { id:'mapstamp', label:'지도'       },
      { id:'city',     label:'도시/국가' },
      { id:'logo',     label:'로고'      },
      { id:'line',     label:'라인'      },
      { id:'passport', label:'여권도장'   },
    ];

    // ========================================
    // Page: Stamp Creator (unified, draggable + scalable)
    // ========================================
    function StampPage({ initial }) {
      const { navigate } = useRouter();
      const run = initial || { city:'서울', country:'한국', date:todayIso(), km:5.0, minutes:30, memo:'' };
      const pace = calcPace(run.km, run.minutes);
      const fileRef = useRef(null);
      const canvasRef = useRef(null);

      const [imgUrl, setImgUrl]       = useState(null);
      const [template, setTemplate]   = useState('mapstamp');
      const [bgColorIdx, setBgColorIdx] = useState(0);
      const [offset, setOffset]       = useState({ x:0, y:0 });
      const [isDragging, setIsDragging] = useState(false);
      const [lang, setLang] = useState('ko');
      const [mapReady, setMapReady] = useState(!!_worldAtlas);
      const dragRef = useRef({ active:false, sx:0, sy:0, ox:0, oy:0 });
      const [scale, setScale] = useState(1.0);
      const pinchRef = useRef({ active: false, dist: 0, s0: 1 });

      // Pre-load world atlas when map template is selected
      useEffect(() => {
        if (template === 'mapstamp' && !_worldAtlas) {
          loadWorldAtlas().then(() => setMapReady(true)).catch(() => {});
        }
      }, [template]);

      const handleFile = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => setImgUrl(ev.target.result);
        reader.readAsDataURL(f);
      };

      // Reset offset when template changes
      useEffect(() => { setOffset({ x:0, y:0 }); }, [template]);

      // Canvas pointer/touch helpers
      const canvasScale = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x:0, y:0 };
        const rect = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * (900 / rect.width), y: (cy - rect.top) * (1200 / rect.height) };
      };

      const handlePointerDown = (e) => {
        e.preventDefault();
        const p = canvasScale(e);
        dragRef.current = { active:true, sx:p.x, sy:p.y, ox:offset.x, oy:offset.y };
        setIsDragging(true);
      };
      const handlePointerMove = (e) => {
        if (!dragRef.current.active) return;
        e.preventDefault();
        const p = canvasScale(e);
        setOffset({ x: dragRef.current.ox + (p.x - dragRef.current.sx), y: dragRef.current.oy + (p.y - dragRef.current.sy) });
      };
      const handlePointerUp = () => { dragRef.current.active = false; setIsDragging(false); };

      const getTouchDist = (touches) => {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx*dx + dy*dy);
      };

      const handleTouchStart = (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          pinchRef.current = { active: true, dist: getTouchDist(e.touches), s0: scale };
          dragRef.current.active = false;
          setIsDragging(false);
        } else {
          handlePointerDown(e);
        }
      };
      const handleTouchMove = (e) => {
        if (e.touches.length === 2 && pinchRef.current.active) {
          e.preventDefault();
          const newDist = getTouchDist(e.touches);
          const ratio = newDist / pinchRef.current.dist;
          setScale(Math.min(3.0, Math.max(0.4, pinchRef.current.s0 * ratio)));
        } else if (e.touches.length === 1) {
          handlePointerMove(e);
        }
      };
      const handleTouchEnd = (e) => {
        if (e.touches.length < 2) pinchRef.current.active = false;
        handlePointerUp();
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = 900, H = 1200;
        canvas.width = W; canvas.height = H;
        const ox = offset.x, oy = offset.y;

        const bg = STORY_BG_COLORS[bgColorIdx];
        const light = bg === '#FFFFFF' || bg === '#F5C842';
        const applyTemplate = () => {
          ctx.save();
          ctx.translate(W/2 + ox, H/2 + oy);
          ctx.scale(scale, scale);
          ctx.translate(-W/2, -H/2);
          if      (template === 'city')     drawTplCity(ctx, W, H, run, pace, 0, 0, light, lang);
          else if (template === 'logo')     drawTplLogo(ctx, W, H, run, pace, 0, 0, light, lang);
          else if (template === 'line')     drawTplLine(ctx, W, H, run, pace, 0, 0, light, lang);
          else if (template === 'passport') drawTplPassport(ctx, W, H, run, pace, 0, 0, light, lang);
          else if (template === 'mapstamp') drawTplMap(ctx, W, H, run, pace, 0, 0, light, lang);
          ctx.restore();
        };
        const drawBg = () => {
          if (bg === 'photo') {
            ctx.fillStyle = '#E8E8E8'; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = 'rgba(0,0,0,0.06)';
            for(let i=0;i<500;i++) ctx.fillRect(Math.random()*W,Math.random()*H,1.5,1.5);
          } else {
            ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
            if (bg !== '#FFFFFF') {
              ctx.fillStyle='rgba(255,255,255,0.025)';
              for(let i=0;i<600;i++) ctx.fillRect(Math.random()*W,Math.random()*H,1.5,1.5);
            }
          }
        };

        if (!imgUrl) { drawBg(); applyTemplate(); return; }

        const img = new Image();
        img.onload = () => {
          const ratio = Math.max(W/img.width, H/img.height);
          const dw = img.width*ratio, dh = img.height*ratio;
          ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
          ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
          if (bg !== 'photo') {
            ctx.fillStyle = bg === '#FFFFFF' ? 'rgba(255,255,255,0.18)' : bg.replace('#','').length===6
              ? `rgba(${parseInt(bg.slice(1,3),16)},${parseInt(bg.slice(3,5),16)},${parseInt(bg.slice(5,7),16)},0.22)`
              : 'rgba(0,0,0,0)';
            ctx.fillRect(0,0,W,H);
          }
          applyTemplate();
        };
        img.onerror = () => { drawBg(); applyTemplate(); };
        img.src = imgUrl;
      }, [imgUrl, template, bgColorIdx, offset.x, offset.y, scale, run, pace, lang, mapReady]);

      const onSave = () => downloadCanvas(canvasRef.current, `marked_${run.city}_${run.date}.png`);

      // Mini preview component for each template
      const TemplateThumb = ({ t }) => {
        const active = template === t.id;
        const city3 = run.city.slice(0,3).toUpperCase();
        const km0 = Number(run.km).toFixed(1);
        return (
          <button onClick={() => setTemplate(t.id)}
            className={`shrink-0 rounded-xl border-2 transition overflow-hidden ${
              active ? 'border-ink scale-105' : 'border-border'
            }`} style={{ width:'60px', height:'80px' }}>
            <div className="w-full h-full relative"
              style={{ background:'linear-gradient(160deg,#1a1a1a,#0a0a0a)' }}>
              {/* city: bold city + white divider + distance */}
              {t.id === 'city' && <>
                <div className="absolute bottom-0 left-0 right-0" style={{ background:'linear-gradient(to top,rgba(0,0,0,.95),transparent)', height:'70%' }}/>
                <div className="absolute bottom-9 left-1.5 text-white font-black leading-none" style={{ fontSize:'7px' }}>{city3}</div>
                <div className="absolute bottom-7 left-1.5 right-1.5 h-px" style={{ background:'rgba(255,255,255,0.4)' }}/>
                <div className="absolute bottom-3.5 left-1.5 text-white font-black" style={{ fontSize:'9px' }}>{km0}</div>
                <div className="absolute bottom-4 left-1.5 text-right text-white/50" style={{ fontSize:'4px', right:'4px' }}>PACE<br/>TIME</div>
              </>}
              {/* logo: left card with stacked stats */}
              {t.id === 'logo' && <>
                <div className="absolute inset-2 rounded" style={{ background:'rgba(0,0,0,0.65)', borderLeft:'2px solid rgba(255,255,255,0.45)' }}>
                  <div className="absolute top-1 left-1.5 text-white font-black" style={{ fontSize:'5px' }}>{city3}</div>
                  <div className="absolute top-0 left-0 right-0 border-t border-white/10" style={{ top:'12px' }}/>
                  <div className="absolute text-white/50" style={{ fontSize:'3px', top:'15px', left:'5px' }}>Distance</div>
                  <div className="absolute text-white font-bold" style={{ fontSize:'6px', top:'20px', left:'5px' }}>{km0}km</div>
                  <div className="absolute text-white/50" style={{ fontSize:'3px', top:'30px', left:'5px' }}>Pace</div>
                  <div className="absolute text-white font-bold" style={{ fontSize:'5px', top:'35px', left:'5px' }}>5:30</div>
                </div>
              </>}
              {/* line: right-aligned big numbers */}
              {t.id === 'line' && <>
                <div className="absolute top-2 left-2 text-white font-bold" style={{ fontSize:'4px' }}>MARKED.</div>
                <div className="absolute right-1.5 text-white/60 font-bold" style={{ fontSize:'4px', top:'30px' }}>{city3}</div>
                <div className="absolute right-1.5 border-t" style={{ top:'37px', left:'30%', borderColor:'rgba(255,255,255,0.35)' }}/>
                <div className="absolute right-1.5 text-white font-black" style={{ fontSize:'11px', top:'38px' }}>{km0}</div>
                <div className="absolute right-1.5 text-white font-bold" style={{ fontSize:'7px', top:'52px' }}>5:30</div>
                <div className="absolute right-1.5 text-white font-bold" style={{ fontSize:'7px', top:'62px' }}>29</div>
              </>}
              {/* passport: card */}
              {t.id === 'passport' && <>
                <div className="absolute inset-2 rounded" style={{ background:'rgba(8,8,8,0.94)', border:'1px solid rgba(255,255,255,0.4)' }}>
                  <div className="absolute top-0 left-0 right-0 h-1 rounded-t" style={{ background:'rgba(255,255,255,0.75)' }}/>
                  <div className="absolute inset-0 flex flex-col items-center justify-center gap-0.5">
                    <div className="text-white font-black" style={{ fontSize:'5px' }}>{city3}</div>
                    <div className="text-white/40" style={{ fontSize:'3px' }}>────</div>
                    <div className="font-bold text-white" style={{ fontSize:'5px' }}>{km0}</div>
                    <div className="text-white/40" style={{ fontSize:'2.5px' }}>ENTRY STAMP</div>
                  </div>
                </div>
              </>}
              {/* mapstamp: country shape */}
              {t.id === 'mapstamp' && <>
                <div className="absolute inset-0 flex flex-col items-end justify-end" style={{ padding:'4px' }}>
                  <div className="text-white font-black leading-none" style={{ fontSize:'5px', opacity:0.55 }}>MAP</div>
                  <div className="text-white font-black" style={{ fontSize:'6px' }}>{city3}</div>
                </div>
                <div className="absolute inset-0 flex items-center justify-center opacity-60">
                  <svg viewBox="0 0 40 40" width="36" height="36">
                    <rect x="5" y="8" width="30" height="24" rx="2" fill="none" stroke="white" strokeWidth="1.5"/>
                    <path d="M5 16 Q15 12 20 18 Q26 24 35 18" fill="none" stroke="white" strokeWidth="1" strokeDasharray="2,2" opacity="0.6"/>
                    <circle cx="20" cy="20" r="2" fill="white" opacity="0.8"/>
                  </svg>
                </div>
              </>}
            </div>
          </button>
        );
      };

      return (
        <PhoneFrame>
          <TopBar title={run.city} onBack={() => navigate('record')} />
          <div className="fade-up">
            {/* Canvas — drag to reposition text */}
            <div className="relative select-none">
              <canvas
                ref={canvasRef}
                className={`w-full h-auto block touch-none ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
                onPointerDown={handlePointerDown}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                onPointerLeave={handlePointerUp}
                onTouchStart={handleTouchStart}
                onTouchMove={handleTouchMove}
                onTouchEnd={handleTouchEnd}
              />
              {/* Photo button */}
              <button
                onClick={() => fileRef.current?.click()}
                className="absolute top-3 right-3 bg-black/55 backdrop-blur-sm text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-white/20"
              >
                <Icon.Photo width="13" height="13" /> 사진
              </button>
              {/* Reset offset button */}
              {(offset.x !== 0 || offset.y !== 0 || scale !== 1.0) && (
                <button
                  onClick={() => { setOffset({ x:0, y:0 }); setScale(1.0); }}
                  className="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/55 text-white text-[11px] px-3 py-1 rounded-full border border-white/20"
                >
                  초기화
                </button>
              )}
            </div>
            <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} className="hidden-file" />

            <div className="px-5 pt-4 pb-24 space-y-4">
              {/* Background color swatches */}
              <div>
                <p className="text-xs text-muted font-medium tracking-wider uppercase mb-2">배경</p>
                <div className="flex gap-2 flex-wrap">
                  {STORY_BG_COLORS.map((col, i) => (
                    <button key={i} onClick={() => setBgColorIdx(i)}
                      className={`w-8 h-8 rounded-full border-2 transition ${i === bgColorIdx ? 'border-ink scale-110' : 'border-transparent'}`}
                      style={{
                        background: col === 'photo' ? 'linear-gradient(135deg,#ccc 50%,#888 50%)' : col,
                        boxShadow: i === bgColorIdx ? '0 0 0 1px #fff inset' : 'none'
                      }}
                      title={col === 'photo' ? '사진만' : col}
                    />
                  ))}
                </div>
              </div>

              {/* Language toggle */}
              <div className="flex items-center gap-2 justify-end">
                <span className="text-xs text-muted">언어</span>
                <button onClick={() => setLang('ko')}
                  className={`px-3 py-1 rounded-full text-xs font-bold border transition ${lang==='ko' ? 'bg-ink text-white border-ink' : 'bg-white text-muted border-border'}`}>KO</button>
                <button onClick={() => setLang('en')}
                  className={`px-3 py-1 rounded-full text-xs font-bold border transition ${lang==='en' ? 'bg-ink text-white border-ink' : 'bg-white text-muted border-border'}`}>EN</button>
              </div>

              {/* Template selector */}
              <div>
                <div className="flex gap-3 overflow-x-auto pb-1">
                  {STAMP_TEMPLATES.map(t => <TemplateThumb key={t.id} t={t} />)}
                </div>
              </div>

              <Button variant="coral" size="lg" onClick={onSave} className="w-full">저장하기 →</Button>
            </div>
          </div>
          <BottomNav />
        </PhoneFrame>
      );
    }

    // ─── Text color helpers ───────────────────────────────────────────────────
    function _tc(l) { return l ? '#111111' : '#ffffff'; }
    function _ta(l, a) { return l ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`; }
    function L(ko, en, lang) { return lang === 'en' ? en : ko; }

    // ─── Shared stat data ─────────────────────────────────────────────────────
    function statsArr(run, pace, lang) {
      return [
        { lbl: L('거리','DIST', lang),  val: `${Number(run.km).toFixed(1)}`, unit: 'KM'  },
        { lbl: L('페이스','PACE', lang), val: pace ? pace.label : '—',       unit: L('/km','/km',lang) },
        { lbl: L('시간','TIME', lang),   val: `${run.minutes}`,              unit: L('분','MIN',lang) },
      ];
    }

    // T1: Editorial — city hero, bottom left, horizontal stats
    function drawTplCity(ctx, W, H, run, pace, ox=0, oy=0, light=false, lang='ko') {
      ctx.save(); ctx.translate(ox,oy);
      const PAD=72;
      const city=cityL(run.city,lang);
      const cfs=city.length>8?72:city.length>5?90:108;

      // country · date  (y=H-272)
      ctx.fillStyle=_ta(light,0.45); ctx.font='400 13px "Noto Sans KR",sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.fillText(`${countL(run.country,lang).toUpperCase()}`, PAD, H-272);
      ctx.textAlign='right';
      ctx.fillText(fmtDate(run.date), W-PAD, H-272);

      // city name  (baseline y=H-164)
      ctx.fillStyle=_tc(light); ctx.font=`900 ${cfs}px "Noto Sans KR",sans-serif`;
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.fillText(city, PAD, H-164);

      // full-width divider  (y=H-136)
      ctx.strokeStyle=_ta(light,0.18); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD,H-136); ctx.lineTo(W-PAD,H-136); ctx.stroke();

      // 3 stats — equal columns
      const colW=Math.round((W-2*PAD)/3);
      [0,1,2].forEach(i => {
        const x=PAD+colW*i;
        const lbl=[L('거리','DISTANCE',lang),L('페이스','PACE',lang),L('시간','TIME',lang)][i];
        const val=[`${Number(run.km).toFixed(1)}`,pace?pace.label:'—',`${run.minutes}`][i];
        const unit=['km','/km',L('분','min',lang)][i];
        ctx.fillStyle=_ta(light,0.40); ctx.font='400 12px "Noto Sans KR",sans-serif';
        ctx.textAlign='left'; ctx.fillText(lbl.toUpperCase(), x, H-108);
        ctx.fillStyle=_tc(light); ctx.font='700 40px "Noto Sans KR",sans-serif';
        ctx.fillText(val, x, H-60);
        ctx.fillStyle=_ta(light,0.40); ctx.font='400 12px "Noto Sans KR",sans-serif';
        ctx.fillText(unit, x, H-40);
      });

      // MARKED. watermark  (y=H-14)
      ctx.fillStyle=_ta(light,0.20); ctx.font='400 11px "Noto Sans KR",sans-serif';
      ctx.textAlign='right';
      ctx.fillText('MARKED.', W-PAD, H-14);
      ctx.restore();
    }

    // T2: Stacked — floating text block top-left, label→value×3
    function drawTplLogo(ctx, W, H, run, pace, ox=0, oy=0, light=false, lang='ko') {
      ctx.save(); ctx.translate(ox,oy);
      const PAD=72;

      // MARKED.  (y=68)
      ctx.fillStyle=_tc(light); ctx.font='700 16px "Noto Sans KR",sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.fillText('MARKED.', PAD, 68);

      // thin rule  (y=84)
      ctx.strokeStyle=_ta(light,0.20); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD,84); ctx.lineTo(PAD+360,84); ctx.stroke();

      // Distance label→value  (label y=120, value y=170)
      ctx.fillStyle=_ta(light,0.45); ctx.font='400 13px "Noto Sans KR",sans-serif';
      ctx.fillText(L('거리','Distance',lang), PAD, 120);
      ctx.fillStyle=_tc(light); ctx.font='700 52px "Noto Sans KR",sans-serif';
      ctx.fillText(`${Number(run.km).toFixed(1)} km`, PAD, 170);

      // Pace label→value  (label y=208, value y=248)

    // T4: Card — centered passport card, B&W
    function drawTplPassport(ctx, W, H, run, pace, ox=0, oy=0, light=false, lang='ko') {
      ctx.save(); ctx.translate(ox,oy);
      const SW=660, SH=500, R=16;

      // card fill
      ctx.fillStyle=light?'rgba(252,250,247,0.97)':'rgba(6,6,6,0.95)';

      ctx.strokeStyle=light?'rgba(0,0,0,0.55)':'rgba(255,255,255,0.55)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(sx,sy,SW,SH,R); ctx.stroke();

      // header: MARKED. left, date right  (y=sy+40)

      // divider  (y=sy+54)
      ctx.strokeStyle=_ta(light,0.10); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(sx+28,sy+54); ctx.lineTo(sx+SW-28,sy+54); ctx.stroke();

      // ghost country code  (center of card)

      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(codeOf(run.country), sx+SW/2, sy+SH/2+12);

      // city name  (baseline y=sy+196)
      const city=cityL(run.city,lang);
      const cfs=city.length>8?44:city.length>5?56:70;
      ctx.fillStyle=_tc(light); ctx.font=`900 ${cfs}px "Noto Sans KR",sans-serif`;
      ctx.textBaseline='alphabetic';
      ctx.fillText(city, sx+SW/2, sy+196);

      // flag + country  (y=sy+228)
      ctx.fillStyle=_ta(light,0.50); ctx.font='400 17px "Noto Sans KR",sans-serif';
      ctx.fillText(`${flagOf(run.country)}  ${countL(run.country,lang)}`, sx+SW/2, sy+228);

      // divider  (y=sy+248)
      ctx.strokeStyle=_ta(light,0.10); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(sx+36,sy+248); ctx.lineTo(sx+SW-36,sy+248); ctx.stroke();

      // 3 stats: label(sy+278) / value(sy+316) / unit(sy+336)
      [0,1,2].forEach(i => {
        const x=sx+[SW*0.17,SW*0.50,SW*0.83][i];
        const {lbl,val,unit}=statsArr(run,pace,lang)[i];
        ctx.fillStyle=_ta(light,0.38); ctx.font='400 12px "Noto Sans KR",sans-serif';
        ctx.textBaseline='alphabetic'; ctx.fillText(lbl.toUpperCase(), x, sy+278);
        ctx.fillStyle=_tc(light); ctx.font='700 32px "Noto Sans KR",sans-serif';
        ctx.fillText(val, x, sy+316);
        ctx.fillStyle=_ta(light,0.38); ctx.font='400 12px "Noto Sans KR",sans-serif';
        ctx.fillText(unit, x, sy+336);
      });

      // divider  (y=sy+354)
      ctx.strokeStyle=_ta(light,0.10); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(sx+36,sy+354); ctx.lineTo(sx+SW-36,sy+354); ctx.stroke();

      // date  (y=sy+386)
      ctx.fillStyle=_ta(light,0.40); ctx.font='400 14px "Noto Sans KR",sans-serif';
      ctx.fillText(fmtDate(run.date), sx+SW/2, sy+386);

      // entry stamp footer  (y=sy+SH-24=sy+476)
      ctx.fillStyle=_ta(light,0.28); ctx.font='500 11px "Noto Sans KR",sans-serif';

    // T5: Map — country silhouette on canvas using D3-geo
    // T5: Map — country silhouette as bottom-strip overlay (얹히는 레이아웃)
    function drawTplMap(ctx, W, H, run, pace, ox=0, oy=0, light=false, lang='ko') {
      ctx.save(); ctx.translate(ox, oy);

      // ── silhouette only — right column, fully opaque ──────────────────
      const PAD = 72;
      const SIL_X0 = W * 0.52, SIL_X1 = W - PAD;
      const SIL_Y0 = H * 0.54, SIL_Y1 = H * 0.88;

      if (_worldAtlas && window.d3 && window.topojson) {
        const d3 = window.d3, tp = window.topojson;
        const isoNum = COUNTRY_ISO_NUM[normalizeCountry(run.country)];
        const countries = tp.feature(_worldAtlas, _worldAtlas.objects.countries);
        const feature = isoNum ? countries.features.find(f => Number(f.id) === isoNum) : null;

        if (feature) {
          // For Korea: extend projection bounds to include Dokdo (131.86°E, 37.24°N)
          const KR_ISO = 410;
          const DOKDO_COORD = [131.8644, 37.2425];
          const fitTarget = isoNum === KR_ISO
            ? { type:'FeatureCollection', features:[feature,
                { type:'Feature', geometry:{ type:'Point', coordinates: DOKDO_COORD } }] }
            : feature;

          const proj = d3.geoMercator()
            .fitExtent([[SIL_X0, SIL_Y0],[SIL_X1, SIL_Y1]], fitTarget);
          const pathGen = d3.geoPath().projection(proj).context(ctx);

          ctx.fillStyle = _ta(light, 0.5);
          ctx.beginPath(); pathGen(feature); ctx.fill();
          ctx.strokeStyle = _ta(light, 0.5); ctx.lineWidth = 1;
          ctx.beginPath(); pathGen(feature); ctx.stroke();

          // Draw Dokdo as a small visible dot
          if (isoNum === KR_ISO) {
            const [dx, dy] = proj(DOKDO_COORD);
            const r = Math.max(3, Math.min(SIL_X1 - SIL_X0, SIL_Y1 - SIL_Y0) * 0.025);
            ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2);
            ctx.fillStyle = _ta(light, 0.5); ctx.fill();
          }
        } else {
          // Country not found — draw a simple circle outline placeholder
          const cx=(SIL_X0+SIL_X1)/2, cy=(SIL_Y0+SIL_Y1)/2, r=Math.min((SIL_X1-SIL_X0),(SIL_Y1-SIL_Y0))/2;
          ctx.strokeStyle=_tc(light); ctx.lineWidth=2;
          ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
          ctx.fillStyle=_ta(light,0.12); ctx.fill();
        }
      } else {
        // Atlas loading — show "..." placeholder
        ctx.fillStyle=_ta(light,0.50); ctx.font='400 18px "Noto Sans KR",sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('…', (SIL_X0+SIL_X1)/2, (SIL_Y0+SIL_Y1)/2);
      }

      // ── left text column ──────────────────────────────────────────────
      const TY = H * 0.595; // baseline reference

      // MARKED. + date
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.fillStyle=_ta(light,0.45); ctx.font='500 13px "Noto Sans KR",sans-serif';
      ctx.fillText('MARKED.', PAD, TY);
      ctx.textAlign='right';
      ctx.fillText(fmtDate(run.date), W*0.50 - 16, TY);

      // thin rule
      ctx.strokeStyle=_ta(light,0.22); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD, TY+14); ctx.lineTo(W*0.50-16, TY+14); ctx.stroke();

      // city name
      const city=cityL(run.city,lang);
      const cfs=city.length>8?58:city.length>5?72:88;
      ctx.fillStyle=_tc(light); ctx.font=`900 ${cfs}px "Noto Sans KR",sans-serif`;
      ctx.textAlign='left'; ctx.fillText(city, PAD, TY+100);

      // country
      ctx.fillStyle=_ta(light,0.50); ctx.font='400 14px "Noto Sans KR",sans-serif';
      ctx.fillText(`${flagOf(run.country)}  ${countL(run.country,lang)}`, PAD, TY+128);

      // thin rule
      ctx.strokeStyle=_ta(light,0.22); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(PAD, TY+148); ctx.lineTo(W*0.50-16, TY+148); ctx.stroke();

      // 3 stats stacked vertically (left column only)
      [
        [L('거리','DIST',lang), `${Number(run.km).toFixed(1)} km`],
        [L('페이스','PACE',lang), pace?`${pace.label}/km`:'—'],
        [L('시간','TIME',lang), `${run.minutes}${L('분','m',lang)}`],
      ].forEach(([lbl,val],i) => {
        const y = TY+180+i*62;
        ctx.fillStyle=_ta(light,0.40); ctx.font='400 11px "Noto Sans KR",sans-serif';
        ctx.textAlign='left'; ctx.fillText(lbl.toUpperCase(), PAD, y);
        ctx.fillStyle=_tc(light); ctx.font='700 28px "Noto Sans KR",sans-serif';
        ctx.fillText(val, PAD, y+30);
      });

      ctx.restore();
    }

    // ========================================
    // drawColorLiner (PRESERVED — Noto Sans KR)
    // ========================================
    function drawColorLiner(ctx, W, H, run, pace, palette) {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, palette.from);
      g.addColorStop(1, palette.to);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let i = 0; i < 600; i++) {
        ctx.fillRect(Math.random()*W, Math.random()*H, 1.2, 1.2);
      }

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '500 24px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('MARKED', 80, 90);

      ctx.font = '400 48px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(flagOf(run.country), W - 80, 100);

      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.font = `900 ${run.city.length > 5 ? 200 : 240}px "Noto Sans KR", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(run.city, W/2, H/2);

      const stripY = H - 260;

      ctx.strokeStyle = palette.accent;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(80, stripY); ctx.lineTo(W - 80, stripY); ctx.stroke();

      ctx.fillStyle = palette.accent;
      ctx.font = '900 88px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      const cityText = run.city.length > 10 ? run.city.slice(0,10) : run.city;
      ctx.fillText(cityText, 80, stripY + 100);

      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = '600 26px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(run.country, W - 80, stripY + 100);

      const paceStr = pace ? pace.label : '—';
      const statsLine = `${Number(run.km).toFixed(1)} KM  ·  ${paceStr} /km  ·  ${run.minutes}m  ·  ${fmtDate(run.date)}`;
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.font = '500 26px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(statsLine, 80, stripY + 148);

      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(80, stripY + 174); ctx.lineTo(W - 80, stripY + 174); ctx.stroke();
    }

    // ========================================
    // drawColorCard (PRESERVED — Noto Sans KR)
    // ========================================
    function drawColorCard(ctx, W, H, run, pace, palette) {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, palette.from);
      g.addColorStop(1, palette.to);
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let i = 0; i < 700; i++) {
        const x = Math.random() * W, y = Math.random() * H;
        ctx.fillRect(x, y, 1.2, 1.2);
      }

      // Top: MARKED wordmark (centered)
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '500 22px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('M A R K E D', W/2, 110);

      // Center: big city
      ctx.fillStyle = palette.accent;
      ctx.font = '700 120px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';
      const city = run.city.length > 9 ? run.city.slice(0,9) : run.city;
      ctx.fillText(city, W/2, H/2 - 80);

      // Country (letter-spaced)
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '500 24px "Noto Sans KR", sans-serif';
      const spaced = run.country.split('').join('  ');
      ctx.fillText(spaced, W/2, H/2 - 30);

      // Dotted divider
      const cy = H/2 + 30;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      const dots = 30;
      for (let i = 0; i < dots; i++) {
        const x = W/2 - 220 + (i * (440 / (dots - 1)));
        ctx.beginPath(); ctx.arc(x, cy, 1.6, 0, Math.PI*2); ctx.fill();
      }

      // 3 stat columns
      const baseY = H/2 + 100;
      const cols = [
        { label: '거리',   value: `${Number(run.km).toFixed(1)} km` },
        { label: '페이스', value: pace ? pace.label : '—' },
        { label: '시간',   value: `${run.minutes}분` },
      ];
      const colW = W / 4;
      cols.forEach((c, i) => {
        const x = W/2 + (i - 1) * colW;
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.font = '500 22px "Noto Sans KR", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(c.label, x, baseY);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '700 44px "Noto Sans KR", sans-serif';
        ctx.fillText(c.value, x, baseY + 60);
      });

      // Bottom: date + flag
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '600 22px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(fmtDate(run.date), 60, H - 60);

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '500 20px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(`${flagOf(run.country)}  ${run.country}`, W - 60, H - 60);
    }

    // ========================================
    // Page: History
    // ========================================
    function HistoryPage({ runs, onDelete }) {
      const { navigate } = useRouter();

      const grouped = useMemo(() => {
        const map = new Map();
        runs.forEach(r => {
          const key = r.country || '기타';
          if (!map.has(key)) map.set(key, []);
          map.get(key).push(r);
        });
        for (const [, arr] of map) arr.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
        return Array.from(map.entries()).sort((a,b) => {
          const ad = a[1][0]?.date || ''; const bd = b[1][0]?.date || '';
          return bd.localeCompare(ad);
        });
      }, [runs]);

      return (
        <PhoneFrame>
          <TopBar

            onBack={() => navigate('home')}
            right={<Badge>{runs.length}</Badge>}

    function ExplorePage() {
      const { navigate } = useRouter();
      const { user } = useAuthCtx();
      const [courses, setCourses] = useState(SAMPLE_COURSES);
      const [showForm, setShowForm] = useState(false);
      const [search, setSearch] = useState('');
      const [copied, setCopied] = useState(null);
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [continent, setContinent] = useState('all');

      // Load from server and merge with sample courses
      useEffect(() => {
        api.get('/api/courses')
          .then(data => {
            const dbCourses = data.map(c => ({ ...c, mapUrl: c.map_url || c.mapUrl || '', imageUrl: c.image_url || '' }));
            const dbIds = new Set(dbCourses.map(c => String(c.id)));
            const sampleOnly = SAMPLE_COURSES.filter(c => !dbIds.has(String(c.id)));
            setCourses([...dbCourses, ...sampleOnly]);
          })
          .catch(() => {});
      }, []);

      const filtered = courses.filter(c => {
        const matchSearch = !search || c.city.includes(search) || c.name.includes(search) || (c.country||'').includes(search);
        const matchContinent = continent === 'all' || CONTINENT_MAP[c.country] === continent;
        return matchSearch && matchContinent;
      });

      const copyLink = (course) => {
        const url = course.mapUrl || course.map_url || '';
        navigator.clipboard.writeText(url).then(() => {
          setCopied(course.id);
          setTimeout(() => setCopied(null), 2000);
        });
      };

      const openMaps = (course) => {
        const url = course.mapUrl || course.map_url || '';
        if (url) window.open(url, '_blank');
      };

      const addCourse = async (newCourse) => {
        const { imageFile, ...rest } = newCourse;
        const formData = new FormData();
        Object.entries(rest).forEach(([k, v]) => { if (v != null && v !== '') formData.append(k, v); });
        if (imageFile) formData.append('image', imageFile);
        if (user) { formData.append('userId', user.id); formData.append('userName', user.name); }
        try {
          const saved = await api.postForm('/api/courses', formData);
          setCourses(prev => [{ ...saved, mapUrl: saved.map_url||'', imageUrl: saved.image_url||'' }, ...prev]);
        } catch {
          setCourses(prev => [{ ...rest, id:'local_'+Date.now(), mapUrl: rest.mapUrl||'', imageUrl:'' }, ...prev]);
        }
        setShowForm(false);
      };

      const deleteCourse = async (id) => {
        if (!confirm('이 코스를 삭제할까요?')) return;
        try { await api.del(`/api/courses/${id}`, { userId: user?.id }); } catch {}
        setCourses(prev => prev.filter(c => c.id !== id));
      };

      return (
        <>
        <PhoneFrame>
          <TopBar title="러닝 코스" />
          <div className="px-5 pt-4 pb-28 space-y-4 fade-up">
            {/* Search */}
            <div className="relative">
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="도시 또는 코스명 검색"
                className="w-full bg-white border border-border rounded-xl px-4 py-3 text-ink placeholder-muted focus:border-ink outline-none pr-10"
              />
              {search && (
                <button onClick={() => setSearch('')}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-muted text-lg">×</button>
              )}
            </div>

            {/* Continent filter */}
            <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
              {CONTINENTS.map(c => (
                <button
                  key={c.key}
                  onClick={() => setContinent(c.key)}
                  className={`shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border transition whitespace-nowrap ${
                    continent === c.key
                      ? 'bg-ink text-white border-ink'
                      : 'bg-white text-muted border-border hover:border-ink'
                  }`}
                >
                  <span>{c.icon}</span>
                  <span>{c.label}</span>
                </button>
              ))}
            </div>

            {/* Add course button */}
            <Button variant="coral" size="md" onClick={() => setShowForm(true)} className="w-full">
              + 코스 등록하기
            </Button>

            {/* Course cards */}
            <div className="space-y-3">
              {filtered.length === 0 && (
                <div className="text-center py-12 text-muted text-sm">검색 결과가 없습니다</div>
              )}
              {filtered.map(course => {
                const imgSrc = course.imageUrl || course.image_url || '';
                return (
                  <Card key={course.id} className="overflow-hidden cursor-pointer hover:border-ink transition"
                    onClick={() => setSelectedCourse(course)}>
                    {/* Photo thumbnail */}
                    {imgSrc && (
                      <img src={imgSrc} alt={course.name}
                        className="w-full h-44 object-cover"
                        onError={e => { e.target.style.display='none'; }}
                      />
                    )}
                    <div className="p-4">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-base">{flagOf(course.country)}</span>
                            <span className="text-xs text-muted">{course.city} · {course.country}</span>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${
                              course.difficulty === '초급' ? 'bg-green-50 text-green-700' :
                              course.difficulty === '중급' ? 'bg-amber-50 text-amber-700' :
                              'bg-red-50 text-red-700'
                            }`}>{course.difficulty}</span>
                          </div>
                          <h3 className="font-bold text-ink text-base leading-snug">{course.name}</h3>
                          {course.user_name && course.user_name !== '익명' && (
                            <p className="text-xs text-muted mt-0.5">by {course.user_name}</p>
                          )}
                          <p className="text-sm text-muted mt-1 leading-relaxed line-clamp-2">{course.description}</p>
                          <div className="flex items-center justify-between mt-2">
                            <div className="flex items-center gap-1">
                              <span className="text-xs font-medium text-coral">{course.distance} km</span>
                              <span className="text-muted text-xs">· {fmtDate(course.date)}</span>
                            </div>
                            <span className="text-xs text-muted flex items-center gap-1">
                              러너 기록 보기 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            </span>
                          </div>
                        </div>
                        {user && (user.isAdmin || String(user.id) === String(course.user_id)) && (
                          <button onClick={e => { e.stopPropagation(); deleteCourse(course.id); }}
                            className="text-muted hover:text-red-400 transition text-lg shrink-0 leading-none ml-2">×</button>
                        )}
                      </div>
                    </div>
                  </Card>
                );
              })}
            </div>
          </div>

          {/* Add course modal */}
          {showForm && <CourseForm onAdd={addCourse} onClose={() => setShowForm(false)} />}

          <BottomNav />
        </PhoneFrame>

        {/* Course detail overlay */}
        {selectedCourse && (
          <CourseDetail course={selectedCourse} onClose={() => setSelectedCourse(null)} />
        )}
        </>
      );
    }

    // ========================================
    // App + Routes
    // ========================================
    function App() {
      const auth = useAuth();
      const [runs, setRuns] = useState([]);

      // Load runs from server when user logs in
      useEffect(() => {
        if (!auth.user) { setRuns([]); return; }
        api.get(`/api/runs?userId=${auth.user.id}`)
          .then(data => setRuns(data.map(r => ({ ...r, km: parseFloat(r.km) }))))
          .catch(() => setRuns(loadRuns())); // fallback to localStorage
      }, [auth.user?.id]);

      const addRun = async (run) => {
        try {
          const saved = await api.post('/api/runs', { ...run, userId: auth.user.id });
          const normalized = { ...saved, km: parseFloat(saved.km) };
          setRuns(prev => [normalized, ...prev]);
          return normalized;
        } catch {
          const localRun = { ...run, id: run.id || Date.now() };
          setRuns(prev => [localRun, ...prev]);
          return localRun;
        }
      };

      const editRun = async (run) => {
        try {
          const saved = await api.put(`/api/runs/${run.id}`, { ...run, userId: auth.user.id });
          const normalized = { ...saved, km: parseFloat(saved.km) };
          setRuns(prev => prev.map(r => String(r.id) === String(run.id) ? normalized : r));
          return normalized;
        } catch {
          setRuns(prev => prev.map(r => String(r.id) === String(run.id) ? run : r));
          return run;
        }
      };

      const deleteRun = async (id) => {
        try { await api.del(`/api/runs/${id}`, { userId: auth.user?.id }); } catch {}
        setRuns(prev => prev.filter(x => x.id !== id));
      };

      return (
        <AuthContext.Provider value={auth}>
          <Router>
            <Routes runs={runs} addRun={addRun} editRun={editRun} deleteRun={deleteRun} />
          </Router>
        </AuthContext.Provider>
      );
    }

    function Routes({ runs, addRun, editRun, deleteRun }) {
      const { path, state, navigate } = useRouter();
      const { user } = useAuthCtx();

      const protectedRoutes = ['record', 'history', 'stamp', 'profile', 'explore'];

      useEffect(() => {
        if (!user && protectedRoutes.includes(path)) {
          navigate('login');
        }
      }, [path, user, navigate]);

      switch (path) {
        case 'login':
          return <LoginPage />;
        case 'record':
          if (!user) return <LoginPage />;
          return <RecordPage onSave={addRun} onEdit={editRun} />;
        case 'stamp':
          if (!user) return <LoginPage />;
          return <StampPage initial={state} />;
        case 'history':
          if (!user) return <LoginPage />;
          return <HistoryPage runs={runs} onDelete={deleteRun} />;
        case 'profile':
          if (!user) return <LoginPage />;
          return <ProfilePage runs={runs} onDelete={deleteRun} />;
        case 'explore':
          if (!user) return <LoginPage />;
          return <ExplorePage />;
        case 'home':
        default:
          return user ? <HomePersonal runs={runs} /> : <HomeCommunity />;
      }
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
