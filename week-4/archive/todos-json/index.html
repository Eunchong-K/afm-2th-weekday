<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // ========================================
    // Sample Data
    // ========================================
    const INITIAL_TODOS = [
      { id: 1, text: "Buy groceries from the supermarket", done: false },
      { id: 2, text: "Finish the weekly project report", done: false },
      { id: 3, text: "Call the dentist to schedule an appointment", done: false },
      { id: 4, text: "Clean and organize the home office", done: false },
      { id: 5, text: "Read at least 30 pages of a book", done: false },
    ];

    // ========================================
    // TodoItem Component
    // ========================================
    function TodoItem({ todo, onToggle }) {
      return (
        <li
          className="flex items-center gap-3 px-4 py-3 bg-white rounded-lg shadow-sm hover:shadow transition-shadow"
        >
          <input
            type="checkbox"
            checked={todo.done}
            onChange={() => onToggle(todo.id)}
            className="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
          />
          <span
            className={`flex-1 text-gray-800 ${
              todo.done ? "line-through text-gray-400" : ""
            }`}
          >
            {todo.text}
          </span>
        </li>
      );
    }

    // ========================================
    // App Component
    // ========================================
    function App() {
      const [todos, setTodos] = useState(INITIAL_TODOS);
      const [input, setInput] = useState("");

      const handleAdd = () => {
        const text = input.trim();
        if (!text) return;
        setTodos((prev) => [
          ...prev,
          { id: Date.now(), text, done: false },
        ]);
        setInput("");
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter") handleAdd();
      };

      const handleToggle = (id) => {
        setTodos((prev) =>
          prev.map((t) => (t.id === id ? { ...t, done: !t.done } : t))
        );
      };

      const doneCount = todos.filter((t) => t.done).length;

      return (
        <div className="max-w-lg mx-auto px-4 py-12">
          <h1 className="text-3xl font-bold text-center text-gray-800 mb-8">
            할 일 목록
          </h1>

          {/* Input */}
          <div className="flex gap-2 mb-6">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="새로운 할 일을 입력하세요"
              className="flex-1 px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-800"
            />
            <button
              onClick={handleAdd}
              className="px-5 py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 active:bg-blue-800 transition-colors"
            >
              추가
            </button>
          </div>

          {/* Stats */}
          <p className="text-sm text-gray-500 mb-3">
            총 {todos.length}개 / 완료 {doneCount}개
          </p>

          {/* List */}
          <ul className="flex flex-col gap-2">
            {todos.map((todo) => (
              <TodoItem key={todo.id} todo={todo} onToggle={handleToggle} />
            ))}
          </ul>
        </div>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
