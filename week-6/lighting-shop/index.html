<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumière — 프리미엄 조명 부티크</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-0: #0b0b10;
      --bg-1: #13131b;
      --bg-2: #1a1a2e;
      --gold: #d4af37;
      --gold-soft: #f1d27a;
      --line: rgba(212, 175, 55, 0.18);
    }
    html, body { background: var(--bg-0); color: #f5f1e6; }
    body {
      font-family: 'Inter', 'Pretendard', ui-sans-serif, system-ui, -apple-system, 'Apple SD Gothic Neo', 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(1100px 600px at 85% -10%, rgba(212,175,55,0.12), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(154, 116, 255, 0.08), transparent 60%),
        linear-gradient(180deg, #0b0b10 0%, #0f0f16 100%);
      min-height: 100vh;
    }
    .font-serif-display {
      font-family: 'Playfair Display', 'Noto Serif KR', ui-serif, Georgia, 'Times New Roman', serif;
      letter-spacing: 0.01em;
    }
    .gold-gradient-text {
      background: linear-gradient(180deg, #f7e9b2 0%, #d4af37 60%, #a6802b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hairline { border-color: var(--line) !important; }
    .card-glow {
      box-shadow:
        0 1px 0 rgba(255,255,255,0.03) inset,
        0 0 0 1px rgba(212,175,55,0.08),
        0 30px 60px -20px rgba(0,0,0,0.6);
    }
    .card-glow:hover {
      box-shadow:
        0 1px 0 rgba(255,255,255,0.05) inset,
        0 0 0 1px rgba(212,175,55,0.35),
        0 40px 80px -20px rgba(212,175,55,0.18);
    }
    /* Shimmer skeleton */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #1a1a24 0%, #24243a 40%, #1a1a24 80%);
      background-size: 800px 100%;
      animation: shimmer 1.6s linear infinite;
    }
    /* Glow pulse for hero */
    @keyframes floatGlow {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 40px rgba(212,175,55,0.35)); }
      50%      { transform: translateY(-6px); filter: drop-shadow(0 0 60px rgba(212,175,55,0.55)); }
    }
    .hero-bulb { animation: floatGlow 5s ease-in-out infinite; }
    /* Hover image zoom */
    .img-zoom { transition: transform 700ms cubic-bezier(.2,.7,.2,1); }
    .group:hover .img-zoom { transform: scale(1.06); }
    /* Button underline animation */
    .link-underline { position: relative; }
    .link-underline::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: -4px;
      height: 1px; background: var(--gold); transform: scaleX(0); transform-origin: right;
      transition: transform 300ms ease;
    }
    .link-underline:hover::after { transform: scaleX(1); transform-origin: left; }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0b0b10; }
    ::-webkit-scrollbar-thumb { background: #23232f; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #2e2e42; }
    /* Toast slide */
    @keyframes toastIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .toast-in { animation: toastIn 260ms ease-out both; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // Hooks & Utilities
    // ========================================
    const { useState, useEffect, useMemo, useContext, createContext, useCallback, useRef } = React;

    const FAL_KEY = "84815a60-81dd-4f0e-9d53-def5724c3a2f:b19f544980a8aa00e57e578fceb29197";

    const KRW = (n) => new Intl.NumberFormat('ko-KR').format(n) + '원';

    // ========================================
    // Product Data
    // ========================================
    const CATEGORIES = [
      { id: 'all',     label: '전체' },
      { id: 'pendant', label: '펜던트' },
      { id: 'floor',   label: '플로어' },
      { id: 'table',   label: '테이블' },
      { id: 'ceiling', label: '실링' },
      { id: 'wall',    label: '월' },
      { id: 'strip',   label: 'LED 스트립' },
    ];

    const PRODUCTS = [
      {
        id: 1,
        name: 'Modern Pendant Light',
        price: 89000,
        category: 'pendant',
        tagline: '미니멀한 곡선이 만드는 우아한 빛',
        description:
          '정제된 실루엣의 모던 펜던트. 따뜻한 3000K 광원이 공간에 은은한 분위기를 더합니다. 다이닝 테이블, 아일랜드 바 위에 이상적.',
        specs: { '소재': '알루미늄 / 유리', '광원': 'E26 / 최대 60W', '색온도': '3000K Warm', '치수': 'Ø280 × H300mm' },
        prompt: 'product photo of a modern minimalist pendant lamp with brass accent and frosted glass, soft warm light, pure white background, studio lighting, catalog style, high quality, ultra sharp',
      },
      {
        id: 2,
        name: 'Industrial Floor Lamp',
        price: 145000,
        category: 'floor',
        tagline: '인더스트리얼 무드의 플로어 램프',
        description:
          '블랙 매트 피니시와 놋쇠 디테일이 조화를 이루는 플로어 램프. 각도 조절이 가능한 쉐이드로 독서 공간에 완벽합니다.',
        specs: { '소재': '스틸 / 황동', '광원': 'E26 / 최대 40W', '높이': '1620mm', '무게': '6.8kg' },
        prompt: 'product photo of an industrial black floor lamp with brass joint and cone shade, tall and elegant, pure white background, studio lighting, catalog style, high quality',
      },
      {
        id: 3,
        name: 'Minimalist Table Lamp',
        price: 65000,
        category: 'table',
        tagline: '책상을 위한 부드러운 오브제',
        description:
          '둥근 돔 쉐이드와 미세한 텍스처 베이스. 침실 협탁, 서재 책상 어디서든 자연스럽게 어우러집니다.',
        specs: { '소재': '세라믹 / 리넨 쉐이드', '광원': 'E17 / 최대 25W', '치수': 'Ø220 × H360mm' },
        prompt: 'product photo of a minimalist ceramic table lamp with linen dome shade, beige tones, pure white background, studio lighting, catalog style, soft shadows',
      },
      {
        id: 4,
        name: 'LED Ceiling Panel',
        price: 120000,
        category: 'ceiling',
        tagline: '균일한 빛, 절제된 디자인',
        description:
          '얇고 넓게 퍼지는 스퀘어 LED 패널. 5단계 디밍과 색온도 조절을 지원해 어떤 공간에도 조화롭게 스며듭니다.',
        specs: { '소재': '알루미늄 프레임', '소비전력': '48W', '색온도': '3000–6500K', '치수': '600 × 600 × 30mm' },
        prompt: 'product photo of a slim modern square LED ceiling panel light glowing softly, pure white background, studio lighting, catalog style, high quality',
      },
      {
        id: 5,
        name: 'Vintage Edison Bulb Pendant',
        price: 75000,
        category: 'pendant',
        tagline: '아날로그 감성의 에디슨 펜던트',
        description:
          '노출형 에디슨 전구가 만드는 따스한 앰버 톤. 카페, 레스토랑, 홈 바 공간의 포인트 조명으로 사랑받습니다.',
        specs: { '소재': '구리 도금 소켓', '광원': 'E26 Edison / 40W', '케이블': '1500mm 조절형' },
        prompt: 'product photo of a vintage exposed edison bulb pendant lamp with amber glow and copper socket, pure white background, studio lighting, catalog style',
      },
      {
        id: 6,
        name: 'Smart RGB Strip Light',
        price: 45000,
        category: 'strip',
        tagline: '무드를 색으로 연주하는 스트립',
        description:
          '앱으로 1600만 컬러를 제어하는 스마트 RGB 스트립. 음악에 반응하는 리듬 모드와 씬 프리셋이 제공됩니다.',
        specs: { '길이': '5m', '전력': '24W', '제어': 'Wi‑Fi / Bluetooth', 'LED': 'SMD 5050' },
        prompt: 'product photo of a coiled smart RGB LED strip light glowing in rainbow colors with remote controller, pure white background, studio lighting, high quality',
      },
      {
        id: 7,
        name: 'Scandinavian Wall Sconce',
        price: 98000,
        category: 'wall',
        tagline: '북유럽 라인의 월 스콘스',
        description:
          '벽과 일체화되는 얇은 브래킷과 오팔 글로브. 복도나 침실 헤드보드 양옆에 대칭으로 설치하면 좋습니다.',
        specs: { '소재': '블랙 스틸 / 오팔 글라스', '광원': 'G9 / 최대 25W', '치수': 'W150 × H220mm' },
        prompt: 'product photo of a scandinavian wall sconce lamp with thin black arm and opal glass globe, pure white background, studio lighting, catalog style, minimalist',
      },
      {
        id: 8,
        name: 'Art Deco Chandelier',
        price: 320000,
        category: 'ceiling',
        tagline: '공간의 중심이 되는 샹들리에',
        description:
          '황동 프레임에 크리스탈 드롭이 겹겹이 맺힌 아르데코 샹들리에. 높은 천장의 거실, 다이닝 룸을 드라마틱하게 완성합니다.',
        specs: { '소재': '황동 / 크리스탈', '광원': 'E14 × 8 / 최대 40W', '치수': 'Ø720 × H600mm' },
        prompt: 'product photo of a luxurious art deco brass chandelier with crystal drops, multiple candle bulbs, elegant and grand, pure white background, studio lighting, high quality',
      },
    ];

    // ========================================
    // fal.ai Image Generation (lazy + cached)
    // ========================================
    const imageCache = new Map();       // id -> url
    const inflight   = new Map();       // id -> Promise

    async function generateProductImage(product) {
      if (imageCache.has(product.id)) return imageCache.get(product.id);
      if (inflight.has(product.id))   return inflight.get(product.id);

      const p = (async () => {
        try {
          const res = await fetch("https://fal.run/fal-ai/flux/schnell", {
            method: "POST",
            headers: {
              "Authorization": `Key ${FAL_KEY}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              prompt: product.prompt,
              image_size: "square",
              num_images: 1,
            }),
          });
          if (!res.ok) throw new Error(`fal.ai ${res.status}`);
          const data = await res.json();
          const url = data?.images?.[0]?.url;
          if (!url) throw new Error('No image URL returned');
          imageCache.set(product.id, url);
          return url;
        } catch (err) {
          console.warn('Image generation failed for', product.name, err);
          // Graceful fallback — elegant placeholder data URI
          const fallback = `data:image/svg+xml;utf8,${encodeURIComponent(
            `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'>
               <defs>
                 <radialGradient id='g' cx='50%' cy='42%' r='55%'>
                   <stop offset='0%' stop-color='#f1d27a'/>
                   <stop offset='45%' stop-color='#6a4f18'/>
                   <stop offset='100%' stop-color='#0b0b10'/>
                 </radialGradient>
               </defs>
               <rect width='400' height='400' fill='#13131b'/>
               <circle cx='200' cy='170' r='90' fill='url(#g)'/>
               <rect x='190' y='255' width='20' height='90' fill='#2a2a3a'/>
               <rect x='150' y='345' width='100' height='10' fill='#2a2a3a'/>
               <text x='50%' y='395' text-anchor='middle' font-family='Georgia,serif' font-size='14' fill='#6a6a7a'>Lumière</text>
             </svg>`
          )}`;
          imageCache.set(product.id, fallback);
          return fallback;
        } finally {
          inflight.delete(product.id);
        }
      })();

      inflight.set(product.id, p);
      return p;
    }

    function useProductImage(product) {
      const [url, setUrl] = useState(() => imageCache.get(product.id) || null);
      const [loading, setLoading] = useState(() => !imageCache.has(product.id));

      useEffect(() => {
        let alive = true;
        if (imageCache.has(product.id)) {
          setUrl(imageCache.get(product.id));
          setLoading(false);
          return;
        }
        setLoading(true);
        generateProductImage(product).then(u => {
          if (!alive) return;
          setUrl(u);
          setLoading(false);
        });
        return () => { alive = false; };
      }, [product.id]);

      return { url, loading };
    }

    // ========================================
    // Cart Context
    // ========================================
    const CartContext = createContext(null);

    function CartProvider({ children }) {
      const [items, setItems] = useState(() => {
        try {
          const raw = localStorage.getItem('lumiere_cart');
          return raw ? JSON.parse(raw) : [];
        } catch { return []; }
      });
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);

      useEffect(() => {
        try { localStorage.setItem('lumiere_cart', JSON.stringify(items)); } catch {}
      }, [items]);

      const pushToast = useCallback((msg) => {
        setToast(msg);
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 2200);
      }, []);

      const add = useCallback((product, qty = 1) => {
        setItems(prev => {
          const found = prev.find(it => it.id === product.id);
          if (found) {
            return prev.map(it => it.id === product.id ? { ...it, qty: it.qty + qty } : it);
          }
          return [...prev, { id: product.id, qty }];
        });
        pushToast(`${product.name} 담김`);
      }, [pushToast]);

      const remove = useCallback((id) => {
        setItems(prev => prev.filter(it => it.id !== id));
      }, []);

      const setQty = useCallback((id, qty) => {
        setItems(prev => prev.map(it => it.id === id ? { ...it, qty: Math.max(1, qty) } : it));
      }, []);

      const clear = useCallback(() => setItems([]), []);

      const count = useMemo(() => items.reduce((n, it) => n + it.qty, 0), [items]);
      const total = useMemo(
        () => items.reduce((sum, it) => {
          const p = PRODUCTS.find(pp => pp.id === it.id);
          return sum + (p ? p.price * it.qty : 0);
        }, 0),
        [items]
      );

      const value = { items, add, remove, setQty, clear, count, total, toast };
      return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
    }
    const useCart = () => useContext(CartContext);

    // ========================================
    // Router (hash-based)
    // ========================================
    const RouterContext = createContext({ path: '#/' });

    function parseHash() {
      const h = window.location.hash || '#/';
      return h.startsWith('#') ? h : `#${h}`;
    }
    function matchRoute(pattern, hash) {
      // pattern: '#/product/:id'  hash: '#/product/3'
      const pParts = pattern.split('/').filter(Boolean);
      const hParts = hash.split('?')[0].split('/').filter(Boolean);
      if (pParts.length !== hParts.length) return null;
      const params = {};
      for (let i = 0; i < pParts.length; i++) {
        if (pParts[i].startsWith(':')) {
          params[pParts[i].slice(1)] = decodeURIComponent(hParts[i]);
        } else if (pParts[i] !== hParts[i]) {
          return null;
        }
      }
      return params;
    }
    function Router({ children }) {
      const [path, setPath] = useState(parseHash());
      useEffect(() => {
        const onChange = () => {
          setPath(parseHash());
          window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
        };
        window.addEventListener('hashchange', onChange);
        if (!window.location.hash) window.location.hash = '#/';
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      return <RouterContext.Provider value={{ path }}>{children}</RouterContext.Provider>;
    }
    const useRouter = () => useContext(RouterContext);
    function Link({ to, children, className = '', ...rest }) {
      return (
        <a href={to} className={className} {...rest}>{children}</a>
      );
    }

    // ========================================
    // Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 font-medium rounded-full transition-all duration-200 whitespace-nowrap disabled:opacity-40 disabled:cursor-not-allowed';
      const sizes = {
        sm: 'px-4 py-2 text-sm',
        md: 'px-6 py-3 text-sm tracking-wide',
        lg: 'px-8 py-4 text-base tracking-wide',
      };
      const variants = {
        primary: 'bg-gradient-to-b from-[#f1d27a] to-[#b9912c] text-[#1a1208] hover:from-[#f6dc8a] hover:to-[#d4af37] shadow-[0_10px_30px_-10px_rgba(212,175,55,0.55)]',
        secondary: 'bg-white/5 border border-white/10 text-[#f5f1e6] hover:bg-white/10 hover:border-white/20',
        ghost: 'text-[#f5f1e6]/80 hover:text-[#f1d27a]',
        outline: 'border border-[#d4af37]/60 text-[#f1d27a] hover:bg-[#d4af37]/10',
        danger: 'bg-red-500/10 border border-red-500/30 text-red-300 hover:bg-red-500/20',
      };
      return (
        <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...rest}>
          {children}
        </button>
      );
    }

    function Badge({ children, className = '' }) {
      return (
        <span className={`inline-block px-2.5 py-0.5 text-[10px] uppercase tracking-[0.14em] rounded-full border border-[#d4af37]/40 text-[#f1d27a] bg-[#d4af37]/5 ${className}`}>
          {children}
        </span>
      );
    }

    function Chip({ active, onClick, children }) {
      return (
        <button
          onClick={onClick}
          className={`px-4 py-2 text-sm rounded-full border transition-all duration-200 ${
            active
              ? 'bg-[#d4af37] border-[#d4af37] text-[#1a1208] shadow-[0_6px_20px_-6px_rgba(212,175,55,0.55)]'
              : 'bg-white/[0.03] border-white/10 text-[#f5f1e6]/70 hover:border-[#d4af37]/40 hover:text-[#f1d27a]'
          }`}
        >
          {children}
        </button>
      );
    }

    function IconCart({ className = 'w-5 h-5' }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" className={className} strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.5L22 8H6" />
          <circle cx="10" cy="21" r="1.4" />
          <circle cx="18" cy="21" r="1.4" />
        </svg>
      );
    }
    function IconBulb({ className = 'w-6 h-6' }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" className={className} strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.7.6 1 1.4 1 2.3h6c0-.9.3-1.7 1-2.3A7 7 0 0 0 12 2z"/>
        </svg>
      );
    }
    function IconChevron({ className = 'w-4 h-4' }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className={className} strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 6l6 6-6 6"/>
        </svg>
      );
    }
    function IconTrash({ className = 'w-4 h-4' }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" className={className} strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>
        </svg>
      );
    }

    // ========================================
    // Layout — Header / Footer
    // ========================================
    function Header() {
      const { count } = useCart();
      const { path } = useRouter();
      return (
        <header className="sticky top-0 z-30 backdrop-blur-xl bg-[#0b0b10]/70 border-b hairline">
          <div className="max-w-7xl mx-auto px-5 md:px-8 h-16 md:h-20 flex items-center justify-between">
            <Link to="#/" className="flex items-center gap-3 group">
              <span className="w-9 h-9 rounded-full bg-gradient-to-b from-[#f7e9b2] to-[#a6802b] flex items-center justify-center text-[#1a1208] shadow-[0_8px_24px_-8px_rgba(212,175,55,0.7)]">
                <IconBulb className="w-5 h-5" />
              </span>
              <div className="leading-tight">
                <div className="font-serif-display text-xl md:text-2xl gold-gradient-text">Lumière</div>
                <div className="text-[10px] tracking-[0.32em] text-[#f5f1e6]/50 uppercase">Lighting Boutique</div>
              </div>
            </Link>

            <nav className="hidden md:flex items-center gap-8 text-sm text-[#f5f1e6]/70">
              <Link to="#/" className={`link-underline ${path === '#/' ? 'text-[#f1d27a]' : ''}`}>컬렉션</Link>

                  <span className="text-[#f5f1e6]/80">결제 예정 금액</span>
                  <span className="font-serif-display text-2xl gold-gradient-text">{KRW(grand)}</span>
                </div>
              </div>
              <Button size="lg" className="w-full mt-6" onClick={() => alert('결제 페이지는 데모에서 제공되지 않습니다.')}>
                결제하기
              </Button>
              <Link to="#/" className="block text-center text-xs text-[#f5f1e6]/50 hover:text-[#f1d27a] mt-4">
                ← 쇼핑 계속하기
              </Link>
            </aside>
          </div>
        </div>
      );
    }

    // ========================================
    // Routes resolver
    // ========================================
    function Routes() {
      const { path } = useRouter();

      // product detail
      const detail = matchRoute('#/product/:id', path);
      if (detail) return <ProductDetailPage id={detail.id} />;

      if (path === '#/cart') return <CartPage />;
      if (path === '#/' || path === '#' || path === '') return <HomePage />;

      // 404
      return (
        <div className="max-w-3xl mx-auto px-5 md:px-8 py-24 text-center">
          <div className="font-serif-display text-4xl mb-3">404</div>
          <p className="text-[#f5f1e6]/60 mb-6">존재하지 않는 페이지입니다.</p>
          <Link to="#/"><Button>홈으로</Button></Link>
        </div>
      );
    }

    // ========================================
    // Toast
    // ========================================
    function Toast() {
      const { toast } = useCart();
      if (!toast) return null;
      return (
        <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 toast-in">
          <div className="px-5 py-3 rounded-full bg-[#1a1a2e]/95 border border-[#d4af37]/40 backdrop-blur text-sm text-[#f5f1e6] shadow-[0_10px_40px_-10px_rgba(212,175,55,0.4)] flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-[#d4af37] shadow-[0_0_10px_2px_rgba(212,175,55,0.6)]" />
            {toast}
          </div>
        </div>
      );
    }

    // ========================================
    // App
    // ========================================
    function App() {
      return (
        <Router>
          <CartProvider>
            <Header />
            <main>
              <Routes />
            </main>
            <Footer />
            <Toast />
          </CartProvider>
        </Router>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
