<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Upload Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- ImageKit client helper (window.ImageKitClient) -->
  <script src="/client.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useRef, useCallback } = React;

    // ========================================
    // Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, children, className = '', type = 'button' }) {
      const variants = {
        primary: 'bg-blue-600 hover:bg-blue-700 text-white',
        secondary: 'bg-slate-200 hover:bg-slate-300 text-slate-800',
        danger: 'bg-red-500 hover:bg-red-600 text-white',
        ghost: 'bg-transparent hover:bg-slate-100 text-slate-700',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-4 py-2 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-xl shadow-sm border border-slate-200 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, color = 'slate' }) {
      const colors = {
        slate: 'bg-slate-100 text-slate-700',
        green: 'bg-green-100 text-green-700',
        blue: 'bg-blue-100 text-blue-700',
        red: 'bg-red-100 text-red-700',
      };
      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${colors[color]}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // Utility Functions
    // ========================================
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // ========================================
    // DropZone Component
    // ========================================
    function DropZone({ onFileSelect, disabled }) {
      const inputRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);

      const handleDragOver = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!disabled) setIsDragging(true);
      }, [disabled]);

      const handleDragLeave = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
      }, []);

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
        if (disabled) return;

        const files = e.dataTransfer.files;
        if (files && files.length > 0) {
          const file = files[0];
          if (file.type.startsWith('image/')) {
            onFileSelect(file);
          } else {
            alert('이미지 파일만 업로드 가능합니다.');
          }
        }
      }, [onFileSelect, disabled]);

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (file) onFileSelect(file);
      };

      const handleClick = () => {
        if (!disabled) inputRef.current?.click();
      };

      return (
        <div
          onDragOver={handleDragOver}
          onDragLeave={handleDragLeave}
          onDrop={handleDrop}
          onClick={handleClick}
          className={`
            relative border-2 border-dashed rounded-xl p-10 text-center cursor-pointer transition-all
            ${isDragging
              ? 'border-blue-500 bg-blue-50'
              : 'border-slate-300 bg-slate-50 hover:border-blue-400 hover:bg-blue-50/50'}
            ${disabled ? 'opacity-50 cursor-not-allowed' : ''}
          `}
        >
          <input
            ref={inputRef}
            type="file"
            accept="image/*"
            onChange={handleFileChange}
            className="hidden"
            disabled={disabled}
          />
          <div className="flex flex-col items-center gap-3">
            <div className="w-14 h-14 rounded-full bg-white flex items-center justify-center shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" className="w-7 h-7 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 12V4m0 0l-4 4m4-4l4 4" />
              </svg>
            </div>
            <div>
              <p className="text-slate-700 font-medium">
                {isDragging ? '여기에 놓으세요' : '이미지를 드래그하거나 클릭해서 업로드'}
              </p>
              <p className="text-slate-400 text-sm mt-1">
                PNG, JPG, GIF, WEBP 등 이미지 파일 지원
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // FileInfo Component
    // ========================================
    function FileInfo({ file }) {
      return (
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
          <div className="p-3 bg-slate-50 rounded-lg">
            <p className="text-slate-500 text-xs mb-1">파일명</p>
            <p className="font-medium text-slate-800 truncate" title={file.name}>{file.name}</p>
          </div>
          <div className="p-3 bg-slate-50 rounded-lg">
            <p className="text-slate-500 text-xs mb-1">크기</p>
            <p className="font-medium text-slate-800">{formatBytes(file.size)}</p>
          </div>
          <div className="p-3 bg-slate-50 rounded-lg">
            <p className="text-slate-500 text-xs mb-1">타입</p>
            <p className="font-medium text-slate-800">{file.type || 'unknown'}</p>
          </div>
        </div>
      );
    }

    // ========================================
    // Main App Component
    // ========================================
    function App() {
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState(null);
      const [status, setStatus] = useState('idle'); // 'idle' | 'uploading' | 'success' | 'error'
      const [progress, setProgress] = useState(0);
      const [uploadResult, setUploadResult] = useState(null); // ImageKit response
      const [errorMessage, setErrorMessage] = useState('');

      const handleFileSelect = (selectedFile) => {
        setFile(selectedFile);
        setStatus('idle');
        setProgress(0);
        setUploadResult(null);
        setErrorMessage('');
        const reader = new FileReader();
        reader.onload = (e) => setPreview(e.target.result);
        reader.readAsDataURL(selectedFile);
      };

      const handleUpload = async () => {
        if (!file) return;
        if (!window.ImageKitClient) {
          setStatus('error');
          setErrorMessage('ImageKitClient 가 로드되지 않았습니다. client.js 경로를 확인하세요.');
          return;
        }

        setStatus('uploading');
        setProgress(0);
        setUploadResult(null);
        setErrorMessage('');

        try {
          const result = await window.ImageKitClient.uploadFile(file, {
            folder: '/uploads',
            onProgress: (pct) => setProgress(pct),
          });
          setUploadResult(result);
          setStatus('success');
        } catch (err) {
          console.error('Upload error:', err);
          setErrorMessage(err?.message || '업로드 중 오류가 발생했습니다.');
          setStatus('error');
        }
      };

      const handleReset = () => {
        setFile(null);
        setPreview(null);
        setStatus('idle');
        setProgress(0);
        setUploadResult(null);
        setErrorMessage('');
      };

      const handleCopyUrl = async () => {
        if (!uploadResult?.url) return;
        try {
          await navigator.clipboard.writeText(uploadResult.url);
          alert('URL이 복사되었습니다.');
        } catch (_) {
          // fallback: just select nothing, user can copy manually
        }
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-10">
          {/* Header */}
          <div className="mb-8">
            <h1 className="text-2xl sm:text-3xl font-bold text-slate-900">이미지 업로드 테스트</h1>
            <p className="text-slate-500 mt-1 text-sm">
              ImageKit 에 실제로 업로드됩니다. 드래그 앤 드롭 또는 클릭으로 이미지를 선택하세요.
            </p>
          </div>

          <Card className="p-6 space-y-6">
            {/* DropZone or Preview */}
            {!file ? (
              <DropZone onFileSelect={handleFileSelect} disabled={status === 'uploading'} />
            ) : (
              <div className="space-y-4">
                <div className="relative rounded-xl overflow-hidden bg-slate-50 border border-slate-200">
                  <img
                    src={preview}
                    alt="미리보기"
                    className="w-full max-h-[420px] object-contain"
                  />
                </div>
                <FileInfo file={file} />
              </div>
            )}

            {/* Uploading */}
            {status === 'uploading' && (
              <div className="p-4 bg-blue-50 border border-blue-200 rounded-lg space-y-2">
                <div className="flex items-center gap-3">
                  <svg className="animate-spin w-5 h-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                  </svg>
                  <p className="text-blue-700 text-sm font-medium flex-1">업로드 중... {progress}%</p>
                </div>
                <div className="w-full bg-blue-100 rounded-full h-2 overflow-hidden">
                  <div
                    className="bg-blue-600 h-2 transition-all"
                    style={{ width: `${progress}%` }}
                  />
                </div>
              </div>
            )}

            {/* Success */}
            {status === 'success' && uploadResult && (
              <div className="p-4 bg-green-50 border border-green-200 rounded-lg space-y-3">
                <div className="flex items-center gap-3">
                  <svg className="w-5 h-5 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                  </svg>
                  <div className="flex-1">
                    <p className="text-green-700 text-sm font-medium">업로드 성공!</p>
                    <p className="text-green-600 text-xs mt-0.5">ImageKit 에 업로드가 완료되었습니다.</p>
                  </div>
                  <Badge color="green">완료</Badge>
                </div>

                <div className="bg-white border border-green-200 rounded-lg p-3 space-y-2">
                  <p className="text-xs text-slate-500">업로드된 URL</p>
                  <div className="flex items-center gap-2">
                    <a
                      href={uploadResult.url}
                      target="_blank"
                      rel="noreferrer"
                      className="text-blue-600 hover:underline text-sm break-all flex-1"
                    >
                      {uploadResult.url}
                    </a>
                    <Button size="sm" variant="secondary" onClick={handleCopyUrl}>복사</Button>
                  </div>
                  {uploadResult.thumbnailUrl && (
                    <div className="pt-2 border-t border-slate-100">
                      <p className="text-xs text-slate-500 mb-1">썸네일</p>
                      <img
                        src={uploadResult.thumbnailUrl}
                        alt="thumbnail"
                        className="h-20 rounded border border-slate-200"
                      />
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Error */}
            {status === 'error' && (
              <div className="flex items-start gap-3 p-4 bg-red-50 border border-red-200 rounded-lg">
                <svg className="w-5 h-5 text-red-600 mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                </svg>
                <div className="flex-1">
                  <p className="text-red-700 text-sm font-medium">업로드 실패</p>
                  <p className="text-red-600 text-xs mt-0.5 break-all">{errorMessage}</p>
                </div>
                <Badge color="red">오류</Badge>
              </div>
            )}

            {/* Action Buttons */}
            {file && (
              <div className="flex flex-wrap gap-2 justify-end pt-2 border-t border-slate-100">
                <Button
                  variant="secondary"
                  onClick={handleReset}
                  disabled={status === 'uploading'}
                >
                  초기화
                </Button>
                <Button
                  variant="primary"
                  onClick={handleUpload}
                  disabled={status === 'uploading' || status === 'success'}
                >
                  {status === 'uploading'
                    ? `업로드 중... ${progress}%`
                    : status === 'success'
                      ? '업로드 완료'
                      : status === 'error'
                        ? '다시 시도'
                        : '업로드'}
                </Button>
              </div>
            )}
          </Card>

          {/* Footer */}
          <p className="text-center text-slate-400 text-xs mt-6">
            ImageKit 직접 업로드 (클라이언트 사이드) · GET /auth 로 서명 발급 후 ImageKit 으로 직접 전송
          </p>
        </div>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
