<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APNEA - Go Deeper, Stay Longer.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    /*
      DB 구조 참고
      products: id, name, price, image_url, description
      cart:     id, user_id, product_id, quantity
    */

    html, body {
      font-family: 'Helvetica Neue', 'Segoe UI', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      letter-spacing: -0.01em;
      color: #0b1f3a;
    }

    /* Sunlit Ocean - 전체 페이지 은은한 바다 그래디언트 (화이트 톤 위주) */
    .ocean-bg {
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(186, 230, 253, 0.55), transparent 60%),
        radial-gradient(900px 500px at 95% 10%, rgba(165, 243, 252, 0.45), transparent 60%),
        radial-gradient(1100px 700px at 50% 110%, rgba(207, 250, 254, 0.55), transparent 60%),
        linear-gradient(180deg, #ffffff 0%, #f8fcff 50%, #ffffff 100%);
      min-height: 100vh;
    }

    /* 히어로 섹션 - 햇살 비치는 바다 느낌의 그래디언트 */
    .hero-bg {
      background:
        radial-gradient(800px 300px at 50% -10%, rgba(255, 255, 255, 0.95), transparent 70%),
        linear-gradient(180deg, rgba(224, 242, 254, 0.7) 0%, rgba(207, 250, 254, 0.55) 40%, rgba(236, 254, 255, 0.4) 100%);
      position: relative;
      overflow: hidden;
    }

    /* 햇살 라인 효과 */
    .hero-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        100deg,
        transparent 0,
        transparent 80px,
        rgba(255, 255, 255, 0.18) 80px,
        rgba(255, 255, 255, 0.18) 82px
      );
      pointer-events: none;
    }

    /* 부드러운 물결 애니메이션 (히어로 하단 장식용) */
    @keyframes wave-flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .wave {
      animation: wave-flow 18s linear infinite;
    }

    /* 카드 호버 효과 */
    .product-card {
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -20px rgba(8, 47, 73, 0.18);
    }

    /* 모달 */
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fade-in 0.2s ease-out; }
    .slide-up { animation: slide-up 0.25s ease-out; }

    /* 사이드 카트 슬라이드 */
    @keyframes slide-in-right {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .slide-in-right { animation: slide-in-right 0.3s ease-out; }

    /* 딥 네이비 컬러 */
    .text-deep-navy { color: #0b1f3a; }
    .bg-deep-navy { background-color: #0b1f3a; }
    .border-deep-navy { border-color: #0b1f3a; }

    /* 토스트 */
    @keyframes toast-in {
      0% { opacity: 0; transform: translate(-50%, 12px); }
      10% { opacity: 1; transform: translate(-50%, 0); }
      90% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -8px); }
    }
    .toast { animation: toast-in 2.4s ease forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef, createContext, useContext } = React;

    const TOSS_CLIENT_KEY = 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';

    // DB: products(id, name, price, image_url, description)
    // DB: cart(id, user_id, product_id, quantity)
    const API = '/api';

    const formatKRW = (n) => new Intl.NumberFormat('ko-KR').format(n) + '원';

    // ========================================
    // 토큰 헬퍼
    // ========================================
    const getToken = () => localStorage.getItem('apnea_token');
    const setToken = (t) => localStorage.setItem('apnea_token', t);
    const clearToken = () => localStorage.removeItem('apnea_token');

    const authHeaders = () => ({
      'Content-Type': 'application/json',
      Authorization: `Bearer ${getToken()}`,
    });

    // ========================================
    // Design System
    // ========================================
    const Button = ({ variant = 'primary', size = 'md', className = '', children, ...rest }) => {
      const base = "inline-flex items-center justify-center gap-2 rounded-full font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-300 disabled:opacity-50 disabled:cursor-not-allowed";
      const variants = {
        primary: "bg-deep-navy text-white hover:bg-[#13315c] active:scale-[0.98] shadow-sm",
        secondary: "bg-white text-deep-navy border border-slate-200 hover:border-slate-300 hover:bg-slate-50",
        ghost: "bg-transparent text-deep-navy hover:bg-slate-100",
        outline: "bg-transparent text-deep-navy border border-deep-navy hover:bg-deep-navy hover:text-white",
        danger: "bg-rose-500 text-white hover:bg-rose-600",
      };
      const sizes = {
        sm: "px-3 py-1.5 text-sm",
        md: "px-5 py-2.5 text-sm",
        lg: "px-6 py-3 text-base",
      };
      return (
        <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...rest}>
          {children}
        </button>
      );
    };

    const Input = ({ label, error, className = '', ...rest }) => (
      <label className="block">
        {label && <span className="block mb-1.5 text-xs font-medium text-slate-600 tracking-wide">{label}</span>}
        <input
          className={`w-full px-4 py-2.5 rounded-xl border ${error ? 'border-rose-400' : 'border-slate-200'} bg-white text-deep-navy placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-200 focus:border-sky-300 transition ${className}`}
          {...rest}
        />
        {error && <span className="mt-1 block text-xs text-rose-500">{error}</span>}
      </label>
    );

    const Modal = ({ isOpen, onClose, title, children, size = 'md' }) => {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose && onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      const sizeMap = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-2xl' };
      return (
        <div className="fixed inset-0 z-50 fade-in">
          <div className="absolute inset-0 bg-deep-navy/30 backdrop-blur-sm" onClick={onClose}></div>
          <div className="absolute inset-0 flex items-center justify-center p-4">
            <div className={`relative w-full ${sizeMap[size]} bg-white rounded-3xl shadow-2xl overflow-hidden slide-up`}>
              <div className="flex items-center justify-between px-6 py-5 border-b border-slate-100">
                <h3 className="text-lg font-semibold text-deep-navy">{title}</h3>
                <button onClick={onClose} aria-label="닫기" className="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
              </div>
              <div className="p-6">{children}</div>
            </div>
          </div>
        </div>
      );
    };

    const Badge = ({ children, className = '' }) => (
      <span className={`inline-flex items-center justify-center min-w-[18px] h-[18px] px-1.5 rounded-full bg-sky-500 text-white text-[10px] font-bold ${className}`}>
        {children}
      </span>
    );

    // ========================================
    // 이미지 플레이스홀더 (실제 이미지 없으므로 fallback)
    // ========================================
    const ProductImage = ({ src, alt, productId }) => {
      const [errored, setErrored] = useState(false);
      // 상품별 색상 그라데이션 (Sunlit Ocean 팔레트)
      const palettes = [
        'from-sky-100 via-cyan-50 to-white',
        'from-cyan-100 via-sky-50 to-white',
        'from-blue-100 via-cyan-50 to-white',
        'from-teal-100 via-cyan-50 to-white',
        'from-sky-50 via-blue-50 to-cyan-50',
        'from-cyan-50 via-sky-100 to-white',
        'from-blue-50 via-sky-100 to-cyan-50',
      ];
      const palette = palettes[(productId - 1) % palettes.length];

      // 상품별 SVG 아이콘
      const icons = {
        1: <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="2" className="w-16 h-16"><path d="M8 24c0-4 3-8 8-8h32c5 0 8 4 8 8v8c0 6-4 12-12 12h-4l-8-8-8 8h-4c-8 0-12-6-12-12v-8z"/><circle cx="22" cy="28" r="5"/><circle cx="42" cy="28" r="5"/></svg>,
        2: <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="2" className="w-16 h-16"><path d="M6 26c0-5 4-10 10-10h32c6 0 10 5 10 10v6c0 7-5 13-13 13h-3l-9-9-9 9h-3c-9 0-15-6-15-13v-6z"/><circle cx="22" cy="30" r="6"/><circle cx="42" cy="30" r="6"/></svg>,
        3: <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="2" className="w-16 h-16"><path d="M20 8h24l-4 48H24L20 8z"/><path d="M22 16h20M22 28h20M22 40h20"/></svg>,
        4: <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="2" className="w-16 h-16"><path d="M22 6h20l-2 52H24L22 6z"/><path d="M24 18h16M24 32h16M24 46h16"/></svg>,
        5: <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="2" className="w-16 h-16"><path d="M14 18h36l-2 36H16L14 18z"/><path d="M22 18V12c0-3 4-6 10-6s10 3 10 6v6"/><path d="M20 26l3 22M28 26l3 22M36 26l3 22M44 26l3 22"/></svg>,
        6: <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="2" className="w-16 h-16"><path d="M16 12c0-3 7-6 16-6s16 3 16 6v8c0 4-3 7-7 7h-2v25H25V27h-2c-4 0-7-3-7-7v-8z"/><path d="M27 14c0 3 2 6 5 6s5-3 5-6"/></svg>,
        7: <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="2" className="w-16 h-16"><path d="M22 6c-2 4-6 6-12 8v8c0 6 4 10 4 14v22h36V36c0-4 4-8 4-14v-8c-6-2-10-4-12-8H22z"/><path d="M28 8c0 3 2 6 4 6s4-3 4-6"/><path d="M32 24v22"/></svg>,
        8: <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="2" className="w-16 h-16"><path d="M20 48c0 4 4 8 12 8s12-4 12-8V20c0-8-4-14-12-14S20 12 20 20v4"/><path d="M20 24c-6 0-10-3-10-8s4-8 10-8"/><circle cx="20" cy="24" r="4"/></svg>,
      };

      if (errored) {
        return (
          <div className={`w-full h-56 bg-gradient-to-br ${palette} flex items-center justify-center text-sky-700/50 relative`}>
            {icons[productId] || <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-12 h-12"><circle cx="12" cy="12" r="9"/></svg>}
            <span className="absolute bottom-2 right-3 text-[10px] uppercase tracking-widest text-sky-600/40">APNEA</span>
          </div>
        );
      }
      return (
        <img
          src={src}
          alt={alt}
          className="w-full h-56 object-contain bg-white"
          onError={() => setErrored(true)}
        />
      );
    };

    // ========================================
    // 토스트
    // ========================================
    const Toast = ({ message }) => {
      if (!message) return null;
      return (
        <div className="fixed left-1/2 bottom-10 -translate-x-1/2 z-[60] toast">
          <div className="bg-deep-navy text-white px-5 py-3 rounded-full shadow-xl text-sm flex items-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 13l4 4L19 7"/></svg>
            {message}
          </div>
        </div>
      );
    };

    // ========================================
    // 헤더
    // ========================================
    const Header = ({ user, cartCount, onLoginClick, onLogout, onCartClick, onMyPageClick }) => (
      <header className="sticky top-0 z-40 bg-white/70 backdrop-blur-md border-b border-slate-100">
        <div className="max-w-6xl mx-auto px-6 py-4 grid grid-cols-3 items-center">
          {/* 좌측: 로고 */}
          <div className="flex items-center">
            <a href="#" className="text-2xl font-black tracking-[0.2em] text-deep-navy">APNEA</a>
          </div>

          {/* 중앙: 슬로건 */}
          <div className="hidden md:flex justify-center">
            <span className="italic text-sm text-deep-navy/80">Go Deeper, Stay Longer.</span>
          </div>

          {/* 우측: 장바구니 + 로그인/마이페이지 */}
          <div className="flex items-center justify-end gap-2">
            <button
              onClick={onCartClick}
              aria-label="장바구니"
              className="relative w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-deep-navy transition"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="9" cy="21" r="1"/>
                <circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
              </svg>
              {cartCount > 0 && (
                <span className="absolute -top-0.5 -right-0.5">
                  <Badge>{cartCount}</Badge>
                </span>
              )}
            </button>
            {user ? (
              <div className="flex items-center gap-2">
                <span className="hidden sm:inline text-xs text-slate-500">{user.nickname || user.email}님</span>
                <Button variant="ghost" size="sm" onClick={onMyPageClick}>마이페이지</Button>
                <Button variant="secondary" size="sm" onClick={onLogout}>로그아웃</Button>
              </div>
            ) : (
              <Button variant="primary" size="sm" onClick={onLoginClick}>로그인</Button>
            )}
          </div>
        </div>
      </header>
    );

    // ========================================
    // 히어로 섹션
    // ========================================
    const HeroSection = () => (
      <section className="hero-bg">
        <div className="max-w-6xl mx-auto px-6 py-10 text-center relative z-10">
          <p className="text-xs md:text-sm uppercase tracking-[0.5em] text-sky-700/70 mb-6">Sunlit Ocean Collection</p>
          <h1 className="text-7xl md:text-9xl font-black tracking-[0.15em] text-deep-navy mb-8">
            APNEA
          </h1>
          <p className="italic text-xl md:text-2xl text-deep-navy/90 mb-4">Go Deeper, Stay Longer.</p>
          <p className="text-sm md:text-base text-slate-500 max-w-xl mx-auto leading-relaxed">
            한 호흡으로 닿는 가장 푸른 깊이.<br/>
            APNEA는 프리다이버를 위한 최상의 장비를 선보입니다.
          </p>

          <div className="mt-12 flex items-center justify-center gap-3">
            <a href="#products">
              <Button variant="primary" size="lg">컬렉션 둘러보기</Button>
            </a>
            <a href="#about">
              <Button variant="ghost" size="lg">브랜드 스토리</Button>
            </a>
          </div>
        </div>

        {/* 하단 물결 장식 */}
        <div className="relative h-12 overflow-hidden pointer-events-none">
          <svg className="wave absolute bottom-0 left-0 w-[200%] h-full" viewBox="0 0 1200 60" preserveAspectRatio="none">
            <path d="M0,30 C150,60 350,0 600,30 C850,60 1050,0 1200,30 L1200,60 L0,60 Z" fill="rgba(186,230,253,0.4)"/>
            <path d="M0,40 C150,10 350,50 600,20 C850,10 1050,50 1200,20 L1200,60 L0,60 Z" fill="rgba(207,250,254,0.5)"/>
          </svg>
        </div>
      </section>
    );

    // ========================================
    // 상품 카드
    // ========================================
    const ProductCard = ({ product, onAdd }) => {
      const hasOptions = Array.isArray(product.options) && product.options.length > 0;
      const [selectedOption, setSelectedOption] = useState(null);

      const isLowStock = product.stock != null && product.stock > 0 && product.stock < 5;
      const isSoldOut  = product.stock != null && product.stock === 0;
      const canAdd     = !isSoldOut && (!hasOptions || selectedOption !== null);

      const optionLabel = product.options && product.options.some(o => ['화이트','블랙','레드','블루','옐로우'].includes(o))
        ? '컬러 선택' : '사이즈 선택';

      return (
        <article className="product-card bg-white rounded-3xl overflow-hidden border border-slate-100 flex flex-col">
          <div className="relative">
            <ProductImage src={product.image_url} alt={product.name} productId={product.id} />
            {isSoldOut && (
              <span className="absolute top-3 left-3 bg-slate-700 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-sm">품절</span>
            )}
            {isLowStock && (
              <span className="absolute top-3 left-3 bg-amber-500 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-sm">품절임박</span>
            )}
          </div>
          <div className="p-6 flex flex-col flex-1">
            <h3 className="font-semibold text-deep-navy text-lg leading-snug">{product.name}</h3>
            <p className="mt-2 text-sm text-slate-500 leading-relaxed flex-1">{product.description}</p>
            {hasOptions && (
              <div className="mt-4">
                <p className="text-xs text-slate-500 mb-2">{optionLabel} <span className="text-rose-400">*</span></p>
                <div className="flex flex-wrap gap-1.5">
                  {product.options.map(opt => (
                    <button
                      key={opt}
                      onClick={() => setSelectedOption(opt)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-all duration-150 ${
                        selectedOption === opt
                          ? 'bg-deep-navy text-white border-deep-navy shadow-sm'
                          : 'bg-white text-slate-600 border-slate-200 hover:border-slate-400'
                      }`}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
                {!selectedOption && (
                  <p className="text-xs text-rose-400 mt-1.5">옵션을 선택해주세요</p>
                )}
              </div>
            )}
            <div className="mt-5 flex items-end justify-between gap-3">
              <span className="text-xl font-bold text-deep-navy">{formatKRW(product.price)}</span>
              <Button
                variant="primary" size="sm"
                onClick={() => onAdd(product, selectedOption)}
                disabled={!canAdd}
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                {isSoldOut ? '품절' : (hasOptions && !selectedOption) ? '옵션 선택' : '담기'}
              </Button>
            </div>
          </div>
        </article>
      );
    };

    // ========================================
    // 상품 목록
    // ========================================
    const ProductList = ({ products, onAdd }) => (
      <section id="products" className="max-w-6xl mx-auto px-6 py-20">
        <div className="flex items-end justify-between mb-10">
          <div>
            <p className="text-xs uppercase tracking-[0.4em] text-sky-700/70 mb-2">Collection</p>
            <h2 className="text-3xl md:text-4xl font-bold text-deep-navy">프리다이빙 에센셜</h2>
            <p className="mt-3 text-slate-500">바다가 가장 빛나는 순간, 당신과 함께할 장비.</p>
          </div>
          <span className="hidden md:inline text-sm text-slate-400">{products.length} items</span>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          {products.map(p => (
            <ProductCard key={p.id} product={p} onAdd={onAdd} />
          ))}
        </div>
      </section>
    );

    // ========================================
    // 브랜드 스토리
    // ========================================
    const BrandStory = () => (
      <section id="about" className="max-w-6xl mx-auto px-6 py-20">
        <div className="rounded-3xl overflow-hidden grid grid-cols-1 md:grid-cols-2"
          style={{background: 'linear-gradient(135deg, #e0f2fe 0%, #cffafe 50%, #f0f9ff 100%)'}}>
          {/* 좌측 텍스트 */}
          <div className="px-10 py-14 flex flex-col justify-center">
            <p className="text-xs uppercase tracking-[0.5em] text-sky-700/70 mb-4">Brand Story</p>
            <h2 className="text-3xl md:text-4xl font-bold text-deep-navy leading-tight mb-6">
              햇살이 닿는 푸른 바다,<br/>
              그 안에서의 깊은 호흡.<br/>
              <span className="italic"></span>
            </h2>
            <p className="text-slate-600 leading-relaxed text-sm mb-5">
              APNEA는 바다를 사랑하는 사람들이 만든 브랜드입니다.<br/>
              수면 위 반짝이는 햇살과 그 아래 펼쳐지는 고요한 세계 — 두 세계 사이의 한 호흡이 우리의 시작이었습니다.

    // ========================================
    // 로그인 모달
    // ========================================
    const LoginModal = ({ isOpen, onClose, onLogin, onSwitchToSignup }) => {
      const [email, setEmail] = useState('');
      const [pw, setPw] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (!isOpen) { setEmail(''); setPw(''); setError(''); setLoading(false); }
      }, [isOpen]);

      const submit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password: pw }),
          });
          const data = await res.json();
          if (data.success && data.token && data.user) {
            setToken(data.token);
            onLogin(data.user);
            onClose();
          } else {
            setError(data.message || '로그인에 실패했습니다.');
          }
        } catch (err) {
          setError('네트워크 오류가 발생했습니다.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="로그인">
          <form onSubmit={submit} className="space-y-4">
            <div className="text-center mb-4">
              <p className="text-xs text-slate-500 italic">Welcome back to APNEA</p>
            </div>
            <Input label="이메일" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@apnea.shop" autoFocus required />
            <Input label="비밀번호" type="password" value={pw} onChange={e => setPw(e.target.value)} placeholder="••••••••" required />
            {error && <div className="text-xs text-rose-500 bg-rose-50 px-3 py-2 rounded-lg">{error}</div>}
            <div className="flex gap-2 pt-2">
              <Button type="button" variant="secondary" className="flex-1" onClick={onClose} disabled={loading}>취소</Button>
              <Button type="submit" variant="primary" className="flex-1" disabled={loading}>{loading ? '로그인 중...' : '로그인'}</Button>
            </div>
            <div className="pt-3 text-center text-xs text-slate-500">
              계정이 없으신가요?{' '}
              <button type="button" onClick={onSwitchToSignup} className="text-sky-600 hover:text-sky-700 font-medium underline-offset-2 hover:underline">
                회원가입
              </button>
            </div>
          </form>
        </Modal>
      );
    };

    // ========================================
    // 회원가입 모달
    // ========================================
    const SignupModal = ({ isOpen, onClose, onSignup, onSwitchToLogin }) => {
      const [email, setEmail] = useState('');
      const [nickname, setNickname] = useState('');
      const [pw, setPw] = useState('');
      const [pwConfirm, setPwConfirm] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (!isOpen) {
          setEmail(''); setNickname(''); setPw(''); setPwConfirm('');
          setError(''); setLoading(false);
        }
      }, [isOpen]);

      const submit = async (e) => {
        e.preventDefault();
        setError('');
        if (pw !== pwConfirm) {
          setError('비밀번호가 일치하지 않습니다.');
          return;
        }
        const finalNickname = nickname.trim() || (email.includes('@') ? email.split('@')[0] : '');
        setLoading(true);
        try {
          const res = await fetch(`${API}/auth/signup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password: pw, nickname: finalNickname }),
          });
          const data = await res.json();
          if (data.success && data.token && data.user) {
            setToken(data.token);
            onSignup(data.user);
            onClose();
          } else {
            setError(data.message || '회원가입에 실패했습니다.');
          }
        } catch (err) {
          setError('네트워크 오류가 발생했습니다.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="회원가입">
          <form onSubmit={submit} className="space-y-4">
            <div className="text-center mb-4">
              <p className="text-xs text-slate-500 italic">Join the deep blue with APNEA</p>
            </div>
            <Input label="이메일" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@apnea.shop" autoFocus required />
            <Input label="닉네임 (선택)" type="text" value={nickname} onChange={e => setNickname(e.target.value)} placeholder="비워두면 이메일 앞부분이 사용됩니다" />
            <Input label="비밀번호" type="password" value={pw} onChange={e => setPw(e.target.value)} placeholder="••••••••" required />
            <Input label="비밀번호 확인" type="password" value={pwConfirm} onChange={e => setPwConfirm(e.target.value)} placeholder="••••••••" required />

              <Button type="submit" variant="primary" className="flex-1" disabled={loading}>{loading ? '가입 중...' : '회원가입'}</Button>

            <div className="pt-3 text-center text-xs text-slate-500">
              이미 계정이 있으신가요?{' '}
              <button type="button" onClick={onSwitchToLogin} className="text-sky-600 hover:text-sky-700 font-medium underline-offset-2 hover:underline">
                로그인
              </button>
            </div>
          </form>
        </Modal>
      );
    };

    // ========================================
    // 결제 모달 (TossPayments Widget)
    // 올바른 결제 플로우:
    //  1. 모달 열림 → POST /api/orders (서버가 장바구니 읽어 주문 생성)
    //  2. 서버 응답의 totalPrice로 위젯 금액 설정
    //  3. 결제하기 클릭 → requestPayment(tossOrderId)
    //  4. TossPayments → /success 리다이렉트
    //  5. 서버에서 confirm API 호출 (Secret Key 서버에서만 사용)
    // ========================================
    const PaymentModal = ({ isOpen, onClose, cart, user, showToast }) => {
      const widgetsRef   = useRef(null);
      const renderedRef  = useRef(false);
      const orderRef     = useRef(null); // { tossOrderId, totalPrice, orderName }
      const [step, setStep]   = useState('idle');   // idle | ordering | widget | ready | paying
      const [orderInfo, setOrderInfo] = useState(null);

      // 모달이 닫힐 때 상태 초기화
      useEffect(() => {
        if (isOpen) return;
        widgetsRef.current  = null;
        renderedRef.current = false;
        orderRef.current    = null;
        setStep('idle');
        setOrderInfo(null);
      }, [isOpen]);

      // 모달 열릴 때: 주문 생성 → 위젯 초기화
      useEffect(() => {
        if (!isOpen) return;
        let cancelled = false;

        const init = async () => {
          try {
            // Step 1: 서버에서 주문 생성 (금액은 서버가 DB 기준으로 계산)
            setStep('ordering');
            const res = await fetch(`${API}/orders`, {
              method: 'POST',
              headers: authHeaders(),
            }).then(r => r.json());
            if (!res.success) throw new Error(res.message || '주문 생성 실패');
            if (cancelled) return;

            const { tossOrderId, totalPrice, orderName } = res.data;
            orderRef.current = { tossOrderId, totalPrice, orderName };
            setOrderInfo({ tossOrderId, totalPrice, orderName });

            // Step 2: TossPayments 위젯 초기화 (서버 확정 금액 사용)
            setStep('widget');
            const tossPayments = TossPayments(TOSS_CLIENT_KEY);
            const widgets = tossPayments.widgets({
              customerKey: user?.email || TossPayments.ANONYMOUS,
            });
            widgetsRef.current = widgets;
            await widgets.setAmount({ currency: 'KRW', value: totalPrice });

            if (!renderedRef.current) {
              await widgets.renderPaymentMethods({
                selector: '#toss-payment-method',
                variantKey: 'DEFAULT',
              });
              await widgets.renderAgreement({
                selector: '#toss-agreement',
                variantKey: 'AGREEMENT',
              });
              renderedRef.current = true;
            }
            if (!cancelled) setStep('ready');
          } catch (e) {
            if (!cancelled) {
              console.error('[PaymentModal] init error:', e);
              showToast(e.message || '결제 초기화에 실패했습니다.');
              onClose();
            }
          }
        };

        // DOM이 렌더된 후 실행
        const timer = setTimeout(init, 120);
        return () => { cancelled = true; clearTimeout(timer); };
      }, [isOpen]);

      const handlePay = async () => {
        if (!widgetsRef.current || !orderRef.current || step !== 'ready') return;
        setStep('paying');
        try {
          await widgetsRef.current.requestPayment({
            orderId:      orderRef.current.tossOrderId,
            orderName:    orderRef.current.orderName,
            successUrl:   `${window.location.origin}/success`,
            failUrl:      `${window.location.origin}/fail`,
            customerEmail: user?.email,
            customerName:  user?.nickname || user?.email,
          });
        } catch (e) {
          if (e.code !== 'USER_CANCEL') {
            showToast(e.message || '결제 요청에 실패했습니다.');
          }
          setStep('ready');
        }
      };

      if (!isOpen) return null;

      const clientTotal = cart.reduce((s, it) => s + it.price * it.quantity, 0);
      const displayTotal = orderInfo?.totalPrice ?? clientTotal;
      const isLoading = step === 'ordering' || step === 'widget';
      const isPaying  = step === 'paying';
      const isReady   = step === 'ready';

      return (
        <div className="fixed inset-0 z-50 fade-in overflow-y-auto">
          <div className="absolute inset-0 bg-deep-navy/40 backdrop-blur-sm" onClick={isLoading ? undefined : onClose}/>
          <div className="relative min-h-screen flex items-start justify-center p-4 py-12">
            <div className="w-full max-w-lg bg-white rounded-3xl shadow-2xl slide-up">

              {/* 헤더 */}
              <div className="flex items-center justify-between px-6 py-5 border-b border-slate-100">
                <h3 className="text-lg font-semibold text-deep-navy">결제하기</h3>
                <button
                  onClick={onClose}
                  disabled={isLoading}
                  className="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 disabled:opacity-30"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
              </div>

              {/* 주문 요약 */}
              <div className="px-6 py-4 border-b border-slate-100 bg-sky-50/40">
                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">주문 내역</p>
                <ul className="space-y-2">
                  {cart.map(it => (
                    <li key={it.id} className="flex items-center justify-between text-sm">
                      <span className="text-slate-600">
                        {it.name}
                        {it.variant && <span className="ml-1 text-xs text-sky-600">({it.variant})</span>}
                        {' '}<span className="text-slate-400">× {it.quantity}</span>
                      </span>
                      <span className="font-medium text-deep-navy">{formatKRW(it.price * it.quantity)}</span>
                    </li>
                  ))}
                </ul>
                <div className="flex justify-between items-center mt-4 pt-3 border-t border-slate-200">
                  <span className="text-sm font-semibold text-slate-600">합계</span>
                  <span className="text-xl font-black text-deep-navy">{formatKRW(displayTotal)}</span>
                </div>
              </div>

              {/* TossPayments 위젯 영역 */}
              <div className="px-6 py-4">
                {isLoading && (
                  <div className="flex flex-col items-center justify-center py-10 gap-3 text-slate-400">
                    <svg className="w-6 h-6 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M21 12a9 9 0 1 1-6.219-8.56" strokeLinecap="round"/>
                    </svg>
                    <span className="text-sm">
                      {step === 'ordering' ? '주문 정보 확인 중...' : '결제 위젯 불러오는 중...'}
                    </span>
                  </div>
                )}
                <div id="toss-payment-method"/>
                <div id="toss-agreement"/>
              </div>

              {/* 결제 버튼 */}
              <div className="px-6 pb-6">
                <Button
                  variant="primary" size="lg" className="w-full"
                  onClick={handlePay}
                  disabled={!isReady || isPaying}
                >
                  {isPaying
                    ? <><svg className="w-4 h-4 animate-spin mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56" strokeLinecap="round"/></svg>처리 중...</>
                    : isLoading
                      ? '준비 중...'
                      : `${formatKRW(displayTotal)} 결제하기`
                  }
                </Button>
              </div>

            </div>
          </div>
        </div>
      );
    };

    // ========================================
    // 장바구니 사이드 패널
    // DB: cart(id, user_id, product_id, quantity)
    // ========================================
    const CartPanel = ({ isOpen, onClose, items, onInc, onDec, onRemove, onCheckout, user }) => {
      const total = useMemo(() => items.reduce((sum, it) => sum + it.price * it.quantity, 0), [items]);
      const totalQty = useMemo(() => items.reduce((sum, it) => sum + it.quantity, 0), [items]);

      return (
        <div className="fixed inset-0 z-50">

          <aside className="absolute right-0 top-0 h-full w-full sm:max-w-md bg-white shadow-2xl slide-in-right flex flex-col">
            <div className="flex items-center justify-between px-6 py-5 border-b border-slate-100">
              <div>
                <h3 className="text-lg font-semibold text-deep-navy">내 장바구니</h3>
                <p className="text-xs text-slate-500 mt-0.5">

              </button>
            </div>

            {/* 본문 */}
            <div className="flex-1 overflow-y-auto">
              {!user ? (
                <div className="h-full flex flex-col items-center justify-center text-center px-8 py-16">
                  <div className="w-20 h-20 rounded-full bg-sky-50 flex items-center justify-center mb-5">

    // ========================================
    // 마이페이지 (주문 내역)
    // 권한: JWT authHeaders() 필수 — 서버가 token의 user_id 기준으로만 반환
    // ========================================
    const STATUS_MAP = {
      DONE:    { label: '결제완료', cls: 'bg-emerald-100 text-emerald-700' },
      PENDING: { label: '결제대기', cls: 'bg-amber-100  text-amber-700'   },
      FAILED:  { label: '결제실패', cls: 'bg-rose-100   text-rose-600'    },
    };

    const OrderStatusBadge = ({ status }) => {
      const s = STATUS_MAP[status] || { label: status, cls: 'bg-slate-100 text-slate-600' };
      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${s.cls}`}>
          {s.label}
        </span>
      );
    };

    const fmtDateTime = (iso) => {
      if (!iso) return '-';
      return new Date(iso).toLocaleString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
      });
    };

    const MyPageModal = ({ isOpen, onClose, user }) => {
      const [orders, setOrders]   = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError]     = useState('');

      useEffect(() => {
        if (!isOpen) { setOrders([]); setError(''); return; }
        setLoading(true);
        fetch(`${API}/mypage/orders`, { headers: authHeaders() })
          .then(r => r.json())
          .then(res => {
            if (res.success) setOrders(res.data);
            else setError(res.message || '주문 내역을 불러올 수 없습니다.');
          })
          .catch(() => setError('네트워크 오류가 발생했습니다.'))
          .finally(() => setLoading(false));
      }, [isOpen]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 fade-in">
          <div className="absolute inset-0 bg-deep-navy/30 backdrop-blur-sm" onClick={onClose}/>
          <aside className="absolute right-0 top-0 h-full w-full sm:max-w-xl bg-white shadow-2xl slide-in-right flex flex-col">

            {/* 헤더 */}
            <div className="flex items-center justify-between px-6 py-5 border-b border-slate-100">
              <div>
                <h3 className="text-lg font-semibold text-deep-navy">마이페이지</h3>
                <p className="text-xs text-slate-500 mt-0.5">{user?.nickname || user?.email}님의 주문 내역</p>
              </div>
              <button onClick={onClose} aria-label="닫기" className="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>

            {/* 본문 */}
            <div className="flex-1 overflow-y-auto px-6 py-5 space-y-4">

              {/* 로딩 */}
              {loading && (
                <div className="flex items-center justify-center py-20">
                  <svg className="w-7 h-7 animate-spin text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56" strokeLinecap="round"/>
                  </svg>
                </div>
              )}

              {/* 에러 */}
              {!loading && error && (
                <div className="text-sm text-rose-600 bg-rose-50 px-4 py-3 rounded-xl">{error}</div>
              )}

              {/* 주문 없음 */}
              {!loading && !error && orders.length === 0 && (
                <div className="flex flex-col items-center justify-center py-20 text-center">
                  <div className="w-16 h-16 rounded-full bg-sky-50 flex items-center justify-center mb-4">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0b1f3a" strokeWidth="1.5" strokeLinecap="round">
                      <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                      <rect x="9" y="3" width="6" height="4" rx="1"/>
                      <path d="M9 12h6M9 16h4"/>
                    </svg>
                  </div>
                  <p className="text-deep-navy font-medium">주문 내역이 없습니다</p>
                  <p className="mt-1 text-xs text-slate-500">첫 구매를 시작해보세요.</p>
                </div>
              )}

              {/* 주문 목록 */}
              {!loading && orders.map(order => (
                <div key={order.id} className="border border-slate-100 rounded-2xl overflow-hidden">

                  {/* 주문 헤더 */}
                  <div className="px-4 py-3 bg-slate-50 flex items-start justify-between gap-3">
                    <div className="min-w-0">
                      <p className="text-[10px] uppercase tracking-widest text-slate-400 mb-0.5">주문번호</p>
                      <p className="text-xs font-mono font-medium text-deep-navy truncate">{order.toss_order_id}</p>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <OrderStatusBadge status={order.status} />
                      <p className="text-[11px] text-slate-400 mt-1">
                        {fmtDateTime(order.status === 'DONE' ? order.paid_at : order.created_at)}
                      </p>
                    </div>
                  </div>

                  {/* 상품 목록 */}
                  <div className="px-4 py-3">
                    <ul className="space-y-2">
                      {order.items.map((item, idx) => (
                        <li key={idx} className="flex items-center justify-between text-sm">
                          <span className="text-slate-700 truncate">
                            {item.name}
                            <span className="text-slate-400 ml-1">× {item.quantity}</span>
                          </span>
                          <span className="font-medium text-deep-navy ml-3 flex-shrink-0">
                            {formatKRW(item.price * item.quantity)}
                          </span>
                        </li>
                      ))}
                    </ul>

                    {/* 합계 */}
                    <div className="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
                      <span className="text-xs text-slate-500">주문 금액</span>
                      <span className="text-base font-black text-deep-navy">{formatKRW(order.total_price)}</span>
                    </div>
                  </div>

                </div>
              ))}
            </div>

          </aside>
        </div>
      );
    };

    // ========================================
    // 푸터
    // ========================================
    const Footer = () => (
      <footer className="border-t border-slate-100 bg-white/60 mt-10">
        <div className="max-w-6xl mx-auto px-6 py-12 grid grid-cols-1 md:grid-cols-3 gap-8">
          <div>
            <p className="text-2xl font-black tracking-[0.2em] text-deep-navy">APNEA</p>
            <p className="text-xs text-slate-400 tracking-widest mt-0.5">아프네아</p>
            <p className="mt-3 italic text-sm text-deep-navy/70">Go Deeper, Stay Longer.</p>
            <p className="mt-4 text-xs text-slate-500 leading-relaxed">
              햇살이 닿는 푸른 바다, 그 안에서의 깊은 호흡.<br/>
              APNEA는 프리다이버의 여정에 함께합니다.
            </p>
          </div>
          <div>
            <p className="text-xs uppercase tracking-widest text-slate-400 mb-3">Shop</p>
            <ul className="space-y-2 text-sm text-deep-navy/80">
              <li>마스크 & 스노클</li>
              <li>롱핀 컬렉션</li>
              <li>웻슈트</li>
              <li>액세서리</li>
            </ul>
          </div>
          <div>
            <p className="text-xs uppercase tracking-widest text-slate-400 mb-3">Contact</p>
            <ul className="space-y-2 text-sm text-deep-navy/80">
              <li>고객센터: 평일 10:00 - 18:00</li>
              <li>care@apnea.shop</li>
              <li>인스타그램 @apnea.dive</li>
            </ul>
          </div>
        </div>
        <div className="border-t border-slate-100">
          <div className="max-w-6xl mx-auto px-6 py-5 text-center text-xs text-slate-400">
            (C) 2026 APNEA. All rights reserved. · Sunlit Ocean Collection
          </div>
        </div>
      </footer>
    );

    // ========================================
    // App
    // ========================================
    const App = () => {
      const [user, setUser] = useState(null);
      const [products, setProducts] = useState([]);
      const [cart, setCart] = useState([]); // cart items from API
      const [isLoginOpen, setLoginOpen] = useState(false);
      const [isSignupOpen, setSignupOpen] = useState(false);
      const [isCartOpen, setCartOpen] = useState(false);
      const [isPaymentOpen, setPaymentOpen] = useState(false);
      const [isMyPageOpen, setMyPageOpen] = useState(false);
      const [toast, setToast] = useState('');

      const showToast = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2400);
      }, []);

      // 장바구니 로드 (JWT 토큰 사용)
      const loadCart = useCallback(() => {
        const token = getToken();
        if (!token) return;
        fetch(`${API}/cart`, {
          headers: { Authorization: `Bearer ${token}` },
        })
          .then(r => r.json())
          .then(res => { if (res.success) setCart(res.data); })
          .catch(() => {});
      }, []);

      // 상품 목록 로드
      useEffect(() => {
        fetch(`${API}/products`)
          .then(r => r.json())
          .then(res => { if (res.success) setProducts(res.data); })
          .catch(() => {});
      }, []);

      // 앱 초기 마운트: localStorage 토큰으로 사용자 복원
      useEffect(() => {
        const token = getToken();
        if (!token) return;
        fetch(`${API}/auth/me`, {
          headers: { Authorization: `Bearer ${token}` },
        })
          .then(r => r.json())
          .then(res => {
            if (res.success && res.user) {
              setUser(res.user);
              loadCart();
            } else {
              clearToken();
            }
          })
          .catch(() => { clearToken(); });
      }, [loadCart]);

      const handleLogin = (u) => {
        setUser(u);
        loadCart();
        showToast(`${u.nickname || u.email}님, 환영합니다.`);
      };

      const handleSignup = (u) => {
        setUser(u);
        loadCart();
        showToast(`${u.nickname || u.email}님, 가입을 환영합니다.`);
      };

      const handleLogout = () => {
        clearToken();
        setUser(null);
        setCart([]);
        showToast('로그아웃 되었습니다.');
      };

      // 장바구니 담기 (로그인 필수)
      const handleAdd = async (product, variant = null) => {
        if (!user) { setLoginOpen(true); return; }
        await fetch(`${API}/cart`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ product_id: product.id, quantity: 1, variant }),
        });
        loadCart();
        const label = variant ? `${product.name} (${variant})` : product.name;
        showToast(`'${label}'을(를) 담았습니다.`);
      };

      const handleInc = async (cartItemId) => {
        const item = cart.find(p => p.id === cartItemId);
        if (!item) return;
        await fetch(`${API}/cart/${cartItemId}`, {
          method: 'PATCH',
          headers: authHeaders(),
          body: JSON.stringify({ quantity: item.quantity + 1 }),
        });
        loadCart();
      };

      const handleDec = async (cartItemId) => {
        const item = cart.find(p => p.id === cartItemId);
        if (!item) return;
        await fetch(`${API}/cart/${cartItemId}`, {
          method: 'PATCH',
          headers: authHeaders(),
          body: JSON.stringify({ quantity: item.quantity - 1 }),
        });
        loadCart();
      };

      const handleRemove = async (cartItemId) => {
        await fetch(`${API}/cart/${cartItemId}`, {
          method: 'DELETE',
          headers: authHeaders(),
        });
        loadCart();
      };

      const handleCheckout = () => {
        setCartOpen(false);
        setPaymentOpen(true);
      };

      // 결제 완료 후 처리 (서버가 /?payment=success 로 리다이렉트)
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const status = params.get('payment');
        if (!status) return;
        // URL 파라미터 즉시 제거
        window.history.replaceState({}, '', window.location.pathname);
        if (status === 'success') {
          const name = params.get('orderName') || '주문';
          const amt = params.get('amount');
          setCart([]);
          showToast(`🎉 결제 완료! ${name}${amt ? ' · ' + formatKRW(amt) : ''}`);
        } else {
          const msg = params.get('message') || '결제에 실패했습니다.';
          showToast(msg);
        }
      }, []);

      const cartCount = useMemo(() => cart.reduce((s, p) => s + p.quantity, 0), [cart]);

      return (
        <div className="ocean-bg">
          <Header
            user={user}
            cartCount={cartCount}
            onLoginClick={() => setLoginOpen(true)}
            onLogout={handleLogout}
            onCartClick={() => setCartOpen(true)}
            onMyPageClick={() => setMyPageOpen(true)}
          />
          <main>
            <HeroSection />
            <ProductList products={products} onAdd={handleAdd} />
            <BrandStory />
          </main>
          <Footer />

          <LoginModal
            isOpen={isLoginOpen}
            onClose={() => setLoginOpen(false)}
            onLogin={handleLogin}
            onSwitchToSignup={() => { setLoginOpen(false); setSignupOpen(true); }}
          />
          <SignupModal
            isOpen={isSignupOpen}
            onClose={() => setSignupOpen(false)}
            onSignup={handleSignup}
            onSwitchToLogin={() => { setSignupOpen(false); setLoginOpen(true); }}
          />
          <CartPanel
            isOpen={isCartOpen}
            onClose={() => setCartOpen(false)}
            items={cart}
            user={user}
            onInc={handleInc}
            onDec={handleDec}
            onRemove={handleRemove}
            onCheckout={handleCheckout}
          />
          <PaymentModal
            isOpen={isPaymentOpen}
            onClose={() => setPaymentOpen(false)}
            cart={cart}
            user={user}
            showToast={showToast}
          />
          <MyPageModal
            isOpen={isMyPageOpen}
            onClose={() => setMyPageOpen(false)}
            user={user}
          />
          <Toast message={toast} />
        </div>
      );
    };

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
