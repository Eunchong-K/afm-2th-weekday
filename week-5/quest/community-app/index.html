<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 게시판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .heart-pop { animation: heartPop 0.3s ease-in-out; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.3s ease-out; }

    @keyframes modalFade {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    .modal-fade { animation: modalFade 0.2s ease-out; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

    // ========================================
    // Constants & Helpers
    // ========================================
    const API_BASE_URL = '/api';
    const TOKEN_KEY = 'community_token';

    const CATEGORIES = [
      { key: 'worry',      label: '고민', emoji: '😔', bg: 'bg-blue-100',   text: 'text-blue-700',   border: 'border-blue-200'   },
      { key: 'compliment', label: '칭찬', emoji: '🌸', bg: 'bg-pink-100',   text: 'text-pink-700',   border: 'border-pink-200'   },
      { key: 'cheer',      label: '응원', emoji: '💪', bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-200' },
      { key: 'poll',       label: '투표', emoji: '🗳️', bg: 'bg-purple-100', text: 'text-purple-700', border: 'border-purple-200' },
    ];

    const MAX_CONTENT_LENGTH = 500;
    const MAX_TAGS = 5;
    const MAX_TAG_LENGTH = 10;

    function getCategoryInfo(key) {
      return CATEGORIES.find(c => c.key === key) || CATEGORIES[0];
    }

    function getRelativeTime(timestamp) {
      const date = typeof timestamp === 'number' ? timestamp : new Date(timestamp).getTime();
      const now = Date.now();
      const diff = now - date;
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours   = Math.floor(minutes / 60);
      const days    = Math.floor(hours / 24);

      if (seconds < 60) return '방금 전';
      if (minutes < 60) return `${minutes}분 전`;
      if (hours   < 24) return `${hours}시간 전`;
      if (days    <  7) return `${days}일 전`;
      return new Date(date).toLocaleDateString('ko-KR');
    }

    function getAuthHeaders() {
      const token = localStorage.getItem(TOKEN_KEY);
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    // ========================================
    // API Functions
    // ========================================

    async function apiLogin(email, password) {
      const res = await fetch(`${API_BASE_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return json.data;
    }

    async function apiSignup(email, nickname, password) {
      const res = await fetch(`${API_BASE_URL}/auth/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, nickname, password }),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return json.data;
    }

    async function apiMe() {
      const res = await fetch(`${API_BASE_URL}/auth/me`, { headers: getAuthHeaders() });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return json.data.user;
    }

    async function loadPosts(sort = 'latest', category = '') {
      const params = new URLSearchParams({ sort });
      if (category) params.set('category', category);
      const res = await fetch(`${API_BASE_URL}/posts?${params}`);
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return json.data.map(p => ({ ...p, empathy: p.empathy_count }));
    }

    async function loadPost(id) {
      const res = await fetch(`${API_BASE_URL}/posts/${id}`);
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return { ...json.data, empathy: json.data.empathy_count };
    }

    async function addPost(post) {
      const res = await fetch(`${API_BASE_URL}/posts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
        body: JSON.stringify(post),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return { ...json.data, empathy: json.data.empathy_count ?? 0 };
    }

    async function incrementEmpathy(id) {
      const res = await fetch(`${API_BASE_URL}/posts/${id}/empathy`, { method: 'POST' });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return json.data;
    }

    async function loadReplies(postId) {
      const res = await fetch(`${API_BASE_URL}/posts/${postId}/replies`);
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return json.data;
    }

    async function addReply(postId, content) {
      const res = await fetch(`${API_BASE_URL}/posts/${postId}/replies`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
        body: JSON.stringify({ content }),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return json.data;
    }

    async function updatePost(id, { title, content, tags }) {
      const res = await fetch(`${API_BASE_URL}/posts/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
        body: JSON.stringify({ title, content, tags }),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      return { ...json.data, empathy: json.data.empathy_count ?? 0 };
    }

    async function deletePost(id) {
      const res = await fetch(`${API_BASE_URL}/posts/${id}`, {
        method: 'DELETE',
        headers: getAuthHeaders(),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
    }

    // ========================================
    // 🔐 Auth Context
    // ========================================

    const AuthContext = createContext(null);
    const useAuth = () => useContext(AuthContext);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authModalTab, setAuthModalTab] = useState('login');

      useEffect(() => {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) { setLoading(false); return; }
        apiMe()
          .then(u => setUser(u))
          .catch(() => localStorage.removeItem(TOKEN_KEY))
          .finally(() => setLoading(false));
      }, []);

      const login = useCallback(async (email, password) => {
        const { token, user } = await apiLogin(email, password);
        localStorage.setItem(TOKEN_KEY, token);
        setUser(user);
        return user;
      }, []);

      const signup = useCallback(async (email, nickname, password) => {
        const { token, user } = await apiSignup(email, nickname, password);
        localStorage.setItem(TOKEN_KEY, token);
        setUser(user);
        return user;
      }, []);

      const logout = useCallback(() => {
        localStorage.removeItem(TOKEN_KEY);
        setUser(null);
      }, []);

      const openAuthModal = useCallback((tab = 'login') => {
        setAuthModalTab(tab);
        setAuthModalOpen(true);
      }, []);

      const closeAuthModal = useCallback(() => setAuthModalOpen(false), []);

      const value = useMemo(() => ({
        user, loading, login, signup, logout,
        authModalOpen, authModalTab, openAuthModal, closeAuthModal, setAuthModalTab,
      }), [user, loading, authModalOpen, authModalTab, login, signup, logout, openAuthModal, closeAuthModal]);

      return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Badge({ category, className = '' }) {
      const info = getCategoryInfo(category);
      return (
        <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold ${info.bg} ${info.text} ${className}`}>
          {info.emoji} {info.label}
        </span>
      );
    }

    function PillButton({ selected, onClick, children, className = '' }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={`px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 border-2 ${
            selected
              ? 'bg-gray-800 text-white border-gray-800 shadow-md'
              : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400 hover:text-gray-800'
          } ${className}`}
        >
          {children}
        </button>
      );
    }

    function Button({ variant = 'primary', size = 'md', type = 'button', disabled = false, onClick, children, className = '' }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2';
      const variants = {
        primary:   'bg-gray-800 text-white hover:bg-gray-900 focus:ring-gray-500 disabled:bg-gray-300 disabled:cursor-not-allowed',
        secondary: 'bg-white text-gray-700 border-2 border-gray-200 hover:bg-gray-50 focus:ring-gray-300',
        ghost:     'bg-transparent text-gray-500 hover:bg-gray-100 focus:ring-gray-300',
        danger:    'bg-red-500 text-white hover:bg-red-600 focus:ring-red-400 disabled:bg-red-200',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-5 py-2.5 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 p-5 ${className}`}>
          {children}
        </div>
      );
    }

    function Input({ label, type = 'text', value, onChange, placeholder, error, disabled, autoComplete }) {
      return (
        <div>
          {label && <label className="block text-sm font-semibold text-gray-600 mb-1.5">{label}</label>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            autoComplete={autoComplete}
            className={`w-full px-4 py-2.5 rounded-xl border-2 focus:ring-0 focus:outline-none text-sm text-gray-700 placeholder-gray-300 transition-colors disabled:bg-gray-50 disabled:cursor-not-allowed ${
              error ? 'border-red-300 focus:border-red-400' : 'border-gray-200 focus:border-gray-400'
            }`}
          />
          {error && <p className="mt-1 text-xs text-red-500">{error}</p>}
        </div>
      );
    }

    function Modal({ isOpen, onClose, title, children, size = 'md' }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const widths = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-lg' };
      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40"
          onClick={onClose}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className={`bg-white rounded-2xl shadow-xl w-full ${widths[size]} modal-fade overflow-hidden`}
          >
            {title && (
              <div className="flex items-center justify-between px-5 py-4 border-b border-gray-100">
                <h3 className="text-base font-bold text-gray-800">{title}</h3>
                <button
                  onClick={onClose}
                  className="text-gray-300 hover:text-gray-600 text-xl leading-none"
                  aria-label="닫기"
                >
                  &times;
                </button>
              </div>
            )}
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    // ========================================
    // 🔐 Auth Modal
    // ========================================

    function AuthModal() {
      const { authModalOpen, authModalTab, closeAuthModal, setAuthModalTab, login, signup } = useAuth();

      const [email, setEmail] = useState('');
      const [nickname, setNickname] = useState('');
      const [password, setPassword] = useState('');
      const [passwordConfirm, setPasswordConfirm] = useState('');
      const [error, setError] = useState('');
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        if (authModalOpen) {
          setEmail(''); setNickname(''); setPassword(''); setPasswordConfirm(''); setError('');
        }
      }, [authModalOpen, authModalTab]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');

        if (!email.trim() || !password) {
          setError('이메일과 비밀번호를 입력해주세요');
          return;
        }

        if (authModalTab === 'signup') {
          if (!nickname.trim() || nickname.trim().length < 2) {
            setError('닉네임은 2자 이상이어야 합니다');
            return;
          }
          if (password.length < 4) {
            setError('비밀번호는 4자 이상이어야 합니다');
            return;
          }
          if (password !== passwordConfirm) {
            setError('비밀번호가 일치하지 않습니다');
            return;
          }
        }

        setSubmitting(true);
        try {
          if (authModalTab === 'login') {
            await login(email.trim(), password);
          } else {
            await signup(email.trim(), nickname.trim(), password);
          }
          closeAuthModal();
        } catch (err) {
          setError(err.message || '오류가 발생했습니다');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <Modal
          isOpen={authModalOpen}
          onClose={closeAuthModal}
          title={authModalTab === 'login' ? '로그인' : '회원가입'}
          size="sm"
        >
          {/* Tabs */}
          <div className="flex bg-gray-100 rounded-xl p-1 mb-5">
            <button
              type="button"
              onClick={() => setAuthModalTab('login')}
              className={`flex-1 py-2 rounded-lg text-sm font-semibold transition-all ${
                authModalTab === 'login' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-400'
              }`}
            >
              로그인
            </button>
            <button
              type="button"
              onClick={() => setAuthModalTab('signup')}
              className={`flex-1 py-2 rounded-lg text-sm font-semibold transition-all ${
                authModalTab === 'signup' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-400'
              }`}
            >
              회원가입
            </button>
          </div>

          <form onSubmit={handleSubmit} className="space-y-3">
            <Input
              label="이메일"
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="you@example.com"
              autoComplete="email"
              disabled={submitting}
            />

            {authModalTab === 'signup' && (
              <Input
                label="닉네임"
                value={nickname}
                onChange={(e) => setNickname(e.target.value)}
                placeholder="2~20자 사이로 입력해주세요"
                disabled={submitting}
              />
            )}

            <Input
              label="비밀번호"
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder={authModalTab === 'signup' ? '4자 이상' : '비밀번호'}
              autoComplete={authModalTab === 'signup' ? 'new-password' : 'current-password'}
              disabled={submitting}
            />

            {authModalTab === 'signup' && (
              <Input
                label="비밀번호 확인"
                type="password"
                value={passwordConfirm}
                onChange={(e) => setPasswordConfirm(e.target.value)}
                placeholder="비밀번호 재입력"
                autoComplete="new-password"
                disabled={submitting}
              />
            )}

            {error && (
              <div className="px-3 py-2 bg-red-50 border border-red-100 rounded-lg text-xs text-red-600">
                {error}
              </div>
            )}

            <Button
              type="submit"
              variant="primary"
              size="lg"
              disabled={submitting}
              className="w-full"
            >
              {submitting
                ? '처리 중...'
                : authModalTab === 'login' ? '로그인' : '가입하고 시작하기'}
            </Button>

            <p className="text-center text-xs text-gray-400 pt-1">
              {authModalTab === 'login' ? (
                <>
                  아직 계정이 없으신가요?{' '}
                  <button
                    type="button"
                    onClick={() => setAuthModalTab('signup')}
                    className="text-gray-700 font-semibold hover:underline"
                  >
                    회원가입
                  </button>
                </>
              ) : (
                <>
                  이미 계정이 있으신가요?{' '}
                  <button
                    type="button"
                    onClick={() => setAuthModalTab('login')}
                    className="text-gray-700 font-semibold hover:underline"
                  >
                    로그인
                  </button>
                </>
              )}
            </p>
          </form>
        </Modal>
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================

    function Header() {
      const { user, logout, openAuthModal } = useAuth();

      return (
        <header className="flex items-center justify-between pt-6 pb-4">
          <div className="flex items-center gap-2">
            <span className="text-2xl">💬</span>
            <div>
              <h1 className="text-lg sm:text-xl font-bold text-gray-800 tracking-tight leading-tight">
                커뮤니티 게시판
              </h1>
              <p className="text-gray-400 text-xs">고민, 칭찬, 응원을 함께 나눠요</p>
            </div>
          </div>

          <div className="flex items-center gap-2">
            {user ? (
              <>
                <span className="hidden sm:inline text-sm text-gray-600">
                  <span className="font-semibold text-gray-800">{user.nickname}</span>님 안녕하세요
                </span>
                <span className="sm:hidden text-sm font-semibold text-gray-800">
                  {user.nickname}님
                </span>
                <Button variant="secondary" size="sm" onClick={logout}>
                  로그아웃
                </Button>
              </>
            ) : (
              <>
                <Button variant="ghost" size="sm" onClick={() => openAuthModal('login')}>
                  로그인
                </Button>
                <Button variant="primary" size="sm" onClick={() => openAuthModal('signup')}>
                  회원가입
                </Button>
              </>
            )}
          </div>
        </header>
      );
    }

    function EmpathyButton({ count, onClick }) {
      const [animating, setAnimating] = useState(false);
      const handleClick = () => {
        setAnimating(true);
        onClick();
        setTimeout(() => setAnimating(false), 300);
      };
      return (
        <button
          onClick={handleClick}
          className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm transition-all duration-200 text-gray-400 hover:text-red-500 hover:bg-red-50 active:scale-95"
          aria-label={`공감 ${count}개`}
        >
          <span className={animating ? 'heart-pop' : ''}>❤️</span>
          <span className="font-medium text-gray-500">{count}</span>
        </button>
      );
    }

    function EmptyState() {
      return (
        <div className="text-center py-16">
          <div className="text-5xl mb-4">📝</div>
          <p className="text-gray-400 text-lg font-medium">아직 게시글이 없어요</p>
          <p className="text-gray-300 text-sm mt-1">첫 번째 글을 작성해보세요!</p>
        </div>
      );
    }

    function AuthorBadge({ nickname }) {
      return (
        <span className="text-xs text-gray-500 font-medium">
          <span className="text-gray-700 font-semibold">{nickname}</span>님
        </span>
      );
    }

    // ========================================
    // Emoji Picker
    // ========================================

    function EmojiPicker({ onSelect, onClose }) {
      const EMOJIS = ['😊','😂','🥹','😍','🥰','😅','😭','😤','🤔','😶',
                      '❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','💯',
                      '👍','👎','👏','🙌','🤝','🫶','💪','🙏','🤗','😮',
                      '🔥','✨','🌟','💫','🎉','🎊','🌈','🌸','🍀','😎'];
      const ref = useRef(null);

      useEffect(() => {
        function handleClick(e) {
          if (ref.current && !ref.current.contains(e.target)) onClose();
        }
        document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, [onClose]);

      return (
        <div ref={ref} className="absolute bottom-full mb-1 left-0 z-10 bg-white border border-gray-200 rounded-xl shadow-lg p-2 w-52">
          <div className="grid grid-cols-8 gap-0.5">
            {EMOJIS.map(emoji => (
              <button
                key={emoji}
                type="button"
                onClick={() => onSelect(emoji)}
                className="text-lg hover:bg-gray-100 rounded p-0.5 transition-colors leading-none"
              >
                {emoji}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Post Form (로그인 상태에 따라 다름)
    // ========================================

    function PostForm({ onSubmit }) {
      const { user, openAuthModal } = useAuth();
      const [category, setCategory] = useState('');
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [tags, setTags] = useState([]);
      const [tagInput, setTagInput] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState('');
      const textareaRef = useRef(null);

      const isValid = category && title.trim().length > 0 && content.trim().length > 0;
      const charCount = content.length;

      if (!user) {
        return (
          <Card className="mb-6 text-center">
            <div className="py-6">
              <div className="text-4xl mb-3">🔒</div>
              <p className="text-gray-700 font-semibold mb-1">로그인하고 이야기를 나눠보세요</p>
              <p className="text-gray-400 text-sm mb-5">
                로그인 후 글을 작성할 수 있어요
              </p>
              <div className="flex justify-center gap-2">
                <Button variant="primary" size="md" onClick={() => openAuthModal('login')}>
                  로그인
                </Button>
                <Button variant="secondary" size="md" onClick={() => openAuthModal('signup')}>
                  회원가입
                </Button>
              </div>
            </div>
          </Card>
        );
      }

      const handleAddTag = () => {
        const trimmed = tagInput.trim();
        if (!trimmed || tags.length >= MAX_TAGS || trimmed.length > MAX_TAG_LENGTH || tags.includes(trimmed)) return;
        setTags(prev => [...prev, trimmed]);
        setTagInput('');
      };

      const handleTagKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleAddTag();
        }
      };

      const handleRemoveTag = (tagToRemove) => {
        setTags(prev => prev.filter(t => t !== tagToRemove));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!isValid || submitting) return;

        setSubmitting(true);
        setError('');
        try {
          await onSubmit({ category, title: title.trim(), content: content.trim(), tags });
          setCategory('');
          setTitle('');
          setContent('');
          setTags([]);
          setTagInput('');
          if (textareaRef.current) textareaRef.current.focus();
        } catch (err) {
          setError(err.message || '글 작성에 실패했어요');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <Card className="mb-6">
          <form onSubmit={handleSubmit}>
            <div className="flex items-center justify-between mb-4">
              <span className="text-sm text-gray-500">
                <span className="font-semibold text-gray-800">{user.nickname}</span>님, 오늘은 어떤 이야기를 남겨볼까요?
              </span>
            </div>

            <div className="mb-4">
              <label htmlFor="post-title" className="block text-sm font-semibold text-gray-600 mb-2">제목</label>
              <input
                id="post-title"
                type="text"
                value={title}
                onChange={(e) => { if (e.target.value.length <= 100) setTitle(e.target.value); }}
                placeholder="제목을 입력해주세요 (최대 100자)"
                className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gray-400 focus:ring-0 focus:outline-none text-gray-700 placeholder-gray-300 transition-colors text-sm"
              />
            </div>

            <div className="mb-4">
              <label className="block text-sm font-semibold text-gray-600 mb-2.5">카테고리 선택</label>
              <div className="flex flex-wrap gap-2">
                {CATEGORIES.map(cat => (
                  <PillButton
                    key={cat.key}
                    selected={category === cat.key}
                    onClick={() => setCategory(cat.key)}
                  >
                    {cat.emoji} {cat.label}
                  </PillButton>
                ))}
              </div>
            </div>

            <div className="mb-4">
              <label htmlFor="post-content" className="block text-sm font-semibold text-gray-600 mb-2">내용</label>
              <textarea
                ref={textareaRef}
                id="post-content"
                value={content}
                onChange={(e) => {
                  if (e.target.value.length <= MAX_CONTENT_LENGTH) setContent(e.target.value);
                }}
                placeholder="자유롭게 이야기를 나눠보세요..."
                rows={4}
                className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gray-400 focus:ring-0 focus:outline-none resize-none text-gray-700 placeholder-gray-300 transition-colors text-sm"
              />
              <div className="flex justify-end mt-1">
                <span className={`text-xs ${charCount > MAX_CONTENT_LENGTH * 0.9 ? 'text-red-400 font-semibold' : 'text-gray-300'}`}>
                  {charCount}/{MAX_CONTENT_LENGTH}
                </span>
              </div>
            </div>

            <div className="mb-4">
              <label className="block text-sm font-semibold text-gray-600 mb-2">태그 (최대 {MAX_TAGS}개)</label>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={tagInput}
                  onChange={(e) => {
                    if (e.target.value.length <= MAX_TAG_LENGTH) setTagInput(e.target.value);
                  }}
                  onKeyDown={handleTagKeyDown}
                  placeholder="키워드 입력 후 Enter"
                  disabled={tags.length >= MAX_TAGS}
                  className="flex-1 px-3 py-2 rounded-lg border-2 border-gray-200 focus:border-gray-400 focus:ring-0 focus:outline-none text-sm text-gray-700 placeholder-gray-300 transition-colors disabled:bg-gray-50 disabled:cursor-not-allowed"
                />
                <Button
                  variant="secondary"
                  size="sm"
                  disabled={!tagInput.trim() || tags.length >= MAX_TAGS}
                  onClick={handleAddTag}
                >
                  + 태그 추가
                </Button>
              </div>
              {tags.length > 0 && (
                <div className="flex flex-wrap gap-1.5 mt-2.5">
                  {tags.map(tag => (
                    <span
                      key={tag}
                      className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 text-xs font-medium"
                    >
                      #{tag}
                      <button
                        type="button"
                        onClick={() => handleRemoveTag(tag)}
                        className="text-gray-400 hover:text-gray-600 ml-0.5 leading-none"
                        aria-label={`${tag} 태그 삭제`}
                      >
                        &times;
                      </button>
                    </span>
                  ))}
                </div>
              )}
            </div>

            {error && (
              <div className="mb-3 px-3 py-2 bg-red-50 border border-red-100 rounded-lg text-xs text-red-600">
                {error}
              </div>
            )}

            <Button
              type="submit"
              variant="primary"
              size="lg"
              disabled={!isValid || submitting}
              className="w-full"
            >
              {submitting ? '올리는 중...' : '게시글 올리기'}
            </Button>
          </form>
        </Card>
      );
    }

    // ========================================
    // 📄 Reply Section
    // ========================================

    function ReplySection({ postId, onReplyAdded }) {
      const { user, openAuthModal } = useAuth();
      const [replies, setReplies] = useState([]);
      const [loadingReplies, setLoadingReplies] = useState(true);
      const [replyContent, setReplyContent] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [showEmojiPicker, setShowEmojiPicker] = useState(false);

      useEffect(() => {
        setLoadingReplies(true);
        loadReplies(postId)
          .then(data => setReplies(data))
          .catch(() => setReplies([]))
          .finally(() => setLoadingReplies(false));
      }, [postId]);

      const handleSubmit = async () => {
        if (!user) {
          openAuthModal('login');
          return;
        }
        const trimmed = replyContent.trim();
        if (!trimmed || submitting) return;
        setSubmitting(true);
        try {
          const newReply = await addReply(postId, trimmed);
          setReplies(prev => [...prev, newReply]);
          setReplyContent('');
          if (onReplyAdded) onReplyAdded();
        } catch (err) {
          alert(err.message || '답글 작성에 실패했어요');
        } finally {
          setSubmitting(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSubmit();
        }
      };

      const handleEmojiSelect = (emoji) => {
        setReplyContent(prev => prev + emoji);
        setShowEmojiPicker(false);
      };

      return (
        <div className="mt-3 pt-3 border-t border-gray-100">
          {loadingReplies ? (
            <div className="text-center py-3">
              <span className="text-xs text-gray-400">답글 불러오는 중...</span>
            </div>
          ) : replies.length > 0 ? (
            <div className="space-y-2.5 mb-3">
              {replies.map(reply => (
                <div key={reply.id} className="bg-gray-50 rounded-lg px-3 py-2.5">
                  <div className="flex items-center gap-2 mb-1">
                    <AuthorBadge nickname={reply.nickname} />
                    <span className="text-xs text-gray-300">
                      {getRelativeTime(reply.created_at || reply.createdAt)}
                    </span>
                  </div>
                  <p className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{reply.content}</p>
                </div>
              ))}
            </div>
          ) : null}
          <div className="relative">
            <div className="flex gap-2">
              <div className="flex-1 relative flex items-center">
                <input
                  type="text"
                  value={replyContent}
                  onChange={(e) => setReplyContent(e.target.value)}
                  onKeyDown={handleKeyDown}
                  placeholder={user ? '답글을 남겨보세요...' : '로그인 후 답글을 남길 수 있어요'}
                  className="w-full px-3 py-2 pr-10 rounded-lg border border-gray-200 focus:border-gray-400 focus:ring-0 focus:outline-none text-sm text-gray-700 placeholder-gray-300 transition-colors"
                />
                <div className="absolute right-1">
                  <button
                    type="button"
                    onClick={() => setShowEmojiPicker(prev => !prev)}
                    className="p-1.5 rounded-md text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors text-sm leading-none"
                    aria-label="이모지 선택"
                  >
                    😊
                  </button>
                </div>
                {showEmojiPicker && (
                  <EmojiPicker onSelect={handleEmojiSelect} onClose={() => setShowEmojiPicker(false)} />
                )}
              </div>
              <Button
                variant="primary"
                size="sm"
                disabled={user && (!replyContent.trim() || submitting)}
                onClick={handleSubmit}
              >
                {submitting ? '...' : user ? '답글 달기' : '로그인'}
              </Button>
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Kebab Menu
    // ========================================

    function KebabMenu({ onEdit, onDelete }) {
      const [open, setOpen] = useState(false);
      const menuRef = useRef(null);

      useEffect(() => {
        if (!open) return;
        function handleClick(e) {
          if (menuRef.current && !menuRef.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, [open]);

      return (
        <div className="relative" ref={menuRef}>
          <button
            onClick={() => setOpen(prev => !prev)}
            className="text-gray-400 hover:text-gray-600 p-1 rounded-md hover:bg-gray-100 transition-colors leading-none text-lg"
            aria-label="게시글 메뉴"
          >
            &#x22EF;
          </button>
          {open && (
            <div className="absolute right-0 top-full mt-1 bg-white border border-gray-100 rounded-lg shadow-md z-10 min-w-[120px] py-1">
              <button
                onClick={() => { setOpen(false); onEdit(); }}
                className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors"
              >
                ✏️ 수정
              </button>
              <button
                onClick={() => { setOpen(false); onDelete(); }}
                className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors"
              >
                🗑️ 삭제
              </button>
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // 📋 Post List Row (목록 뷰 행)
    // ========================================

    function PostListRow({ post, onClick }) {
      const displayTime = post.updated_at
        ? `${getRelativeTime(post.updated_at)} (수정됨)`
        : getRelativeTime(post.created_at || post.createdAt);

      return (
        <div
          onClick={onClick}
          className="flex items-center gap-3 px-4 py-3.5 bg-white border-b border-gray-100 hover:bg-gray-50 cursor-pointer transition-colors"
        >
          <Badge category={post.category} className="flex-shrink-0" />
          <div className="flex-1 min-w-0">
            <p className="text-sm font-semibold text-gray-800 truncate">
              {post.title || '(제목 없음)'}
            </p>
            <div className="flex items-center gap-2 mt-0.5">
              <span className="text-xs text-gray-500 font-medium">{post.nickname}님</span>
              <span className="text-xs text-gray-300">·</span>
              <span className="text-xs text-gray-400">{displayTime}</span>
            </div>
          </div>
          <div className="flex items-center gap-3 flex-shrink-0 text-xs text-gray-400">
            <span className="flex items-center gap-0.5">
              <span>❤️</span>
              <span>{post.empathy || 0}</span>
            </span>
            <span className="flex items-center gap-0.5">
              <span>💬</span>
              <span>{post.reply_count || 0}</span>
            </span>
          </div>
        </div>
      );
    }

    // ========================================
    // 📋 Post List View (목록 전체)
    // ========================================

    function PostListView({ posts, sortMode, onSortChange, onPostClick }) {
      return (
        <div>
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-semibold text-gray-500">전체 {posts.length}개</h2>
            <div className="flex bg-gray-100 rounded-lg p-0.5">
              <button
                onClick={() => onSortChange('latest')}
                className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all ${
                  sortMode === 'latest' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                최신순
              </button>
              <button
                onClick={() => onSortChange('empathy')}
                className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all ${
                  sortMode === 'empathy' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-400 hover:text-gray-600'
                }`}
              >
                공감순
              </button>
            </div>
          </div>

          {posts.length === 0 ? (
            <EmptyState />
          ) : (
            <div className="rounded-2xl overflow-hidden border border-gray-100 shadow-sm">
              {posts.map(post => (
                <PostListRow key={post.id} post={post} onClick={() => onPostClick(post.id)} />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // 📄 Post Detail View (상세 뷰)
    // ========================================

    function PostDetailView({ postId, onBack, onDelete, onUpdate, onEmpathy }) {
      const { user } = useAuth();
      const [post, setPost] = useState(null);
      const [loading, setLoading] = useState(true);
      const [mode, setMode] = useState('view'); // 'view' | 'edit' | 'confirmDelete'
      const [editTitle, setEditTitle] = useState('');
      const [editContent, setEditContent] = useState('');
      const [editTags, setEditTags] = useState([]);
      const [editTagInput, setEditTagInput] = useState('');
      const [saving, setSaving] = useState(false);
      const [deleting, setDeleting] = useState(false);
      const [replyCount, setReplyCount] = useState(0);

      useEffect(() => {
        setLoading(true);
        loadPost(postId)
          .then(p => {
            setPost(p);
            setReplyCount(p.reply_count || 0);
          })
          .catch(() => setPost(null))
          .finally(() => setLoading(false));
      }, [postId]);

      const isOwner = user && post && post.user_id === user.id;

      const handleStartEdit = () => {
        setEditTitle(post.title || '');
        setEditContent(post.content);
        setEditTags([...(post.tags || [])]);
        setEditTagInput('');
        setMode('edit');
      };

      const handleSaveEdit = async () => {
        if (!editTitle.trim() || !editContent.trim() || saving) return;
        setSaving(true);
        try {
          const updated = await updatePost(post.id, { title: editTitle.trim(), content: editContent.trim(), tags: editTags });
          setPost(prev => ({ ...prev, ...updated }));
          onUpdate(updated);
          setMode('view');
        } catch (err) {
          alert(err.message || '수정에 실패했어요');
        } finally {
          setSaving(false);
        }
      };

      const handleConfirmDelete = async () => {
        if (deleting) return;
        setDeleting(true);
        try {
          await deletePost(post.id);
          onDelete(post.id);
          onBack();
        } catch (err) {
          alert(err.message || '삭제에 실패했어요');
          setDeleting(false);
        }
      };

      const handleAddEditTag = () => {
        const trimmed = editTagInput.trim();
        if (!trimmed || editTags.length >= MAX_TAGS || trimmed.length > MAX_TAG_LENGTH || editTags.includes(trimmed)) return;
        setEditTags(prev => [...prev, trimmed]);
        setEditTagInput('');
      };

      const handleEmpathyClick = async () => {
        setPost(prev => ({ ...prev, empathy: prev.empathy + 1 }));
        try {
          await incrementEmpathy(post.id);
          onEmpathy(post.id);
        } catch {
          setPost(prev => ({ ...prev, empathy: prev.empathy - 1 }));
        }
      };

      if (loading) {
        return (
          <div className="text-center py-16 text-gray-300 text-sm">불러오는 중...</div>
        );
      }

      if (!post) {
        return (
          <div className="text-center py-16">
            <p className="text-gray-400">게시글을 찾을 수 없어요</p>
            <Button variant="secondary" size="sm" onClick={onBack} className="mt-4">← 목록으로</Button>
          </div>
        );
      }

      const displayTime = post.updated_at
        ? `${getRelativeTime(post.updated_at)} (수정됨)`
        : getRelativeTime(post.created_at);

      return (
        <div className="fade-in-up">
          <button
            onClick={onBack}
            className="flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-700 transition-colors mb-4"
          >
            ← 목록으로
          </button>

          <Card className="mb-4">
            {mode === 'edit' ? (
              <div>
                <div className="mb-3">
                  <label className="block text-xs font-semibold text-gray-500 mb-1.5">제목</label>
                  <input
                    type="text"
                    value={editTitle}
                    onChange={(e) => { if (e.target.value.length <= 100) setEditTitle(e.target.value); }}
                    className="w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 focus:border-gray-400 focus:ring-0 focus:outline-none text-gray-700 text-sm"
                  />
                </div>
                <div className="mb-3">
                  <label className="block text-xs font-semibold text-gray-500 mb-1.5">내용</label>
                  <textarea
                    value={editContent}
                    onChange={(e) => { if (e.target.value.length <= MAX_CONTENT_LENGTH) setEditContent(e.target.value); }}
                    rows={6}
                    className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-gray-400 focus:ring-0 focus:outline-none resize-none text-gray-700 text-sm"
                  />
                  <div className="flex justify-end mt-1">
                    <span className={`text-xs ${editContent.length > MAX_CONTENT_LENGTH * 0.9 ? 'text-red-400 font-semibold' : 'text-gray-300'}`}>
                      {editContent.length}/{MAX_CONTENT_LENGTH}
                    </span>
                  </div>
                </div>
                <div className="mb-4">
                  <label className="block text-xs font-semibold text-gray-500 mb-1.5">태그 (최대 {MAX_TAGS}개)</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={editTagInput}
                      onChange={(e) => { if (e.target.value.length <= MAX_TAG_LENGTH) setEditTagInput(e.target.value); }}
                      onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handleAddEditTag(); } }}
                      placeholder="태그 입력 후 Enter"
                      disabled={editTags.length >= MAX_TAGS}
                      className="flex-1 px-3 py-2 rounded-lg border-2 border-gray-200 focus:border-gray-400 focus:ring-0 focus:outline-none text-sm text-gray-700 placeholder-gray-300 transition-colors disabled:bg-gray-50"
                    />
                    <Button variant="secondary" size="sm" onClick={handleAddEditTag} disabled={!editTagInput.trim() || editTags.length >= MAX_TAGS}>
                      + 추가
                    </Button>
                  </div>
                  {editTags.length > 0 && (
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      {editTags.map(tag => (
                        <span key={tag} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 text-xs font-medium">
                          #{tag}
                          <button type="button" onClick={() => setEditTags(prev => prev.filter(t => t !== tag))} className="text-gray-400 hover:text-gray-600 ml-0.5">&times;</button>
                        </span>
                      ))}
                    </div>
                  )}
                </div>
                <div className="flex justify-end gap-2">
                  <Button variant="secondary" size="sm" onClick={() => setMode('view')} disabled={saving}>취소</Button>
                  <Button variant="primary" size="sm" onClick={handleSaveEdit} disabled={!editTitle.trim() || !editContent.trim() || saving}>
                    {saving ? '저장 중...' : '저장'}
                  </Button>
                </div>
              </div>
            ) : (
              <>
                <div className="flex items-start justify-between mb-3">
                  <div className="flex items-center gap-2 flex-wrap">
                    <Badge category={post.category} />
                    <AuthorBadge nickname={post.nickname} />
                  </div>
                  {isOwner && (
                    <KebabMenu
                      onEdit={handleStartEdit}
                      onDelete={() => setMode('confirmDelete')}
                    />
                  )}
                </div>

                <h2 className="text-lg font-bold text-gray-800 mb-1 leading-snug">
                  {post.title || '(제목 없음)'}
                </h2>
                <p className="text-xs text-gray-400 mb-4">{displayTime}</p>

                <p className="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap mb-4">
                  {post.content}
                </p>

                {post.tags && post.tags.length > 0 && (
                  <div className="flex flex-wrap gap-1.5 mb-4">
                    {post.tags.map(tag => (
                      <span key={tag} className="inline-block px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 text-xs">
                        #{tag}
                      </span>
                    ))}
                  </div>
                )}

                {mode === 'confirmDelete' && (
                  <div className="flex items-center gap-3 mb-4 p-3 bg-red-50 rounded-lg border border-red-100">
                    <span className="text-sm text-red-600 font-medium">정말 삭제할까요?</span>
                    <div className="flex gap-2 ml-auto">
                      <button onClick={() => setMode('view')} disabled={deleting} className="px-3 py-1.5 text-sm rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-50">취소</button>
                      <button onClick={handleConfirmDelete} disabled={deleting} className="px-3 py-1.5 text-sm rounded-lg bg-red-500 text-white hover:bg-red-600 disabled:opacity-50">
                        {deleting ? '삭제 중...' : '삭제'}
                      </button>
                    </div>
                  </div>
                )}

                <div className="flex items-center justify-end">
                  <EmpathyButton count={post.empathy} onClick={handleEmpathyClick} />
                </div>
              </>
            )}
          </Card>

          <Card>
            <h3 className="text-sm font-semibold text-gray-600 mb-3">
              💬 답글 {replyCount}개
            </h3>
            <ReplySection postId={post.id} onReplyAdded={() => setReplyCount(prev => prev + 1)} />
          </Card>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function CommunityApp() {
      const { loading: authLoading } = useAuth();
      const [posts, setPosts] = useState([]);
      const [sortMode, setSortMode] = useState('latest');
      const [categoryFilter, setCategoryFilter] = useState('');
      const [loading, setLoading] = useState(true);
      const [serverError, setServerError] = useState('');
      const [selectedPostId, setSelectedPostId] = useState(null); // null = 목록, string = 상세

      useEffect(() => {
        if (selectedPostId) return; // 상세 뷰일 때는 목록 재로드 안 함
        setLoading(true);
        setServerError('');
        loadPosts(sortMode, categoryFilter)
          .then(data => setPosts(data))
          .catch(err => {
            setPosts([]);
            setServerError(err.message || '서버에 연결할 수 없어요');
          })
          .finally(() => setLoading(false));
      }, [sortMode, categoryFilter, selectedPostId]);

      const handleAddPost = useCallback(async (postData) => {
        const newPost = await addPost(postData);
        setPosts(prev => [newPost, ...prev]);
      }, []);

      const handleDeletePost = useCallback((id) => {
        setPosts(prev => prev.filter(p => p.id !== id));
      }, []);

      const handleUpdatePost = useCallback((updated) => {
        setPosts(prev => prev.map(p => p.id === updated.id ? { ...p, ...updated } : p));
      }, []);

      const handleEmpathy = useCallback((id) => {
        setPosts(prev =>
          prev.map(p => p.id === id ? { ...p, empathy: (p.empathy || 0) + 1 } : p)
        );
      }, []);

      if (authLoading) {
        return (
          <div className="flex items-center justify-center min-h-screen">
            <div className="text-gray-300 text-lg">불러오는 중...</div>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto px-4 pb-12">
          <Header />

          {selectedPostId ? (
            // ── 상세 뷰 ──
            <PostDetailView
              postId={selectedPostId}
              onBack={() => setSelectedPostId(null)}
              onDelete={handleDeletePost}
              onUpdate={handleUpdatePost}
              onEmpathy={handleEmpathy}
            />
          ) : (
            // ── 목록 뷰 ──
            <>
              {serverError && (
                <div className="mb-4 px-4 py-3 bg-yellow-50 border border-yellow-200 rounded-xl text-sm text-yellow-700">
                  {serverError}
                </div>
              )}

              <PostForm onSubmit={handleAddPost} />

              <div className="flex flex-wrap gap-2 mb-4">
                <PillButton selected={categoryFilter === ''} onClick={() => setCategoryFilter('')}>전체</PillButton>
                {CATEGORIES.map(cat => (
                  <PillButton
                    key={cat.key}
                    selected={categoryFilter === cat.key}
                    onClick={() => setCategoryFilter(cat.key)}
                  >
                    {cat.emoji} {cat.label}
                  </PillButton>
                ))}
              </div>

              {loading ? (
                <div className="text-center py-10 text-gray-300 text-sm">게시글 불러오는 중...</div>
              ) : (
                <PostListView
                  posts={posts}
                  sortMode={sortMode}
                  onSortChange={setSortMode}
                  onPostClick={(id) => setSelectedPostId(id)}
                />
              )}
            </>
          )}
        </div>
      );
    }

    function App() {
      return (
        <AuthProvider>
          <CommunityApp />
          <AuthModal />
        </AuthProvider>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
