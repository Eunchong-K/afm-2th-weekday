<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ========================================
    // API helper
    // ========================================
    async function api(method, path, body) {
      const token = localStorage.getItem('todo_token');
      const res = await fetch(path, {
        method,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        ...(body ? { body: JSON.stringify(body) } : {}),
      });
      return res.json();
    }

    // ========================================
    // AuthPage (로그인 / 회원가입)
    // ========================================
    function AuthPage({ onLogin }) {
      const [mode, setMode]       = useState('login'); // 'login' | 'register'
      const [email, setEmail]     = useState('');
      const [password, setPassword] = useState('');
      const [nickname, setNickname] = useState('');
      const [error, setError]     = useState('');
      const [loading, setLoading] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const data = mode === 'login'
            ? await api('POST', '/api/auth/login',    { email, password })
            : await api('POST', '/api/auth/register', { email, password, nickname });

          if (!data.success) { setError(data.message); return; }
          localStorage.setItem('todo_token', data.token);
          onLogin(data.user);
        } catch {
          setError('서버와 연결할 수 없습니다');
        } finally {
          setLoading(false);
        }
      };

      const switchMode = () => {
        setMode(m => m === 'login' ? 'register' : 'login');
        setError('');
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4">
          <div className="w-full max-w-sm">
            <h1 className="text-3xl font-light text-gray-800 text-center mb-2 tracking-tight">Todo</h1>
            <p className="text-center text-gray-400 text-sm mb-8">
              {mode === 'login' ? '계정에 로그인하세요' : '새 계정을 만드세요'}
            </p>

            <form onSubmit={submit} className="bg-white border border-gray-100 rounded-xl p-6 shadow-sm space-y-4">
              {/* Nickname (register only) */}
              {mode === 'register' && (
                <div>
                  <label className="block text-xs text-gray-500 mb-1">닉네임</label>
                  <input
                    type="text" value={nickname} onChange={e => setNickname(e.target.value)}
                    placeholder="홍길동" required
                    className="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition"
                  />
                </div>
              )}

              {/* Email */}
              <div>
                <label className="block text-xs text-gray-500 mb-1">이메일</label>
                <input
                  type="email" value={email} onChange={e => setEmail(e.target.value)}
                  placeholder="you@example.com" required
                  className="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition"
                />
              </div>

              {/* Password */}
              <div>
                <label className="block text-xs text-gray-500 mb-1">비밀번호</label>
                <input
                  type="password" value={password} onChange={e => setPassword(e.target.value)}
                  placeholder={mode === 'register' ? '6자 이상' : '••••••••'} required
                  className="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition"
                />
              </div>

              {/* Error */}
              {error && (
                <p className="text-xs text-red-500 bg-red-50 px-3 py-2 rounded-lg">{error}</p>
              )}

              {/* Submit */}
              <button
                type="submit" disabled={loading}
                className="w-full py-2.5 bg-indigo-500 text-white text-sm font-medium rounded-lg hover:bg-indigo-600 active:bg-indigo-700 disabled:opacity-50 transition"
              >
                {loading ? '처리 중...' : (mode === 'login' ? '로그인' : '회원가입')}
              </button>
            </form>

            {/* Switch mode */}
            <p className="text-center text-sm text-gray-400 mt-4">
              {mode === 'login' ? '계정이 없으신가요?' : '이미 계정이 있으신가요?'}
              {' '}
              <button onClick={switchMode} className="text-indigo-500 hover:underline">
                {mode === 'login' ? '회원가입' : '로그인'}
              </button>
            </p>

            {/* Demo hint */}
            <div className="mt-6 p-3 bg-gray-100 rounded-lg text-xs text-gray-400 space-y-0.5">
              <p className="font-medium text-gray-500 mb-1">데모 계정</p>
              <p>alice@demo.com / alice1234</p>
              <p>bob@demo.com / bob1234</p>
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // TodoPage
    // ========================================
    function TodoPage({ user, onLogout }) {
      const [todos, setTodos]   = useState([]);
      const [filter, setFilter] = useState('all');
      const [loading, setLoading] = useState(true);
      const inputRef = useRef(null);

      useEffect(() => {
        api('GET', '/api/todos')
          .then(data => { if (data.success) setTodos(data.data); })
          .catch(err => console.error(err))
          .finally(() => setLoading(false));
      }, []);

      const addTodo = async () => {
        const text = inputRef.current.value.trim();
        if (!text) return;
        const data = await api('POST', '/api/todos', { text });
        if (data.success) {
          setTodos(prev => [...prev, data.data]);
          inputRef.current.value = '';
          inputRef.current.focus();
        }
      };

      const toggleTodo = async (id, completed) => {
        const data = await api('PATCH', `/api/todos/${id}`, { completed: !completed });
        if (data.success) setTodos(prev => prev.map(t => t.id === id ? data.data : t));
      };

      const deleteTodo = async (id) => {
        const data = await api('DELETE', `/api/todos/${id}`);
        if (data.success) setTodos(prev => prev.filter(t => t.id !== id));
      };

      const filtered = todos.filter(t => {
        if (filter === 'active')    return !t.completed;
        if (filter === 'completed') return  t.completed;
        return true;
      });
      const remaining = todos.filter(t => !t.completed).length;

      return (
        <div className="max-w-lg mx-auto px-4 py-12">
          {/* Header */}
          <div className="flex items-center justify-between mb-10">
            <div>
              <h1 className="text-3xl font-light text-gray-800 tracking-tight">Todo</h1>
              <p className="text-xs text-gray-400 mt-0.5">{user.nickname}님의 목록</p>
            </div>
            <button
              onClick={onLogout}
              className="text-xs text-gray-400 hover:text-gray-600 border border-gray-200 px-3 py-1.5 rounded-lg transition"
            >
              로그아웃
            </button>
          </div>

          {/* Input */}
          <div className="flex gap-2 mb-8">
            <input
              ref={inputRef} type="text" placeholder="할 일을 입력하세요"
              onKeyDown={e => e.key === 'Enter' && addTodo()}
              className="flex-1 px-4 py-3 bg-white border border-gray-200 rounded-lg text-sm text-gray-700 placeholder-gray-400 outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition"
            />
            <button
              onClick={addTodo}
              className="px-5 py-3 bg-indigo-500 text-white text-sm font-medium rounded-lg hover:bg-indigo-600 active:bg-indigo-700 transition"
            >
              추가
            </button>
          </div>

          {/* Filter tabs */}
          <div className="flex gap-1 mb-6 bg-gray-100 p-1 rounded-lg">
            {[['all', '전체'], ['active', '미완료'], ['completed', '완료']].map(([key, label]) => (
              <button key={key} onClick={() => setFilter(key)}
                className={`flex-1 py-2 text-sm rounded-md transition ${
                  filter === key ? 'bg-white text-indigo-600 font-medium shadow-sm' : 'text-gray-500 hover:text-gray-700'
                }`}>
                {label}
              </button>
            ))}
          </div>

          {/* Loading */}
          {loading && <p className="text-center text-gray-400 text-sm py-12">불러오는 중...</p>}

          {/* Todo list */}
          {!loading && (
            <ul className="space-y-2">
              {filtered.map(todo => (
                <li key={todo.id}
                  className="flex items-center gap-3 px-4 py-3 bg-white border border-gray-100 rounded-lg group">
                  <button onClick={() => toggleTodo(todo.id, todo.completed)}
                    className={`w-5 h-5 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition ${
                      todo.completed ? 'bg-indigo-500 border-indigo-500' : 'border-gray-300 hover:border-indigo-400'
                    }`}>
                    {todo.completed && (
                      <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                      </svg>
                    )}
                  </button>
                  <span className={`flex-1 text-sm ${todo.completed ? 'line-through text-gray-400' : 'text-gray-700'}`}>
                    {todo.text}
                  </span>
                  <button onClick={() => deleteTodo(todo.id)}
                    className="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition p-1">
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                      <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </li>
              ))}
            </ul>
          )}

          {/* Empty state */}
          {!loading && filtered.length === 0 && (
            <p className="text-center text-gray-400 text-sm py-12">
              {filter === 'all' ? '할 일을 추가해보세요' : '항목이 없습니다'}
            </p>
          )}

          {/* Footer */}
          {todos.length > 0 && (
            <p className="text-center text-gray-400 text-xs mt-8">{remaining}개 남음</p>
          )}
        </div>
      );
    }

    // ========================================
    // App (라우터)
    // ========================================
    function App() {
      const [user, setUser] = useState(() => {
        const token = localStorage.getItem('todo_token');
        if (!token) return null;
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          if (payload.exp * 1000 < Date.now()) { localStorage.removeItem('todo_token'); return null; }
          return { id: payload.id, email: payload.email, nickname: payload.nickname };
        } catch { return null; }
      });

      const handleLogin  = (u) => setUser(u);
      const handleLogout = () => {
        localStorage.removeItem('todo_token');
        setUser(null);
      };

      return user
        ? <TodoPage user={user} onLogout={handleLogout} />
        : <AuthPage onLogin={handleLogin} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
